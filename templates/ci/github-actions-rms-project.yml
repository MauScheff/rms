name: RMS Project CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Pin this to the reviewed RMS release tag used by the project.
  RMS_VERSION: v0.1.0-rc.6

jobs:
  rms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The committed-candidate check requires source provenance.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install pinned RMS CLI
        run: |
          set -euo pipefail
          cargo install \
            --git https://github.com/reliable-modular-systems/reliable-modular-systems \
            --tag "${RMS_VERSION}" \
            rms \
            --locked

      - name: Check RMS environment
        run: rms check --environment --root .

      - name: Check canonical RMS system
        run: rms check --root .

      # Add project-native focused checks here when they are not already
      # declared through implementation.yaml and reached by the change check.
      #
      # Examples:
      # - cargo test --workspace --locked
      # - swift test
      # - npm test
      # - npm run lint

      - name: Check RMS candidate changes
        run: rms check --changes --root .

      - name: Check committed RMS candidate
        run: rms check --committed --root .
