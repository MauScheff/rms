spec: rms/implementation/v0.1
module: swift-example
binding: swift
source:
  root: Sources/RmsSwiftExample
  public_entrypoint: Sources/RmsSwiftExample/RmsSwiftExample.swift
commands:
  build: swift build --package-path .
  verify: if [ "$(sysctl -in hw.optional.arm64 2>/dev/null)" = "1" ]; then arch -arm64 swift test --package-path . --disable-swift-testing; else swift test --package-path . --disable-swift-testing; fi
  trace: if [ "$(uname -s)" = Darwin ] && [ "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" = 1 ]; then arch -arm64 swift test --package-path . --filter "${RMS_TRACE_RUNNER##*#}"; else swift test --package-path . --filter "${RMS_TRACE_RUNNER##*#}"; fi
toolchain:
  package_manifest: Package.swift
  package: rms-swift-example
  target: RmsSwiftExample
dependencies:
  allowed_external_modules: []
architecture:
  shape: domain-engine
  reliability:
    properties:
    - id: accepted-swift-widget-name-is-non-empty
      proves: accepted-swift-widget-has-name
      kind: property
      input_space: arbitrary local widget names
      oracle:
      - accepted widget names are non-empty after trimming
      - rejected empty names remain explicit
      command: verify
      evidence: verification/scenarios/accept_non_empty_widget
  allowed_public_field_structs:
  - SwiftExampleTransition
  - SwiftExampleTransitionRecord
  - SwiftExampleCommandEnvelope
  - SwiftExampleEventEnvelope
  - SwiftExampleSourceProvenance
  public_modules: []
  messages:
    command_envelope:
    - command_id
    - target_machine
    - correlation_id
    - causation_id
    - idempotency_key
    event_envelope:
    - event_id
    - source_machine
    - correlation_id
    - causation_id
    - sequence
    - schema_version
    - occurred_at
  transition:
    output:
    - next_state
    - events
    - commands
    - effects
    - reply
    - rejection
  trace:
    journal: verification/traces/transition_trace.yaml
    timeline_projection: verification/traces/transition_trace.yaml
    replay_bundle: verification/traces/transition_trace.yaml
    first_bad_transition: source-provenance-from-transition-record
    producers:
    - id: swift-example-transitions
      profile: smoke
      bundle: verification/traces/transition_trace.yaml
      command: trace
      runner: Tests/RmsSwiftExampleTests/RmsSwiftExampleTests.swift#testProduceTransitionTrace
  machine:
    name: SwiftExampleMachine
    mode: stateless-decision-machine
    transition_signature: input-only
    stateless_justification: This example is a pure query over validated input with no lifecycle.
    types:
      state: SwiftExampleState
      command: DescribeSwiftWidgetCommand
      event: SwiftExampleEvent
      reply: DescribeSwiftWidgetReply
      rejection: SwiftExampleRejection
      transition: SwiftExampleTransition
      transition_record: SwiftExampleTransitionRecord
      command_envelope: SwiftExampleCommandEnvelope
      event_envelope: SwiftExampleEventEnvelope
    states:
    - Ready
    commands:
    - Describe
    - RejectEmptyName
    observed_events: []
    events:
    - WidgetDescribed
    - WidgetRejected
    effects: []
    effect_results: []
    replies:
    - Description
    rejections:
    - EmptyWidgetName
    - ExpectedEmptyName
    effect_protocols: []
    transition_function: transition
    transitions:
    - from: Ready
      on: Describe
      to: Ready
      case: DescribeWidget
      events:
      - WidgetDescribed
      reply: Description
    - from: Ready
      on: RejectEmptyName
      to: Ready
      case: RejectEmptyWidgetName
      events:
      - WidgetRejected
      rejection: EmptyWidgetName
    transition_record_function: transitionRecord
    resource_protocols: []
  roles:
    representation:
    - Sources/RmsSwiftExample/RmsSwiftExample.swift
    transition:
    - Sources/RmsSwiftExample/RmsSwiftExample.swift
    message_envelope:
    - Sources/RmsSwiftExample/RmsSwiftExample.swift
    transition_record:
    - Sources/RmsSwiftExample/RmsSwiftExample.swift
    journal:
    - verification/traces/transition_trace.yaml
    timeline_projection:
    - verification/traces/transition_trace.yaml
    replay_bundle:
    - verification/traces/transition_trace.yaml
    trace_evidence:
    - verification/scenarios/accept_non_empty_widget
    - verification/traces/transition_trace.yaml
    trace_producer:
    - Tests/RmsSwiftExampleTests/RmsSwiftExampleTests.swift
  representation:
    closed_variants:
    - DescribeSwiftWidgetCommand
    - DescribeSwiftWidgetReply
    - SwiftExampleCommandEnvelope
    - SwiftExampleEvent
    - SwiftExampleEventEnvelope
    - SwiftExampleRejection
    - SwiftExampleState
    - SwiftExampleTransition
    - SwiftExampleTransitionRecord
x-rms:
  semantic_revision:
    digest: sha256:24d2333fe45ec8834470cee4e17669f667d8f519da3bfd945e6a356dfe1c56ae
    change_record: verification/changes/regenerate-the-swift-example-transition-trace-from-its-real-transition-record-function-e9c0a4e65d6f.yaml
    applied_by: rms spec apply
    change_record_digest: sha256:e9c0a4e65d6fed949126d0af7873b3ddff1f86f7a35bc8718ab94d589f4a6366
semantic_functions:
- id: transition-model
  symbol: transition
  kind: transition
  purity: pure
