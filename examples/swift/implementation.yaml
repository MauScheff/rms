spec: rms/implementation/v0.2
module: swift-example
binding: swift
source:
  root: Sources/RmsSwiftExample
  public_entrypoint: Sources/RmsSwiftExample/RmsSwiftExample.swift
commands:
  build: swift build --package-path .
  verify: if [ "$(sysctl -in hw.optional.arm64 2>/dev/null)" = "1" ]; then arch -arm64 swift test --package-path . --disable-swift-testing; else swift test --package-path . --disable-swift-testing; fi
  trace: if [ "$(uname -s)" = Darwin ] && [ "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" = 1 ]; then arch -arm64 swift test --package-path . --filter "${RMS_TRACE_RUNNER##*#}"; else swift test --package-path . --filter "${RMS_TRACE_RUNNER##*#}"; fi
  probe: if [ "$(uname -s)" = Darwin ] && [ "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" = 1 ]; then arch -arm64 swift test --package-path . --filter "${RMS_PROBE_RUNNER##*#}"; else swift test --package-path . --filter "${RMS_PROBE_RUNNER##*#}"; fi
toolchain:
  package_manifest: Package.swift
  package: rms-swift-example
  target: RmsSwiftExample
dependencies:
  allowed_external_modules: []
architecture:
  shape: domain-engine
  probe:
    protocol: rms/machine-probe/v0.2
    command: probe
    runner: Tests/RmsSwiftExampleTests/MachineProbeTests.swift#testProbeMachine
  reliability:
    properties:
    - id: accepted-swift-widget-name-is-non-empty
      proves: accepted-swift-widget-has-name
      kind: property
      input_space: arbitrary local widget names
      oracle:
      - accepted widget names are non-empty after trimming
      - rejected empty names remain explicit
      command: verify
      evidence: verification/scenarios/accept_non_empty_widget
      realizations:
      - profile: smoke
        strategy: deterministic-corpus
        command: verify
        runner: Tests/RmsSwiftExampleTests/RmsSwiftExampleTests.swift#testMachineDescribesWidgetName
  allowed_public_field_structs:
  - SwiftExampleTransition
  - SwiftExampleTransitionRecord
  - SwiftExampleCommandEnvelope
  - SwiftExampleEventEnvelope
  - SwiftExampleSourceProvenance
  public_modules: []
  messages:
    command_envelope:
    - command_id
    - target_machine
    - correlation_id
    - causation_id
    - idempotency_key
    event_envelope:
    - event_id
    - source_machine
    - correlation_id
    - causation_id
    - sequence
    - schema_version
    - occurred_at
  transition:
    output:
    - next_state
    - events
    - commands
    - effects
    - reply
    - rejection
  trace:
    journal: verification/traces/transition_trace.yaml
    timeline_projection: verification/traces/transition_trace.yaml
    replay_bundle: verification/traces/transition_trace.yaml
    first_bad_transition: source-provenance-from-transition-record
    producers:
    - id: swift-example-transitions
      profile: smoke
      bundle: verification/traces/transition_trace.yaml
      command: trace
      runner: Tests/RmsSwiftExampleTests/RmsSwiftExampleTests.swift#testProduceTransitionTrace
  machine:
    name: SwiftExampleMachine
    mode: stateless-decision-machine
    transition_signature: input-only
    initial_state: Ready
    stateless_justification: This example is a pure query over validated input with no lifecycle.
    types:
      state: SwiftExampleState
      command: DescribeSwiftWidgetCommand
      event: SwiftExampleEvent
      reply: DescribeSwiftWidgetReply
      rejection: SwiftExampleRejection
      transition: SwiftExampleTransition
      transition_record: SwiftExampleTransitionRecord
      command_envelope: SwiftExampleCommandEnvelope
      event_envelope: SwiftExampleEventEnvelope
    states:
    - Ready
    commands:
    - Describe
    - RejectEmptyName
    observed_events: []
    events:
    - WidgetDescribed
    - WidgetRejected
    effects: []
    effect_results: []
    replies:
    - Description
    rejections:
    - EmptyWidgetName
    - ExpectedEmptyName
    effect_protocols: []
    transition_function: transition
    transitions:
    - from: Ready
      on: Describe
      to: Ready
      case: DescribeWidget
      events:
      - WidgetDescribed
      reply: Description
    - from: Ready
      on: RejectEmptyName
      to: Ready
      case: RejectEmptyWidgetName
      events:
      - WidgetRejected
      rejection: EmptyWidgetName
    transition_record_function: transitionRecord
    resource_protocols: []
  roles:
    representation:
    - Sources/RmsSwiftExample/RmsSwiftExample.swift
    transition:
    - Sources/RmsSwiftExample/RmsSwiftExample.swift
    message_envelope:
    - Sources/RmsSwiftExample/RmsSwiftExample.swift
    transition_record:
    - Sources/RmsSwiftExample/RmsSwiftExample.swift
    journal:
    - verification/traces/transition_trace.yaml
    timeline_projection:
    - verification/traces/transition_trace.yaml
    replay_bundle:
    - verification/traces/transition_trace.yaml
    trace_evidence:
    - verification/scenarios/accept_non_empty_widget
    - verification/traces/transition_trace.yaml
    trace_producer:
    - Tests/RmsSwiftExampleTests/RmsSwiftExampleTests.swift
    probe_adapter:
    - Tests/RmsSwiftExampleTests/MachineProbeTests.swift
  representation:
    closed_variants:
    - DescribeSwiftWidgetCommand
    - DescribeSwiftWidgetReply
    - SwiftExampleCommandEnvelope
    - SwiftExampleEvent
    - SwiftExampleEventEnvelope
    - SwiftExampleRejection
    - SwiftExampleState
    - SwiftExampleTransition
    - SwiftExampleTransitionRecord
  public_behavior_bindings:
  - id: describe-swift-widget-public
    public_kind: query
    public_name: describe-swift-widget
    contract: contracts/describe-swift-widget.v1.yaml
    semantic_function: describe-swift-widget-query
    machine_inputs:
    - Describe
    machine_outputs:
    - Description
    observation_source:
      kind: invocation-record
      command: trace
x-rms:
  semantic_revision:
    digest: sha256:86435b350f54fb65da6c19f1c447af6f29df9cfe5a3047d225c5c4a6bf5f800d
    change_record: verification/changes/bind-swift-widget-construction-and-the-public-query-into-the-semantic-proof-chain-198cf497147e.yaml
    applied_by: rms spec apply
    change_record_digest: sha256:198cf497147e8dcfd2e340172a814bb7c8ecf8715f1e46761a2ca4a97c50a577
semantic_functions:
- id: transition-model
  symbol: transition
  kind: transition
  purity: pure
  trust: internal
  authorities: []
- id: swift-widget-constructor
  symbol: SwiftWidget.init
  kind: constructor
  purity: pure
  trust: internal
  authorities: []
  discharges:
    invariants:
    - accepted-swift-widget-has-name
  evidence:
    laws:
    - verification/laws/accepted_swift_widget_has_name
- id: describe-swift-widget-query
  symbol: describeWidget
  kind: projector
  purity: pure
  trust: internal
  authorities: []
  discharges:
    contracts:
    - contracts/describe-swift-widget.v1.yaml
    invariants:
    - accepted-swift-widget-has-name
  evidence:
    contracts:
    - verification/contracts/describe_swift_widget
    laws:
    - verification/laws/accepted_swift_widget_has_name
