spec: rms/probe-assembly/v0.3
instances:
  - id: source
    implementation: ../probe-topologies/source/implementation.fixture
  - id: worker
    implementation: ../probe-topologies/worker/implementation.fixture
stimuli:
  - id: start-a
    target: source
    at: {value: 0, unit: ms}
    input: {kind: command, name: Start, data: {request: a}}
  - id: start-b
    target: source
    at: {value: 0, unit: ms}
    input: {kind: command, name: Start, data: {request: b}}
checks:
  - id: no-request-is-rejected-busy
    when: always
    assert: {kind: message-count, name: IllegalTransition, max: 0}
  - id: both-requests-complete
    when: quiescent
    assert: {kind: message-count, name: Completed, equals: 4}
exploration:
  max_steps: 12
  max_schedules: 50
  max_states: 500
