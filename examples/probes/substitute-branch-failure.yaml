spec: rms/probe-assembly/v0.1
instances:
  - id: source
    implementation: ../probe-topologies/source/implementation.fixture
stimuli:
  - id: start
    target: source
    input: {kind: command, name: Start, data: {}}
substitutes:
  - id: work-substitute
    source: source
    output: {kind: effect, name: Work}
    outcomes:
      - id: success
        target: source
        input: {kind: effect-result, name: Done, data: {}}
      - id: unavailable
        target: source
        input:
          kind: effect-result
          name: Failed
          data: {reason: unavailable}
checks:
  - id: every-substitute-outcome-completes
    when: quiescent
    assert:
      kind: state
      instance: source
      equals: {name: Ready, data: {}}
exploration:
  max_steps: 8
  max_schedules: 20
  max_states: 100
