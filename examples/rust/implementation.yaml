spec: rms/implementation/v0.1

module: rust-example
binding: rust

source:
  root: .
  public_entrypoint: src/lib.rs

commands:
  build: cargo build --manifest-path Cargo.toml
  verify: cargo test --manifest-path Cargo.toml
  format: cargo fmt --manifest-path Cargo.toml --check

toolchain:
  cargo_manifest: Cargo.toml
  package: rms-rust-example

dependencies:
  allowed_external_crates:
    - serde

architecture:
  shape: domain-engine
  public_modules:
    - widget
  messages:
    command_envelope:
      - command_id
      - target_machine
      - correlation_id
      - causation_id
      - idempotency_key
    event_envelope:
      - event_id
      - source_machine
      - correlation_id
      - causation_id
      - sequence
      - schema_version
      - occurred_at
  transition:
    output:
      - next_state
      - events
      - commands
      - effects
      - reply
  trace:
    journal: verification/traces/transition_trace.yaml
    timeline_projection: verification/traces/transition_trace.yaml
    replay_bundle: verification/traces/transition_trace.yaml
    first_bad_transition: source-provenance-from-transition-record
  machine:
    name: RustExampleMachine
    mode: stateless-decision-machine
    stateless_justification: "describe-widget is a pure query over already validated input; no lifecycle or ordering state is owned by this example"
    state: RustExampleState
    states:
      - Ready
    commands:
      - DescribeWidgetCommand
    events: []
    effects: []
    effect_results: []
    replies:
      - DescribeWidgetReply
    rejections: []
    transition_function: describe_widget
  roles:
    representation:
      - src/widget.rs
    transition:
      - src/lib.rs
    message_envelope:
      - src/widget.rs
    transition_record:
      - src/lib.rs
    journal:
      - verification/traces/transition_trace.yaml
    timeline_projection:
      - verification/traces/transition_trace.yaml
    replay_bundle:
      - verification/traces/transition_trace.yaml
    trace_evidence:
      - verification/scenarios/widget_acceptance
      - verification/traces/transition_trace.yaml

semantic_functions:
  - id: widget-constructor
    symbol: Widget::new
    kind: constructor
    purity: pure
    discharges:
      invariants:
        - accepted-widget-has-name
    assumptions:
      ensures:
        - when output is Some, output.name().trim() is not empty
    evidence:
      laws:
        - verification/laws/accepted_widget_has_name
      scenarios:
        - verification/scenarios/widget_acceptance
  - id: describe-widget-query
    symbol: describe_widget
    kind: projector
    purity: pure
    discharges:
      contracts:
        - contracts/describe-widget.v1.yaml
      invariants:
        - accepted-widget-has-name
    assumptions:
      requires:
        - widget was constructed through Widget::new
      ensures:
        - output == widget.name()
    evidence:
      contracts:
        - verification/contracts/describe_widget_contract
