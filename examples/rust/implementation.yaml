spec: rms/implementation/v0.1
module: rust-example
binding: rust
source:
  root: .
  public_entrypoint: src/lib.rs
commands:
  build: cargo build --manifest-path Cargo.toml
  verify: cargo test --manifest-path Cargo.toml
  format: cargo fmt --manifest-path Cargo.toml --check
toolchain:
  cargo_manifest: Cargo.toml
  package: rms-rust-example
dependencies:
  allowed_external_crates:
  - serde
architecture:
  shape: domain-engine
  reliability:
    properties:
    - id: accepted-widget-name-is-non-empty
      proves: accepted-widget-has-name
      kind: property
      input_space: arbitrary local widget names
      oracle:
      - accepted widget names are non-empty after trimming
      - rejected empty names remain explicit
      command: verify
      evidence: verification/laws/accepted_widget_has_name
  allowed_public_field_structs:
  - RustExampleTransition
  - RustExampleTransitionRecord
  - RustExampleCommandEnvelope
  - RustExampleEventEnvelope
  - RustExampleSourceProvenance
  public_modules:
  - widget
  messages:
    command_envelope:
    - command_id
    - target_machine
    - correlation_id
    - causation_id
    - idempotency_key
    event_envelope:
    - event_id
    - source_machine
    - correlation_id
    - causation_id
    - sequence
    - schema_version
    - occurred_at
  transition:
    output:
    - next_state
    - events
    - commands
    - effects
    - reply
    - rejection
  trace:
    journal: verification/traces/transition_trace.yaml
    timeline_projection: verification/traces/transition_trace.yaml
    replay_bundle: verification/traces/transition_trace.yaml
    first_bad_transition: source-provenance-from-transition-record
  machine:
    name: RustExampleMachine
    mode: stateless-decision-machine
    transition_signature: input-only
    stateless_justification: This example is a pure query over validated input with no lifecycle.
    types:
      state: RustExampleState
      command: DescribeWidgetCommand
      event: RustExampleEvent
      reply: DescribeWidgetReply
      rejection: RustExampleRejection
      transition: RustExampleTransition
      transition_record: RustExampleTransitionRecord
      command_envelope: RustExampleCommandEnvelope
      event_envelope: RustExampleEventEnvelope
    states:
    - Ready
    commands:
    - Describe
    - RejectEmptyName
    observed_events: []
    events:
    - WidgetDescribed
    - WidgetRejected
    effects: []
    effect_results: []
    replies:
    - Description
    - Rejected
    rejections:
    - EmptyWidgetName
    - ExpectedEmptyName
    effect_protocols: []
    transition_function: transition
    transitions:
    - from: Ready
      on: Describe
      to: Ready
      case: DescribeWidget
      events:
      - WidgetDescribed
      reply: Description
    - from: Ready
      on: RejectEmptyName
      to: Ready
      case: RejectEmptyWidgetName
      events:
      - WidgetRejected
      rejection: EmptyWidgetName
    transition_record_function: transition_record
  roles:
    representation:
    - src/widget.rs
    transition:
    - src/widget.rs
    message_envelope:
    - src/widget.rs
    transition_record:
    - src/lib.rs
    journal:
    - verification/traces/transition_trace.yaml
    timeline_projection:
    - verification/traces/transition_trace.yaml
    replay_bundle:
    - verification/traces/transition_trace.yaml
    trace_evidence:
    - verification/scenarios/widget_acceptance
    - verification/traces/transition_trace.yaml
  representation:
    closed_variants:
    - DescribeWidgetCommand
    - DescribeWidgetReply
    - RustExampleCommandEnvelope
    - RustExampleEvent
    - RustExampleEventEnvelope
    - RustExampleRejection
    - RustExampleState
    - RustExampleTransition
    - RustExampleTransitionRecord
semantic_functions:
- id: widget-constructor
  symbol: Widget::new
  kind: constructor
  purity: pure
  discharges:
    invariants:
    - accepted-widget-has-name
  assumptions:
    ensures:
    - when output is Some, output.name().trim() is not empty
  evidence:
    laws:
    - verification/laws/accepted_widget_has_name
    scenarios:
    - verification/scenarios/widget_acceptance
- id: describe-widget-query
  symbol: describe_widget
  kind: projector
  purity: pure
  discharges:
    contracts:
    - contracts/describe-widget.v1.yaml
    invariants:
    - accepted-widget-has-name
  assumptions:
    requires:
    - widget was constructed through Widget::new
    ensures:
    - output == widget.name()
  evidence:
    contracts:
    - verification/contracts/describe_widget_contract
- id: transition-model
  symbol: transition
  kind: transition
  purity: pure
x-rms:
  semantic_revision:
    digest: sha256:41bb63829d46ae00efe89a89385c88a982ecda54a21df753883b53aec1447de5
    change_record: verification/machine-changes/machine-change-d662e4cc1af4.yaml
    applied_by: rms machine apply
    change_record_digest: sha256:d662e4cc1af4e5168182a9fcd51fc7c6a7767cce9a85e0225fc534f1652c9671
