spec: rms/implementation/v0.1
module: tic-tac-toe-rules
binding: rust
source:
  root: .
  public_entrypoint: src/lib.rs
commands:
  build: cargo build --manifest-path Cargo.toml
  verify: cargo test --manifest-path Cargo.toml
  format: cargo fmt --manifest-path Cargo.toml --check
  trace: cargo test --manifest-path Cargo.toml "${RMS_TRACE_RUNNER##*#}"
  probe: cargo test --manifest-path Cargo.toml "${RMS_PROBE_RUNNER##*#}" -- --nocapture
toolchain:
  cargo_manifest: Cargo.toml
  package: tic-tac-toe-rules
dependencies:
  allowed_external_crates:
  - serde_json
architecture:
  shape: domain-engine
  probe:
    protocol: rms/machine-probe/v0.2
    command: probe
    runner: tests/machine_probe.rs#probe_machine
    initial_state_function: src/representation.rs#initial_game
  reliability:
    properties:
    - id: legal-moves-preserve-game-laws
      proves: marks-never-overwrite
      kind: property
      input_space: finite boards and validated place-mark commands
      oracle:
      - accepted moves fill exactly one empty cell
      - rejected moves preserve state
      - terminal games reject further moves
      command: verify
      evidence: verification/laws/transition_trace.md
    - id: apply-move-refines-cli-requirement
      proves: marks-never-overwrite
      kind: property
      input_space: every rules-reachable game state paired with each of the nine validated board cells
      oracle:
      - every invocation returns exactly one accepted reply or declared rejection
      - accepted and rejected transitions stay inside the consumer state, event, and effect frame
      - all accepted successor states remain in the exhaustively explored finite closure
      command: verify
      evidence: verification/properties/apply_move_refinement.md
  allowed_public_field_structs:
  - TicTacToeTransition
  - TicTacToeTransitionRecord
  - TicTacToeCommandEnvelope
  - TicTacToeEventEnvelope
  - TicTacToeSourceProvenance
  public_modules:
  - representation
  - transition
  messages:
    command_envelope:
    - command_id
    - target_machine
    - correlation_id
    - causation_id
    - idempotency_key
    event_envelope:
    - event_id
    - source_machine
    - correlation_id
    - causation_id
    - sequence
    - schema_version
    - occurred_at
  transition:
    output:
    - next_state
    - events
    - commands
    - effects
    - reply
    - rejection
  trace:
    journal: verification/traces/transition_trace.yaml
    timeline_projection: verification/traces/transition_trace.yaml
    replay_bundle: verification/traces/transition_trace.yaml
    first_bad_transition: source-provenance-from-transition-record
    producers:
    - id: tic-tac-toe-rule-transitions
      profile: smoke
      bundle: verification/traces/transition_trace.yaml
      command: trace
      runner: tests/trace_producer.rs#produce_transition_trace
  machine:
    name: TicTacToeMachine
    mode: stateful-transition-machine
    transition_signature: state-and-input
    initial_state: InProgress
    types:
      state: Game
      input: TicTacToeInput
      command: Command
      event: TicTacToeEvent
      reply: TransitionOutcome
      rejection: MoveRejection
      transition: TicTacToeTransition
      transition_record: TicTacToeTransitionRecord
      command_envelope: TicTacToeCommandEnvelope
      event_envelope: TicTacToeEventEnvelope
    states:
    - InProgress
    - Won
    - Draw
    commands:
    - PlaceMark
    observed_events: []
    events:
    - MarkPlaced
    - MoveRejected
    effects: []
    effect_results: []
    replies:
    - Accepted
    - Rejected
    rejections:
    - CellOccupied
    - GameAlreadyTerminal
    effect_protocols: []
    transition_function: transition
    transitions:
    - from: InProgress
      on: PlaceMark
      to: InProgress
      case: PlaceMarkContinues
      events:
      - MarkPlaced
      reply: Accepted
    - from: InProgress
      on: PlaceMark
      to: Won
      case: PlaceMarkWins
      events:
      - MarkPlaced
      reply: Accepted
    - from: InProgress
      on: PlaceMark
      to: Draw
      case: PlaceMarkDraws
      events:
      - MarkPlaced
      reply: Accepted
    - from: InProgress
      on: PlaceMark
      to: InProgress
      case: RejectOccupiedCell
      events:
      - MoveRejected
      rejection: CellOccupied
    - from: Won
      on: PlaceMark
      to: Won
      case: RejectMoveAfterWin
      events:
      - MoveRejected
      rejection: GameAlreadyTerminal
    - from: Draw
      on: PlaceMark
      to: Draw
      case: RejectMoveAfterDraw
      events:
      - MoveRejected
      rejection: GameAlreadyTerminal
    transition_record_function: transition_record
    resource_protocols: []
  roles:
    representation:
    - src/representation.rs
    transition:
    - src/transition.rs
    message_envelope:
    - src/representation.rs
    transition_record:
    - src/transition.rs
    journal:
    - verification/traces/transition_trace.yaml
    timeline_projection:
    - verification/traces/transition_trace.yaml
    replay_bundle:
    - verification/traces/transition_trace.yaml
    trace_evidence:
    - verification/laws/transition_trace.md
    - verification/traces/transition_trace.yaml
    trace_producer:
    - tests/trace_producer.rs
    probe_adapter:
    - tests/machine_probe.rs
  representation:
    closed_variants:
    - Command
    - GameStatus
    - TicTacToeInput
    - TicTacToeEvent
    - Mark
    - MoveRejection
    - TransitionOutcome
    - Game
    - TicTacToeCommandEnvelope
    - TicTacToeEventEnvelope
    - TicTacToeTransition
    - TicTacToeTransitionRecord
    validated_values:
    - Cell
    transition_functions:
    - transition
  public_behavior_bindings:
  - id: apply-move-public
    public_kind: command
    public_name: apply-move
    contract: contracts/apply-move.v1.yaml
    semantic_function: transition-model
    machine_inputs:
    - PlaceMark
    machine_outputs:
    - MarkPlaced
    - MoveRejected
    - Accepted
    - Rejected
    - CellOccupied
    - GameAlreadyTerminal
    observation_source:
      kind: transition-record
      command: trace
semantic_functions:
- id: cell-constructor
  symbol: Cell::new
  kind: constructor
  purity: pure
  evidence:
    laws:
    - verification/laws/transition_trace.md
- id: transition-model
  symbol: transition
  kind: transition
  purity: pure
  discharges:
    contracts:
    - contracts/apply-move.v1.yaml
    invariants:
    - marks-never-overwrite
    - turns-alternate
    - terminal-games-reject-moves
  evidence:
    laws:
    - verification/laws/transition_trace.md
    contracts:
    - verification/contracts/apply_move.md
    scenarios:
    - verification/scenarios/game_lifecycle.md
    traces:
    - verification/traces/transition_trace.yaml
- id: trace-replay
  symbol: replay
  kind: interpreter
  purity: pure
  evidence:
    laws:
    - verification/laws/transition_trace.md
    traces:
    - verification/traces/transition_trace.yaml
x-rms:
  semantic_revision:
    digest: sha256:abc6947f025da51cb83840919a5224c3882e76e4a52711470f21cf2439edad0d
    change_record: verification/changes/bind-the-tic-tac-toe-rules-command-to-the-pure-transition-and-exact-machine-cases-244c702176bc.yaml
