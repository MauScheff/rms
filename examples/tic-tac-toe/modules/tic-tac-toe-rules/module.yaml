spec: rms/module/v0.1
module:
  name: tic-tac-toe-rules
  version: 0.1.0
  kind: library
  purpose: Own Tic-Tac-Toe board rules, legal moves, turn order, and terminal outcomes
profiles:
- core
- stateful
owns:
  concepts:
  - Board
  - Cell
  - Mark
  - Move command
  - Game status
  - Transition outcome
  data:
  - Game state
  decisions:
  - move acceptance
  - turn advancement
  - win detection
  - draw detection
  - illegal move rejection
provides:
