spec: rms/contract/v0.2
name: apply-move
version: 1
kind: command
meaning: Apply one Tic-Tac-Toe move to a game state using the rules for turn order,
  occupied cells, wins, draws, and terminal states.
semantics:
  behavior:
    observations: []
    requires:
    - id: cell-is-valid
      statement: The requested cell is one of the nine board cells.
      evaluation:
        kind: external
        property: legal-moves-preserve-game-laws
    - id: state-created-by-rules
      statement: The input game state was created by the rules module constructors
        or by replaying accepted transitions.
      evaluation:
        kind: external
        property: legal-moves-preserve-game-laws
    guarantees:
    - id: accepted-move-places-current-mark
      statement: When the move is accepted, the current mark is placed in the requested
        empty cell.
      evaluation:
        kind: external
        property: legal-moves-preserve-game-laws
    - id: accepted-move-advances-status
      statement: Accepted moves either advance the next mark, produce a won status,
        or produce a draw status.
      evaluation:
        kind: external
        property: legal-moves-preserve-game-laws
    - id: rejected-move-preserves-state
      statement: Rejected moves return the previous game state with an explicit rejection
        reason.
      evaluation:
        kind: external
        property: legal-moves-preserve-game-laws
    failures:
    - id: occupied-cell
      statement: The requested cell already contains a mark.
      evaluation:
        kind: external
        property: legal-moves-preserve-game-laws
    - id: game-already-terminal
      statement: The game has already been won or drawn.
      evaluation:
        kind: external
        property: legal-moves-preserve-game-laws
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
  external_refinement:
    property: apply-move-refines-cli-requirement
    evidence: ../verification/properties/apply_move_refinement.json
