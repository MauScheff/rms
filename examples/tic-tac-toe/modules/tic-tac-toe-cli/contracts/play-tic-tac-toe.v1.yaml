spec: rms/contract/v0.2
name: play-tic-tac-toe
version: 1
kind: command
meaning: Accept local text input for a Tic-Tac-Toe move, parse it into a board cell
  command, and delegate valid commands to the rules engine port.
semantics:
  behavior:
    observations: []
    requires:
    - id: rules-port-available
      statement: A rules engine port is provided for valid parsed move commands.
      evaluation:
        kind: external
        property: tic-tac-toe-cli-malformed-input-stops-before-domain
    guarantees:
    - id: valid-input-delegated
      statement: Valid coordinate input is converted to a move command and passed
        through the rules engine port to the declared `tic-tac-toe-rules` dependency.
      evaluation:
        kind: external
        property: tic-tac-toe-cli-malformed-input-stops-before-domain
    - id: malformed-input-rejected
      statement: Malformed or out-of-board input is rejected before rules engine delegation.
      evaluation:
        kind: external
        property: tic-tac-toe-cli-malformed-input-stops-before-domain
    - id: rules-result-returned
      statement: Rules-engine accepted and rejected outcomes are returned explicitly
        to the boundary caller.
      evaluation:
        kind: external
        property: tic-tac-toe-cli-malformed-input-stops-before-domain
    failures:
    - id: malformed-input
      statement: The input cannot be parsed as a board cell.
      evaluation:
        kind: external
        property: tic-tac-toe-cli-malformed-input-stops-before-domain
    - id: rules-rejection
      statement: The rules engine rejects a syntactically valid move for domain reasons
        such as occupied cell or terminal game.
      evaluation:
        kind: external
        property: tic-tac-toe-cli-malformed-input-stops-before-domain
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
