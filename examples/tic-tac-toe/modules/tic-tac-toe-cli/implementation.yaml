spec: rms/implementation/v0.1
module: tic-tac-toe-cli
binding: js
source:
  root: .
  public_entrypoint: src/adapter.mjs
commands:
  build: sh scripts/build.sh
  verify: sh scripts/smoke.sh
  fuzz: node tests/boundary-smoke.mjs
  trace: node --input-type=module -e 'import { pathToFileURL } from "node:url"; const [path, name] = process.env.RMS_TRACE_RUNNER.split("#"); const module = await import(pathToFileURL(path)); await module[name]();'
  probe: node tests/machine-probe.mjs
toolchain:
  runner: node
dependencies:
  allowed_processes:
  - sh
  - node
  - cargo
architecture:
  shape: boundary-adapter
  probe:
    protocol: rms/machine-probe/v0.2
    command: probe
    runner: tests/machine-probe.mjs#probeMachine
    initial_state_function: src/representation.mjs#initialState
  public_modules:
  - src/representation.mjs
  - src/parser.mjs
  - src/ports.mjs
  - src/adapter.mjs
  reliability:
    fuzz_targets:
    - id: tic-tac-toe-cli-malformed-input-stops-before-domain
      proves: boundary-parse
      kind: fuzz
      input_space:
        raw_cli_input:
        - generated empty and whitespace strings
        - generated out-of-board coordinates
        - valid mixed-case board coordinates
      operation: handleBoundaryInput
      oracle:
      - malformed input returns a typed rejection
      - malformed input does not delegate to the rules module
      - accepted input delegates only parsed board cells
      evidence:
        path: verification/fuzz/malformed_input_fuzz.md
      counterexamples:
        path: verification/fuzz/counterexamples
      realizations:
      - profile: smoke
        strategy: generated-property
        command: fuzz
        generator: src/parser.mjs#generateMalformedInputCases
        runner: tests/boundary-smoke.mjs#runMalformedInputProperty
  messages:
    command_envelope:
    - command_id
    - target_machine
    - correlation_id
    - causation_id
    - idempotency_key
    event_envelope:
    - event_id
    - source_machine
    - correlation_id
    - causation_id
    - sequence
    - schema_version
    - occurred_at
    effect_envelope:
    - effect_id
    - requester
    - correlation_id
    - causation_id
    - idempotency_key
    effect_result_envelope:
    - effect_id
    - requester
    - correlation_id
    - causation_id
    - status
  transition:
    output:
    - next_state
    - events
    - commands
    - effects
    - reply
    - rejection
  trace:
    journal: verification/traces/boundary_parse.yaml
    timeline_projection: verification/traces/boundary_parse.yaml
    replay_bundle: verification/traces/boundary_parse.yaml
    first_bad_transition: source-provenance-from-transition-record
    producers:
    - id: tic-tac-toe-boundary-transitions
      profile: smoke
      bundle: verification/traces/boundary_parse.yaml
      command: trace
      runner: tests/trace-producer.mjs#produceTransitionTrace
  machine:
    name: TicTacToeBoundaryMachine
    mode: boundary-machine
    transition_signature: state-and-input
    initial_state: AwaitingInput
    types:
      state: TicTacToeBoundaryState
      input: TicTacToeBoundaryInput
      command: TicTacToeBoundaryCommand
      event: TicTacToeBoundaryEvent
      effect: TicTacToeBoundaryEffect
      effect_result: TicTacToeBoundaryEffectResult
      reply: TicTacToeBoundaryReply
      rejection: TicTacToeBoundaryRejection
      transition: TicTacToeBoundaryTransition
      transition_record: TicTacToeBoundaryTransitionRecord
      command_envelope: TicTacToeBoundaryCommandEnvelope
      event_envelope: TicTacToeBoundaryEventEnvelope
      effect_envelope: TicTacToeBoundaryEffectEnvelope
      effect_result_envelope: TicTacToeBoundaryEffectResultEnvelope
    states:
    - AwaitingInput
    - AwaitingRulesResult
    commands:
    - RunMove
    observed_events: []
    events:
    - MoveParsed
    - RulesInvocationRequested
    - RulesInvocationCompleted
    - RunRejected
    effects:
    - InvokeRulesBridge
    effect_results:
    - RulesBridgeSucceeded
    - RulesBridgeFailed
    replies:
    - Accepted
    - Rejected
    rejections:
    - MalformedInput
    - OutOfBoard
    - RulesBridgeFailure
    - IllegalTransition
    effect_protocols:
    - effect: InvokeRulesBridge
      results:
      - RulesBridgeSucceeded
      - RulesBridgeFailed
      executor_role: effect_executor
      executor_symbol: executeRulesBridge
      atomicity: one-request-one-result
    transition_function: transition
    transitions:
    - from: AwaitingInput
      on: RunMove
      to: AwaitingRulesResult
      case: RunMove
      events:
      - MoveParsed
      - RulesInvocationRequested
      effects:
      - InvokeRulesBridge
      no_reply_justification: the rules bridge result is pending
    - from: AwaitingInput
      on: RunMove
      to: AwaitingInput
      case: RunRejected
      events:
      - RunRejected
      rejection: MalformedInput
    - from: AwaitingRulesResult
      on: RulesBridgeSucceeded
      to: AwaitingInput
      case: RulesBridgeSucceeded
      events:
      - RulesInvocationCompleted
      reply: Accepted
    - from: AwaitingRulesResult
      on: RulesBridgeFailed
      to: AwaitingInput
      case: RulesBridgeFailed
      events:
      - RunRejected
      rejection: RulesBridgeFailure
    driver_function: driveMachine
    transition_record_function: transitionRecord
    resource_protocols: []
  roles:
    representation:
    - src/representation.mjs
    message_envelope:
    - src/representation.mjs
    parser:
    - src/parser.mjs
    transition:
    - src/transition.mjs
    adapter:
    - src/adapter.mjs
    effect_executor:
    - src/ports.mjs
    transition_record:
    - src/transition.mjs
    journal:
    - verification/traces/boundary_parse.yaml
    timeline_projection:
    - verification/traces/boundary_parse.yaml
    replay_bundle:
    - verification/traces/boundary_parse.yaml
    trace_evidence:
    - verification/boundaries/cli_input.md
    - verification/traces/boundary_parse.yaml
    runnable_surface:
    - src/adapter.mjs
    machine_driver:
    - src/machine_driver.mjs
    trace_producer:
    - tests/trace-producer.mjs
    probe_adapter:
    - tests/machine-probe.mjs
  representation:
    closed_variants:
    - TicTacToeBoundaryState
    - TicTacToeBoundaryInput
    - TicTacToeBoundaryCommand
    - TicTacToeBoundaryEvent
    - TicTacToeBoundaryEffect
    - TicTacToeBoundaryEffectResult
    - TicTacToeBoundaryReply
    - TicTacToeBoundaryRejection
    - TicTacToeBoundaryCommandEnvelope
    - TicTacToeBoundaryEffectEnvelope
    - TicTacToeBoundaryEffectResultEnvelope
    - TicTacToeBoundaryEventEnvelope
    - TicTacToeBoundaryTransition
    - TicTacToeBoundaryTransitionRecord
    validated_values:
    - makeCell
    transition_functions:
    - transition
  effect_roles:
  - representation
  - parsers
  - ports
  - adapters
  - rules-bridge
  - boundary-evidence
  surfaces:
  - name: tic-tac-toe-cli-cli
    kind: runnable-boundary
    surface: cli
    entrypoint: src/adapter.mjs
    delegates_to:
      role: adapter
      symbol: src/adapter.mjs#handleBoundaryInput
      command: play-tic-tac-toe
    effects:
    - local-cli-io
    evidence:
    - verification/boundaries/runnable_surface_routes_through_boundary.md
    usage_document: README.md
    smoke_command: verify
  allowed_public_field_structs:
  - TicTacToeBoundaryCommandEnvelope
  - TicTacToeBoundaryEffectEnvelope
  - TicTacToeBoundaryEffectResultEnvelope
  - TicTacToeBoundaryEventEnvelope
  - TicTacToeBoundarySourceProvenance
  - TicTacToeBoundaryTransition
  - TicTacToeBoundaryTransitionRecord
  public_behavior_bindings:
  - id: play-tic-tac-toe-public
    public_kind: command
    public_name: play-tic-tac-toe
    contract: contracts/play-tic-tac-toe.v1.yaml
    semantic_function: rules-port-adapter-reply
    machine_inputs:
    - RunMove
    machine_outputs:
    - MoveParsed
    - RulesInvocationRequested
    - RulesInvocationCompleted
    - RunRejected
    - InvokeRulesBridge
    - Accepted
    - Rejected
    - MalformedInput
    - OutOfBoard
    - RulesBridgeFailure
    - IllegalTransition
  dependency_behavior_bindings:
  - id: apply-move-provider
    capability: apply-move
    contract: contracts/apply-move.v1.yaml
    consumer: src/ports.mjs#createRulesEffectExecutor
    resolution: module
    provider_module: tic-tac-toe-rules
    provider_contract: contracts/apply-move.v1.yaml
semantic_functions:
- id: cell-parser
  symbol: src/representation.mjs#makeCell
  kind: constructor
  purity: pure
  evidence:
    boundaries:
    - verification/boundaries/cli_input.md
- id: move-parser
  symbol: src/parser.mjs#parseMoveText
  kind: parser
  purity: pure
  discharges:
    contracts:
    - contracts/play-tic-tac-toe.v1.yaml
  evidence:
    contracts:
    - verification/contracts/play_tic_tac_toe.md
    boundaries:
    - verification/boundaries/cli_input.md
    traces:
    - verification/traces/boundary_parse.yaml
- id: boundary-transition
  symbol: src/transition.mjs#transition
  kind: transition
  purity: pure
  discharges:
    contracts:
    - contracts/play-tic-tac-toe.v1.yaml
  evidence:
    contracts:
    - verification/contracts/play_tic_tac_toe.md
    boundaries:
    - verification/boundaries/cli_input.md
    traces:
    - verification/traces/boundary_parse.yaml
- id: rules-port-adapter-reply
  symbol: src/adapter.mjs#handleBoundaryInput
  kind: adapter
  purity: boundary
  discharges:
    contracts:
    - contracts/play-tic-tac-toe.v1.yaml
  evidence:
    contracts:
    - verification/contracts/play_tic_tac_toe.md
    boundaries:
    - verification/boundaries/cli_input.md
- id: rust-rules-effect-executor
  symbol: src/ports.mjs#createRulesEffectExecutor
  kind: adapter
  purity: effectful
  discharges:
    contracts:
    - contracts/play-tic-tac-toe.v1.yaml
  evidence:
    contracts:
    - verification/contracts/play_tic_tac_toe.md
- id: invokerulesbridge-effect-executor
  symbol: executeRulesBridge
  kind: effect-executor
  purity: effectful
x-rms:
  semantic_revision:
    digest: sha256:1696791eaa87a19839c23d957bad8b57bc233e12b7ca1b2e47225edeb151ce76
    change_record: verification/changes/bind-the-tic-tac-toe-cli-command-and-its-rules-dependency-through-exact-boundary-symbols-1411830423e3.yaml
    change_record_digest: sha256:1411830423e3ad531b0b2205e8bc6621b9d004f7e62eda2922adbf054bdc5047
    applied_by: rms spec apply
