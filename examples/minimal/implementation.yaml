spec: rms/implementation/v0.2

module: example
binding: fixture

source:
  root: src
  public_entrypoint: src/example.txt

commands:
  build: test -f src/example.txt
  verify: test -f verification/laws/example_is_valid
  format: "true"

architecture:
  shape: domain-engine
  reliability:
    properties:
      - id: example-fixture-remains-valid
        proves: example-is-valid
        kind: property
        input_space: the single checked fixture artifact
        oracle:
          - the declared fixture evidence exists
        command: verify
        evidence: verification/laws/example_is_valid
        realizations:
          - profile: smoke
            strategy: deterministic-corpus
            command: verify
            runner: src/example.txt#placeholder
  static_inspection: opaque
  dependency_checker: manual-fixture-review
  machine:
    name: ExampleMachine
    mode: stateless-decision-machine
    transition_signature: input-only
    stateless_justification: the fixture validates one immutable example without lifecycle or ordering
    types:
      state: ExampleState
      command: ExampleCommand
      event: ExampleEvent
      reply: ExampleReply
      rejection: ExampleRejection
      transition: ExampleTransition
      transition_record: ExampleTransitionRecord
    states: [Ready]
    commands: [ValidateExample]
    observed_events: []
    events: [ExampleValidated]
    effects: []
    effect_results: []
    replies: [ExampleAccepted]
    rejections: [ExampleInvalid]
    effect_protocols: []
    transition_function: validate_example
    transitions:
      - from: Ready
        on: ValidateExample
        to: Ready
        events: [ExampleValidated]
        reply: ExampleAccepted
  roles:
    representation:
      - implementation.yaml
    transition:
      - src/example.txt
