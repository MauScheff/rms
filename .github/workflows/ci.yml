name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  release-check:
    runs-on: ubuntu-latest
    env:
      # RMS tests create nested Cargo fixtures. Bound both layers so the hosted
      # runner cannot lose its agent under concurrent compiler pressure.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cvc5 reference solver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/cvc5-Linux-x86_64-static.zip"
          gh release download cvc5-1.3.2 --repo cvc5/cvc5 --pattern cvc5-Linux-x86_64-static.zip --dir "$RUNNER_TEMP"
          test "$(sha256sum "$archive" | cut -d " " -f 1)" = "1060daaf507edef9d0a68e399cfc0e9038150bccb9e2d34d081d50a7687544d2"
          unzip -q "$archive" -d "$RUNNER_TEMP/cvc5"
          echo "$RUNNER_TEMP/cvc5/cvc5-Linux-x86_64-static/bin" >> "$GITHUB_PATH"
      - name: cvc5 behavioral-contract conformance
        run: cargo test -p rms --locked behavioral_contract::tests::cvc5_reference_solver_conformance -- --ignored --exact
      - name: RMS native release proofs
        run: |
          set -euo pipefail
          provider_test="tests::provider_pipeline_repairs_caches_refreshes_and_deduplicates"
          RUST_TEST_THREADS=1 cargo test -p rms --locked "$provider_test" -- --exact
          RUST_TEST_THREADS=1 cargo test -p rms --locked -- --skip "$provider_test"
          cargo fmt --all --check
          cargo build -p rms --locked
      - name: RMS strict committed audit
        run: target/debug/rms check --committed --root .

  behavioral-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cross-platform behavioral-contract corpus
        run: cargo test -p rms --locked behavioral_contract::tests
      - name: Cross-platform structural and composition checks
        run: |
          cargo run -p rms --locked -- validate --root . --json
          cargo run -p rms --locked -- compose --root . --json

  python-binding:
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generated Python binding tests
        run: |
          cargo test -p rms --locked tests::python_module_scaffold_generates_valid_binding_artifacts -- --exact
          cargo test -p rms --locked tests::python_boundary_and_workflow_scaffolds_verify -- --exact
