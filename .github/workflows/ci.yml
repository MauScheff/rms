name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: RMS release check
        run: |
          set -euo pipefail
          provider_test="tests::provider_pipeline_repairs_caches_refreshes_and_deduplicates"
          RUST_TEST_THREADS=1 cargo test -p rms --locked "$provider_test" -- --exact
          cargo build -p rms --locked

          real_cargo="$(command -v cargo)"
          wrapper_dir="$RUNNER_TEMP/rms-cargo-wrapper"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/cargo" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "\$#" -eq 1 ] && [ "\$1" = "test" ]; then
            exec "$real_cargo" test -- --skip "$provider_test"
          fi
          exec "$real_cargo" "\$@"
          EOF
          chmod +x "$wrapper_dir/cargo"

          PATH="$wrapper_dir:$PATH" target/debug/rms release check --root .
