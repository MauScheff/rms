name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: RMS release check
        run: |
          set -euo pipefail
          provider_test="tests::provider_pipeline_repairs_caches_refreshes_and_deduplicates"
          RUST_TEST_THREADS=1 cargo test -p rms --locked "$provider_test" -- --exact
          cargo build -p rms --locked

          real_cargo="$(command -v cargo)"
          wrapper_dir="$RUNNER_TEMP/rms-cargo-wrapper"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/cargo" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "\${1:-}" = "test" ]; then
            for argument in "\$@"; do
              if [ "\$argument" = "--" ]; then
                exec "$real_cargo" "\$@" --skip "$provider_test"
              fi
            done
            exec "$real_cargo" "\$@" -- --skip "$provider_test"
          fi
          exec "$real_cargo" "\$@"
          EOF
          chmod +x "$wrapper_dir/cargo"

          PATH="$wrapper_dir:$PATH" target/debug/rms release check --root .

  python-binding:
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generated Python binding tests
        run: |
          cargo test -p rms --locked tests::python_module_scaffold_generates_valid_binding_artifacts -- --exact
          cargo test -p rms --locked tests::python_boundary_and_workflow_scaffolds_verify -- --exact
