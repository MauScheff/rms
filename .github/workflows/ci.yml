name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  native-release-proofs:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    env:
      # RMS tests create nested Cargo fixtures. Bound both layers so the hosted
      # runner cannot lose its agent under concurrent compiler pressure.
      CARGO_BUILD_JOBS: "2"
      RMS_TEST_SHARD_COUNT: "4"
      RMS_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: RMS native release proofs (shard ${{ matrix.shard }})
        run: |
          set -euo pipefail
          provider_test="tests::provider_pipeline_repairs_caches_refreshes_and_deduplicates"
          if [ "$RMS_TEST_SHARD" = "0" ]; then
            RUST_TEST_THREADS=1 cargo test -p rms --locked "$provider_test" -- --exact
          fi
          # Many RMS tests create nested toolchains and subprocess trees. Run
          # each test in a short-lived process and split the ordered inventory
          # across runners. This bounds both per-process resources and runner
          # lifetime while preserving exact coverage of the discovered suite.
          test_index=0
          cargo test -p rms --locked -- --list \
            | sed -n 's/: test$//p' \
            | while IFS= read -r rms_test; do
                case "$rms_test" in
                  "$provider_test"|behavioral_contract::tests::cvc5_reference_solver_conformance) continue ;;
                esac
                selected_shard=$((test_index % RMS_TEST_SHARD_COUNT))
                test_index=$((test_index + 1))
                if [ "$selected_shard" -ne "$RMS_TEST_SHARD" ]; then
                  continue
                fi
                cargo test -p rms --locked "$rms_test" -- --exact --nocapture
              done

  release-check:
    needs: native-release-proofs
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cvc5 reference solver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/cvc5-Linux-x86_64-static.zip"
          gh release download cvc5-1.3.2 --repo cvc5/cvc5 --pattern cvc5-Linux-x86_64-static.zip --dir "$RUNNER_TEMP"
          test "$(sha256sum "$archive" | cut -d " " -f 1)" = "1060daaf507edef9d0a68e399cfc0e9038150bccb9e2d34d081d50a7687544d2"
          unzip -q "$archive" -d "$RUNNER_TEMP/cvc5"
          echo "$RUNNER_TEMP/cvc5/cvc5-Linux-x86_64-static/bin" >> "$GITHUB_PATH"
      - name: cvc5 behavioral-contract conformance
        run: cargo test -p rms --locked behavioral_contract::tests::cvc5_reference_solver_conformance -- --ignored --exact
      - name: Build release audit binary
        run: |
          cargo fmt --all --check
          cargo build -p rms --locked
      - name: RMS exhaustive strict audit
        run: target/debug/rms check --all --root .

  behavioral-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cross-platform behavioral-contract corpus
        run: cargo test -p rms --locked behavioral_contract::tests
      - name: Cross-platform structural and composition checks
        run: |
          cargo run -p rms --locked -- validate --root . --json
          cargo run -p rms --locked -- compose --root . --json

  python-binding:
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generated Python binding tests
        run: |
          cargo test -p rms --locked tests::python_module_scaffold_generates_valid_binding_artifacts -- --exact
          cargo test -p rms --locked tests::python_boundary_and_workflow_scaffolds_verify -- --exact
