spec: rms/semantic-change/v0.1
module: tooling/rust/rms/implementation.yaml
supersedes:
- verification/changes/restore-the-complete-existing-rms-public-behavior-binding-graph-while-retaining-every-rc-5-contract-revision-and-release-preparation-binding-e6a3f19dec99.yaml
intent:
  summary: Make operational provider failures terminal and auditable, and ensure unresolved ownership can never be converted into an agent-inferred semantic owner.
laws:
  add:
  - id: non-ready-routes-remain-ownerless
    statement: A route whose ownership is absent, ambiguous, invalid, or otherwise non-ready selects no owner, authorizes no canonical mutation, and instructs callers not to infer an owner from candidates, inspection context, or adjacent modules.
    kind: evidence-integrity
    authority: parser
    enforced_by: intent-extraction-pipeline
  set:
  - id: provider-intent-extraction-is-structured-cached-and-auditable
    statement: Explicit provider intent extraction uses the exact intent-model schema, performs at most one diagnostic repair, caches only validated normalized models, and records a complete terminal run including raw attempts, normalization or diagnostics, cache provenance, route, and non-ready receipt even when provider execution fails, without making provider output semantic authority.
    kind: safety
    authority: composition
    enforced_by: recommend-next-rms-work-command
  remove: []
contracts:
  add: []
  set:
  - name: recommend-next-rms-work
    kind: command
    direction: provided
    version: '4'
    command: null
    meaning: Validate typed or explicitly provider-extracted intent, route it deterministically, persist a complete terminal run, issue a content-addressed route receipt, and prevent non-ready routing from being treated as owner selection or mutation authority.
    accepts:
    - A nonblank prospective task, readable repository root, optional explicit owner, and exactly one typed intent source or explicit read-only provider extraction.
    - An optional intent-cache refresh request and compact or detailed projection selection.
    ensures:
    - Every invocation records request, intent schema, prompt, provider attempt evidence when applicable, normalized intent or diagnostics, terminal route result, and a route receipt whose allowed actions are nonempty only for ready work.
    - Operational provider failures are classified without schema repair, exit one, preserve complete failure artifacts, select no owner, and prescribe provider remediation or intentional caller-supplied typed intent.
    - Clarification, missing model, missing owner, ambiguous owner, design-required, bootstrap-required, and blocked routes exit two and never expose a selected owner or owner-scoped implementation instruction.
    - Ready and no-rms-change results exit zero, while the rms.surface/v2 report additively exposes run_id, receipt_id, receipt_path, and explicit ownership status without granting source-edit or Git authority.
    rejects:
    - Blank tasks, unreadable roots, malformed or source-mismatched models, unsupported provider structure, provider process failure, unresolved material facts, contradictory intent, ambiguous ownership, and receipt persistence failure.
    protocol: null
  - name: configure-agent-integration
    kind: command
    direction: provided
    version: '3'
    command: null
    meaning: Diagnose, create, synchronize, or package managed agent guidance that enters natural-language RMS work through explicit recorded AI routing, carries ready receipts into canonical mutations, and treats every non-ready route as terminal rather than inferring an owner.
    accepts:
    - A supported agent target and readable project root or explicit optional plugin marketplace path.
    ensures:
    - Managed guidance starts natural-language work with rms next using explicit --ai and preserves caller-supplied typed intent for offline, CI, or intentionally pre-structured workflows.
    - Managed guidance prohibits automatic typed-intent fallback after provider failure and prohibits selecting or implying an owner from candidates, context packets, neighboring modules, or implementation language when RMS reports non-ready ownership.
    - Mutation examples pass a ready route receipt returned by next or design and retain existing commit-authority constraints.
    - Project-owned guidance remains preserved outside managed regions and generated distributions remain digest-equivalent.
    rejects:
    - Unsupported targets, stale managed templates that cannot be synchronized safely, unwritable destinations, and plugin packaging or installation failures.
    protocol: null
  remove: []
properties:
  add:
  - id: non-ready-route-owner-closure
    proves: non-ready-routes-remain-ownerless
    kind: property
    subject: null
    input_space:
      routes: absent, ambiguous, invalid, blocked, clarification, provider-failed, and ready ownership outcomes crossed with candidates and inspection context
    preconditions:
    - A route outcome and its candidate or context evidence are available for projection.
    operation:
      symbol: src/main.rs#project_next_report
      behavior: Project ownership, actions, receipt authority, and recovery instructions for the route outcome.
    oracle:
    - every non-ready ownership outcome has no selected owner and no owner-scoped implementation action
    - candidates and context never become substitute ownership authority
    - only a ready route can carry mutation action families
    evidence:
      kind: property
      path: verification/properties/non_ready_route_owner_closure.md
    counterexamples:
      path: verification/fuzz/counterexamples/non-ready-route-owner-closure
    realizations:
    - profile: smoke
      strategy: generated-property
      command: properties
      generator: src/main.rs#generate_non_ready_route_cases
      runner: src/main.rs#non_ready_routes_never_select_an_owner
      exhaustive: false
    temporal: null
  set:
  - id: intent-extraction-cache-determinism
    proves: provider-intent-extraction-is-structured-cached-and-auditable
    kind: property
    subject: null
    input_space:
      attempts: valid, repairable, materially unknown, schema-invalid, provider-process-failed, provider-incompatible, timed-out, cache-hit, refresh, and concurrent provider outcomes
    preconditions:
    - Provider execution is explicitly requested.
    operation:
      symbol: src/main.rs#extract_provider_intent_with_program
      behavior: Execute or reuse structured extraction and persist a terminal route run for every outcome.
    oracle:
    - validated identical requests reuse one normalized model without another provider invocation
    - invalid structured responses perform at most one repair and failed extraction is never cached
    - operational failures perform no schema repair and produce diagnostics, provider metadata, terminal route, and a non-ready receipt with no owner or allowed actions
    - every invocation preserves exact raw response and provider logs or cache provenance
    evidence:
      kind: property
      path: verification/properties/intent_extraction_terminal_runs.md
    counterexamples:
      path: verification/fuzz/counterexamples/intent-extraction-cache
    realizations:
    - profile: smoke
      strategy: generated-property
      command: properties
      generator: src/main.rs#generate_intent_cache_cases
      runner: src/main.rs#intent_extraction_cache_is_deterministic
      exhaustive: false
    temporal: null
  remove: []
trace_producers: null
