module: tooling/rust/rms/module.yaml
supersedes:
- verification/changes/allow-rms-initialization-to-safely-adopt-an-existing-repository-without-overwriting-user-owned-or-compatible-canonical-files-95446a441374.yaml
intent:
  summary: Preserve project-owned document content during adoption while installing idempotent RMS-managed agent and ignore sections that remain safe under later agent synchronization.
laws:
  add: []
  set: []
  remove: []
contracts:
  add: []
  set:
  - name: init-rms-system
    direction: provided
    version: '1'
    command: init-rms-system
    meaning: Initialize a new RMS workspace or safely adopt an existing repository by preserving project-owned content, maintaining explicit RMS-owned guidance sections, and creating only missing bootstrap artifacts.
    accepts:
    - a writable empty target for strict initialization
    - a writable existing repository when adopt mode is explicit
    - valid system name, purpose, version, and optional context names
    ensures:
    - strict initialization refuses every existing managed path before writing
    - adoption validates existing canonical RMS manifests before writing
    - adoption preserves an existing glossary byte-for-byte
    - adoption preserves all project-owned content outside explicit RMS-managed sections
    - adoption installs or refreshes an idempotent RMS-managed section in existing agent guidance and ignore files
    - later RMS agent synchronization refreshes only the RMS-managed section in adopted agent guidance
    - adoption creates only missing RMS bootstrap artifacts
    - collision preflight completes before any RMS artifact is written
    - each managed path is reported as created, adopted, or updated and conflicts abort the operation
    - a target outside an existing Git worktree is initialized as a Git worktree without nesting repositories
    - completion guidance requires a candidate commit and successful strict audit
    rejects:
    - adopt mode encounters an invalid or incompatible existing canonical RMS manifest
    - an existing RMS-managed skill conflicts with the embedded canonical skill
    - an existing RMS-managed document section has malformed or duplicate boundary markers
    - target input is invalid or unwritable
    - required provenance setup cannot be established
    protocol: null
  remove: []
