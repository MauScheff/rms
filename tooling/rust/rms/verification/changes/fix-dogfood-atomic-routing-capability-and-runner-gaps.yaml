spec: rms/semantic-change/v0.1
module: tooling/rust/rms/implementation.yaml
supersedes:
- verification/changes/implement-rms-executable-property-loop.yaml
intent:
  summary: Fix blind dogfood gaps in semantic apply atomicity, explicit owner routing, generated capability contracts, and JavaScript property runner selection.
contracts:
  set:
  - name: add-rms-capability-tree
    kind: command
    direction: provided
    version: '1'
    command: null
    meaning: Scaffold an explicitly requested recursive capability topology with a composite parent and semantic child modules, without publishing capabilities on existing standalone modules.
    accepts:
    - A fresh target, stable names, semantic purpose, explicit optional child bindings, and an optional explicit runnable surface kind.
    ensures:
    - The complete recursive topology is generated from explicit structured design output with canonical composition and no purpose-text inference.
    - No existing standalone module is changed and no runnable surface is inferred from natural-language words.
    - The domain child publishes a command contract and a distinct capability-kind contract with stable non-colliding identities; the boundary child requires and binds that exact provider capability contract.
    rejects:
    - Existing generated targets, unsupported bindings or surface kinds, and incomplete recursive topology inputs.
    protocol: null
