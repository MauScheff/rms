spec: rms/semantic-change/v0.1
module: tooling/rust/rms/module.yaml
supersedes: []
intent:
  summary: Bindings realize canonical RMS semantics without no-effect source residue, and bootstrap diagnostics expose strict-audit provenance requirements.
laws:
  add:
  - id: bindings-realize-canonical-semantics
    statement: Binding adapters realize canonical module shape, machine roles, runnable surfaces, evidence obligations, public contracts, and dependency links; bindings must not invent semantic roles outside canonical declarations.
    kind: null
  - id: no-effect-scaffolds-have-no-effect-residue
    statement: Scaffolds and source roles for modules with no canonical effects or effect results must not expose effect, effect envelope, effect lifecycle, effect result, or effect-result envelope semantic types.
    kind: null
  - id: bootstrap-provenance-is-visible
    statement: RMS init, diagnose, and gate surfaces must make the git source revision requirement visible before strict audit is treated as production evidence.
    kind: null
contracts:
  add: []
machine: null
roles: null
