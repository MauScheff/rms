      assumptions: []
    assumptions:
      requires: []
      maintains: []
      ensures:
      - each extracted envelope and causal edge is checked and the first bad handoff is retained
    evidence:
      laws:
      - verification/laws/system_traces_preserve_message_causation.md
      properties:
      - verification/properties/cross_module_trace_causation.md
  set: []
  remove: []
