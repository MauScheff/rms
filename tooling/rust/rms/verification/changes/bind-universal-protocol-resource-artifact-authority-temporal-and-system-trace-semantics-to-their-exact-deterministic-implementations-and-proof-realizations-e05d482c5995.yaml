      ensures:
      - inspectable elevated operations are compared with declared authority role paths
    evidence:
      laws:
      - verification/laws/privileged_authority_is_explicit_and_contained.md
      properties:
      - verification/properties/authority_containment.md
  - id: validate-temporal-properties
    symbol: validate_temporal_target_report
    kind: decision
    purity: pure
    discharges:
      contracts:
      - contracts/check-semantic-properties.v1.yaml
      invariants:
      - temporal-properties-have-matching-realizations
      assumptions: []
    assumptions:
      requires: []
      maintains: []
      ensures:
      - each temporal scope and bound is paired with a capable realization
    evidence:
      laws:
      - verification/laws/temporal_properties_have_matching_realizations.md
      properties:
      - verification/properties/temporal_realization_conformance.md
  - id: stitch-system-traces
    symbol: build_system_trace_report
    kind: projector
    purity: effectful
    discharges:
      contracts:
      - contracts/inspect-trace-bundle.v1.yaml
      invariants:
