spec: rms/semantic-change/v0.1
module: tooling/rust/rms/module.yaml
supersedes:
- verification/changes/make-semantic-apply-validate-only-the-computed-final-candidate-and-use-one-language-neutral-grammar-for-artifact-and-transformation-identifiers-8bdddb49d464.yaml
intent:
  summary: Add an experimental local read-only system semantic viewer derived entirely from canonical RMS artifacts.
laws:
  add:
  - id: system-viewer-is-derived-and-read-only
    statement: The local semantic viewer derives every visible node, edge, trace, gap, status, and source reference from canonical RMS artifacts and exposes no route that mutates project files or semantic authority.
    kind: boundary-integrity
    authority: parser
    enforced_by: parse-rms-view-request
  set: []
  remove: []
contracts:
  add:
  - name: view-rms-system
    direction: provided
    version: '1'
    command: view-rms-system
    meaning: Serve a local read-only semantic explorer for an RMS system with deterministic module projections, guided inspection modes, live refresh, and semantic diff.
    accepts:
    - A repository root containing one or more readable canonical RMS module manifests.
    - An optional loopback port and browser-open preference.
    ensures:
    - The viewer projects system modules, public contracts, machines, effects, evidence, traces, source references, and explicit gaps without inventing semantic topology.
    - Understand, Trace, Change, Debug, and Verify modes use stable semantic identifiers and deterministic source-backed focus data.
    - Snapshot refresh detects added, removed, and changed semantic identifiers without writing canonical artifacts.
    - The HTTP boundary accepts only read-only GET and HEAD requests on the loopback listener.
    rejects:
    - Roots with no canonical RMS modules, invalid canonical manifests, unsupported HTTP methods or paths, and unavailable loopback ports.
    protocol: null
  set: []
  remove: []
properties:
  add:
  - id: system-viewer-read-only-route-property
    proves: system-viewer-is-derived-and-read-only
    kind: property
    subject: null
    input_space:
      description: The finite cross-product of supported and unsupported HTTP methods with every registered and unknown viewer route.
      bounds: All GET, HEAD, POST, PUT, PATCH, DELETE, and OPTIONS cases over the viewer route table.
    preconditions:
    - Requests have a syntactically readable HTTP request line.
    operation:
      semantic_function: parse-rms-view-request
      input: HTTP method and request target
    oracle:
    - Only GET and HEAD requests for registered viewer assets or snapshot endpoints are accepted.
    - Every mutating method and unknown path is rejected without invoking filesystem writes or semantic apply commands.
    evidence:
      kind: property
      path: verification/properties/system_viewer_read_only.md
    counterexamples:
      path: verification/fuzz/counterexamples
    realizations:
    - profile: smoke
      strategy: deterministic-exhaustive
      command: properties
      generator: src/viewer.rs#generate_view_route_cases
      runner: src/viewer.rs#property_system_viewer_routes_are_read_only
      exhaustive: true
    temporal: null
  set: []
  remove: []
trace_producers: null
