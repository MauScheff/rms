    evidence:
      properties:
      - verification/properties/system_viewer_read_only.md
  - id: view-rms-system-command
    symbol: src/viewer.rs#run_view
    kind: projector
    purity: effectful
    discharges:
      contracts:
      - contracts/view-rms-system.v1.yaml
      invariants:
      - canonical-artifacts-remain-authoritative
      - diagnostics-are-evidence-not-authority
      - system-viewer-is-derived-and-read-only
      assumptions: []
    assumptions:
      requires: []
      maintains: []
      ensures:
      - System topology and focus data are regenerated from canonical manifests and existing deterministic module atlas projections.
      - The listener binds only to loopback and publishes no write endpoint.
    evidence:
      contracts:
      - verification/contracts/view_rms_system.md
  set: []
  remove: []
