spec: rms/semantic-change/v0.1
module: tooling/rust/rms/implementation.yaml
supersedes:
- verification/changes/introduce-rms-behavioral-contracts-v0-2.yaml
intent:
  summary: Add probe assembly v0.3 with closed typed expressions over current states of named instances, structured replay facts, and bounded concurrency acceptance fixtures without changing scheduling or transition semantics.
laws:
  add:
  - id: probe-product-state-expressions-are-closed-and-replayable
    statement: Probe assembly v0.3 state expressions are closed and typed before exploration, observe only declared current state projections from named instances, make missing or ill-typed projections invalid, and preserve false results as minimized replayable failures with structured observed facts.
    kind: safety
    authority: parser
    enforced_by: probe-machine-validator
  set: []
  remove: []
contracts:
  add:
  - name: probe-machine
    version: v3
    command: rms-probe
    accepts:
    - rms/probe-assembly/v0.1, v0.2, or v0.3
    rejects:
    - invalid wiring, state observations, expressions, runtime projections, or bounded conclusions
  - name: search-semantic-properties
    version: v2
    command: rms-property-search
    accepts:
    - one executable property and an rms/probe-assembly/v0.1, v0.2, or v0.3
    rejects:
    - invalid expressions, unsupported domains, or non-exhausted bounds presented as proof
properties:
  add:
  - id: probe-product-state-expression-concurrency-corpus
    proves: probe-product-state-expressions-are-closed-and-replayable
    kind: property
    subject: probe-assembly-product-state
    input_space: scalar and closed-variant state observations, closed core expressions, every timing, invalid definitions and projections, and bounded concurrency fixtures
    preconditions:
    - the v0.3 schema, probe engine, fixture implementations, and replay engine are available
    operation: validate, compile, explore, minimize, and replay v0.3 product-state checks; evaluate the frame fixture through the behavioral contract checker
    oracle:
    - invalid definitions fail before exploration and runtime projection errors invalidate the run
    - false expressions preserve typed observed facts in minimized replayable counterexamples
    - safe optimistic concurrency and duplicate delivery exhaust their finite bounds
    - lost update, ordering, deadlock, and frame mutations yield the intended replayable failures
    - v0.1 and v0.2 remain supported and reject state expressions
    evidence:
      kind: property
      path: verification/properties/probe_product_state_expressions.md
    counterexamples:
      path: verification/fuzz/counterexamples
    realizations:
    - profile: smoke
      strategy: deterministic-corpus
      command: properties
      runner: src/probe/mod.rs#state_expression_concurrency_acceptance_corpus_is_replayable
  set: []
  remove: []
hunt_exceptions: null
trace_producers: null
semantic_functions: null
machine: null
roles: null
evidence:
  add:
  - kind: law
    proves: probe-product-state-expressions-are-closed-and-replayable
    path: verification/laws/probe_product_state_expressions_are_closed_and_replayable.md
  - kind: property
    proves: probe-product-state-expressions-are-closed-and-replayable
    path: verification/properties/probe_product_state_expressions.md
surfaces: null
binding_dependencies: null
artifacts: null
transformations: null
authorities: null
protocol_bindings: null
authority_bindings: null
public_behavior_bindings: null
dependency_behavior_bindings: null
