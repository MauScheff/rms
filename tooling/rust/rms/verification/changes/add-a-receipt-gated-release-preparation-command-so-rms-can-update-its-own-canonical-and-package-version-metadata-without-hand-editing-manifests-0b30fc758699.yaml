supersedes:
- verification/changes/enforce-auditable-route-receipts-for-canonical-mutations-make-provider-intent-extraction-structured-and-cached-and-project-exact-proof-observations-and-progressive-coverage-67f549dad066.yaml
intent:
  summary: Add a receipt-gated release preparation command so RMS can update its own canonical and package version metadata without hand-editing manifests.
laws: null
contracts:
  add:
  - name: prepare-rms-release
    kind: command
    direction: provided
    version: '1'
    command: null
    meaning: Validate and atomically prepare one RMS release version across canonical module, Cargo package, lockfile, plugin, CI template, reference, and changelog metadata after validating a current route receipt.
    accepts:
    - A valid semantic version, repository root, and ready current route receipt selecting rms-cli and authorizing semantic mutation.
    - An optional dry-run request.
    ensures:
    - Receipt validation precedes candidate computation in dry-run and write modes.
    - Every known RMS release metadata location is changed to the same version or no files are written.
    - The result names the accepted receipt and exact changed paths without granting Git authority.
    rejects:
    - Missing, stale, tampered, non-ready, wrong-owner, wrong-action, or wrong-target receipts.
    - Invalid versions, unexpected current metadata, partial candidate construction, validation failure, and filesystem failure.
    protocol: null
  set: []
  remove: []
