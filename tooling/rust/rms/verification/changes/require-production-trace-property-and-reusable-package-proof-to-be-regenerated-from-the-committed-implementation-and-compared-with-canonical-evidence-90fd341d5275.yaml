spec: rms/semantic-change/v0.1
module: tooling/rust/rms/module.yaml
supersedes:
- verification/changes/make-canonical-semantic-rendering-panic-free-and-inspect-rust-authority-boundaries-from-syntax-rather-than-incidental-text-7ea4d5e3cfd4.yaml
intent:
  summary: Require production trace, property, and reusable-package proof to be regenerated from the committed implementation and compared with canonical evidence.
laws:
  add:
  - id: trace-evidence-is-execution-derived
    statement: Every production trace bundle is regenerated by a declared producer that calls the real transition-record path, and canonical comparison rejects hand-authored, stale, or reconstructed evidence.
    kind: evidence-integrity
    authority: effect-executor
    enforced_by: run-trace-producers-command
  - id: property-realizations-execute-exact-runners
    statement: Every property realization independently executes its declared runner, generator when required, semantic operation, and oracle under the requested proof profile.
    kind: evidence-integrity
    authority: effect-executor
    enforced_by: run-semantic-properties-command
  - id: strict-audit-regenerates-smoke-proofs
    statement: Strict production audit regenerates deterministic smoke trace, property, and reusable-package proofs from committed code and rejects proof commands that mutate production files.
    kind: evidence-integrity
    authority: effect-executor
    enforced_by: audit-rms-project-command
  - id: reusable-package-proof-is-current
    statement: Strict production audit rebuilds every reusable module package and rejects an existing package whose canonical payload differs from the regenerated package.
    kind: evidence-integrity
    authority: effect-executor
    enforced_by: audit-rms-project-command
  - id: active-evidence-references-current-semantics
    statement: Active production evidence may reference only semantic variants present in the current canonical model.
    kind: evidence-integrity
    authority: parser
    enforced_by: audit-rms-project-command
  - id: semantic-apply-validates-final-candidate
    statement: Semantic, machine, and surface apply validate one computed final canonical candidate before dry-run reporting or writes, including repairs of invalid current state.
    kind: consistency
    authority: parser
    enforced_by: semantic-change-apply-command
  set: []
  remove: []
contracts:
  add:
  - name: run-trace-producers
    direction: provided
    version: '1'
    command: run-trace-producers
    meaning: Regenerate declared trace bundles from implementation-owned producers, validate their transition records, and compare or record the canonical result.
    accepts:
    - A readable implementation binding with declared smoke trace producers, commands, runners, and bundle paths.
    - Optional dry-run, record, JSON, and bounded timeout controls.
    ensures:
    - Each producer executes independently with an isolated output path and exact runner identity.
    - Generated traces pass canonical trace validation before comparison or recording.
    - Recording is the only supported path for replacing active transition bundles.
    rejects:
    - Missing commands or runners, invalid generated output, timeouts, transition-record bypass, or drift from committed evidence.
    protocol: null
  set:
  - name: run-semantic-properties
    direction: provided
    version: '1'
    command: run-semantic-properties
    meaning: Execute each semantic property realization independently through its exact runner, generator, operation, and oracle.
    accepts:
    - An implementation binding with one or more realizations for the requested smoke, CI, or nightly profile.
    - Exact runner metadata and generator metadata for generated or exhaustive strategies.
    ensures:
    - Shared shell commands still execute once per property and receive the requested property and runner identities.
    - Reports identify each property, strategy, runner, result, output, and counterexample independently.
    rejects:
    - Missing runners or generators, fixed corpora mislabeled as generated coverage, commands that cannot select the requested runner, timeout, failed oracle, or unexecuted realizations.
    protocol: null
  - name: audit-rms-project
    direction: provided
    version: '1'
    command: audit-rms-project
    meaning: Audit a committed RMS project for production blockers and regenerate every deterministic smoke proof from the committed implementation.
    accepts:
    - A canonical RMS project root with an optional strict production policy, proof timeout, or proof dry-run.
    ensures:
    - Strict mode regenerates trace, property, and reusable-package proofs and compares them with committed canonical evidence.
    - Proof dry-run lists executable commands but cannot produce a production pass.
    - Production-file mutation caused by a proof command is detected and rejected.
    rejects:
    - Invalid roots, stale or hand-authored proof, proof timeout, source mutation, stale package output, semantic drift, placeholder evidence, or uncommitted production claims.
    protocol: null
  remove: []
