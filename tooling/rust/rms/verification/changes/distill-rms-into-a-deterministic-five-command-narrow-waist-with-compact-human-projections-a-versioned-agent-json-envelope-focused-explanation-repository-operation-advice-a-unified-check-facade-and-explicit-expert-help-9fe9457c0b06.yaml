      assumptions: []
    assumptions:
      requires:
      - the requested task intent is prospective and nonblank
      maintains:
      - no repository files, provider state, or Git state are mutated
      ensures:
      - task advice is independent of unrelated working-tree impact and uses the compact rms.surface/v2 projection
      - repository-operation intent yields no-rms-change unless semantic intent takes precedence
      - candidate commits remain manual host-authorized actions
    evidence:
      contracts:
