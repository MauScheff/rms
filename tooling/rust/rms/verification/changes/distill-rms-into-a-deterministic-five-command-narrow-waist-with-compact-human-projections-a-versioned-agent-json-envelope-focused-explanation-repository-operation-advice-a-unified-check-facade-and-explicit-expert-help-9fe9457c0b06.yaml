spec: rms/semantic-change/v0.1
module: tooling/rust/rms/implementation.yaml
supersedes:
- verification/changes/make-rms-agent-readiness-deterministic-through-prospective-next-work-prescriptions-accurate-repository-and-skill-source-diagnosis-explicit-commit-authority-compact-managed-guidance-and-mechanically-checked-distributions-807a06ea16ba.yaml
intent:
  summary: Distill RMS into a deterministic five-command narrow waist with compact human projections, a versioned agent JSON envelope, focused explanation, repository-operation advice, a unified check facade, and explicit expert help.
laws:
  add: []
  set: []
  remove: []
contracts:
  add:
  - name: check-rms-project
    direction: provided
    version: '1'
    command: check-rms-project
    meaning: Run one deterministic RMS readiness mode through the existing diagnosis, validation, composition, gate, or strict-audit authority and project its result through the compact RMS surface envelope.
    accepts:
    - a readable repository root
    - zero or one of environment, changes, or committed mode
    - optional machine-readable and detailed projection selections
    ensures:
    - default mode runs validation and composition, environment mode runs diagnosis, changes mode runs the RMS gate, and committed mode runs strict audit
    - delegated checks remain their own policy authorities and are called as shared implementations rather than by recursively invoking the RMS executable
    - every report uses the rms.surface/v2 envelope with command, result, summary, reasons, warnings, next_action, done_when, and details_available plus mode and component summaries
    - detailed output nests complete delegated evidence under the same versioned envelope
    - success is reported only when every check selected by the mode passes; a constructed failing report exits unsuccessfully
    - the facade does not invoke optional providers, mutate canonical semantics, grant Git authority, or turn a candidate workspace into committed evidence
    rejects:
    - the requested root cannot be read
    - more than one mode is selected
    - a delegated report cannot be constructed truthfully
    protocol: null
  - name: describe-rms-command-surface
    direction: provided
    version: '1'
    command: describe-rms-command-surface
    meaning: Describe the deterministic RMS command doorway as five primary commands with an explicitly requested grouped catalog of directly callable specialist commands.
    accepts:
    - the default help request or an explicit all-command help request
    - the compiled RMS command metadata
    ensures:
    - default help exposes init, next, explain, check, and view as the five primary commands plus the help meta-command
    - specialist commands remain directly callable but are absent from default help
    - explicit all-command help lists every specialist command once in stable functional groups
    - help text is derived from the same command definitions used for parsing and exits successfully without reading or mutating project files or invoking providers
    rejects:
    - an unsupported help selector or malformed help request
    - command metadata cannot describe a registered route consistently
    protocol: null
  set:
  - name: explain-module
    direction: provided
    version: '2'
    command: explain-module
    meaning: Construct a deterministic answer-first explanation of one RMS module, or a concise overview when no question is supplied, from canonical artifacts without provider execution.
    accepts:
    - a readable repository root and optional explicit readable module manifest
    - an optional nonblank question
    - optional machine-readable and detailed projection selections
    ensures:
    - explicit module selection wins and inferred selection succeeds only for one unambiguous readable module
    - a focused question produces one answer followed by at most three reasons, one immediate next action, and completion conditions without repeating canonical sections
    - no-question mode produces a concise module overview, while unsupported questions produce an insufficient-evidence result and the best deterministic evidence-gathering action
    - every machine-readable report uses the rms.surface/v2 envelope with command, result, summary, reasons, warnings, next_action, done_when, and details_available plus answer and canonical evidence paths
    - detailed output nests the complete relevant canonical inventory under the same versioned envelope; default output omits inventories and not-applicable fields
    - every constructed report exits successfully, including insufficient-evidence, while impossible construction exits unsuccessfully
    - explanation never invokes a provider, mutates project files, or introduces architectural truth beyond canonical artifacts
    rejects:
    - the requested root or explicit module cannot be read
    - module inference is ambiguous or the selected manifest cannot be parsed
    - available evidence cannot be represented truthfully
    protocol: null
  - name: recommend-next-rms-work
    direction: provided
    version: '2'
    command: recommend-next-rms-work
    meaning: Construct a deterministic, prospective, read-only prescription or no-RMS-change finding for a nonblank task intent from observable repository and canonical evidence.
    accepts:
    - a nonblank prospective task intent
    - a readable repository root
    - an optional explicit readable module manifest
    - optional machine-readable and detailed projection selections
    ensures:
    - every constructed report classifies its result as ready, bootstrap-required, design-required, needs-owner, blocked, or no-rms-change
    - repository shape and owner selection preserve deterministic explicit, direct, sole, unique-positive, and recursive composite routing without guessing through ties
    - task classification is prospective, independent of unrelated working-tree changes, and includes repository-operation alongside read-only, design, semantic, surface, semantic-plus-surface, implementation-candidate, and undetermined lanes
    - installation, managed skill or plugin synchronization, and Git status, fetch, commit, rebase, merge, or push intentions produce no-rms-change unless semantic intent about RMS behavior takes precedence
    - a readable uninitialized root may return no-rms-change, and that result contains no design, spec, source-edit, gate, audit, or pending-candidate prescription
    - every machine-readable report uses the rms.surface/v2 envelope with command, result, summary, reasons, warnings, next_action, done_when, and details_available plus lane, confidence, owner state, and ordered typed steps
    - command steps carry phase, program, argument array, safely escaped display, and no authorization; manual commit steps carry an instruction and host-required authorization with no executable Git program
    - detailed output nests validation, owner ranking, context, roles, skill origins, blockers, and full completion evidence under the same versioned envelope
    - every constructed report exits successfully while impossible construction exits unsuccessfully, and construction never mutates files, invokes providers, runs prescribed checks, or grants source-edit or Git authority
    rejects:
    - task intent is blank
    - the requested root or explicit module cannot be read
    - repository evidence cannot support a truthful projection
    protocol: null
  remove: []
