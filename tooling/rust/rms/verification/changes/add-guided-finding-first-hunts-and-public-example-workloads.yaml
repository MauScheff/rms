spec: rms/semantic-change/v0.1
module: tooling/rust/rms/implementation.yaml
supersedes:
- verification/changes/add-proof-first-resumable-bug-hunts.yaml
intent:
  summary: Add finding-first guided hunts with stable targeted replay and optional public-example probe workloads while preserving bounded proof semantics and v0.1 readers.
laws:
  add: []
  set:
  - id: proof-first-hunts-are-bounded-and-replayable
    statement: Strong verification lanes are derived from declared risk, unattended execution is isolated and resumable, guided exploration retains distinct stable targeted-replay findings, and bounded empirical evidence is never promoted to a global proof.
    kind: invariant
    authority: effect-executor
    enforced_by: hunt-rms-system-command
  remove: []
contracts:
  add: []
  set:
  - name: probe-machine
    kind: command
    direction: provided
    version: '2'
    meaning: Execute one or more bounded module instances through their declared pure transition-record paths, explore canonical message schedules and declared faults, and report a deterministic replayable timeline.
    accepts:
    - The target is one inspectable Rust, Swift, JavaScript, or Python implementation, or an rms/probe-assembly/v0.1 or v0.2 containing such instances.
    - Each command, observed event, or effect result names a declared input and supplies schema-valid payload data.
    - Multi-module routes are resolved from canonical protocol bindings, dependency probe bridges, explicit instance selections, and explicit substitutes; the assembly cannot invent semantic transformations or private inputs.
    ensures:
    - Every step calls the exact transition-record function and the next step receives the preceding state_after.
    - Single-machine results are validated trace bundles; assembly results are rms/probe-system-trace/v0.1 timelines with source, causation, correlation, idempotency, routing, fault, check, bound, and coverage data.
    - Probing never invokes a machine driver or real effect executor; ordinary deterministic execution is stable and breadth-first exploration returns pass only after exhausting the declared bounded state space.
    - No project artifact is written unless the caller supplies --out.
    - Every discovered failure is reduced to a deterministic rms/probe-counterexample/v0.1 whose exact schedule and fault decisions replay as reproduced, resolved, or invalid.
    - Probe artifacts are ephemeral unless canonical verification explicitly references them, at which point assemblies must exhaust successfully and counterexamples must replay as resolved.
    - A v0.2 public-input-examples workload injects only exact schema-valid public command examples within the per-action budget and records each normalized input for deterministic replay.
    rejects:
    - Ambiguous or incompatible wiring, invalid protocol data, unsafe bindings, runner failure, timeout, nonconforming output, a failed law, a reproduced or invalid canonical counterexample, or inconclusive bounded exploration.
    protocol: null
  - name: hunt-rms-system
    kind: command
    direction: provided
    version: '1'
    meaning: Run a checkpointed, reproducible campaign of risk-derived strong verification lanes without confusing bounded evidence with a global proof.
    accepts:
    - A clean committed RMS project, an optional selected module closure, a positive wall-clock budget, and available declared tools.
    - Nightly runners honor the recorded seed and budget and write rms/hunt-lane-result/v0.1 to RMS_HUNT_OUTPUT.
    ensures:
    - Execution occurs in an isolated checkout at the recorded source revision and leaves the caller's tracked source unchanged.
    - Historical failures, smoke proof, real traces, bounded proof lanes, seeded semantic-novelty probe exploration, probe relationships, generated cases, fuzzers, and mutation lanes run in deterministic phase order within the total budget.
    - Checkpoints bind source, declarations, tool identities, and seed; compatible runs resume without repeating completed lanes.
    - Every behavioral finding has a successful targeted replay, and the final rms/hunt-report/v0.2 records stable semantic finding IDs, occurrence counts, the shortest retained replay, exact commands, bounds, metrics, artifacts, and proof scope while v0.1 reports remain readable.
    - Only explicitly exhaustive finite strategies are classified as proof; guided exploration, fuzzing, and time-bounded work remain bounded evidence even when their frontier is exhausted.
    rejects:
    - Dirty source, invalid declarations, unavailable tools, incompatible resume state, malformed lane results, non-replayable findings, or orchestration failure.
    protocol: null
  remove: []
properties:
  add: []
  set:
  - id: hunt-outcomes-preserve-proof-scope
    proves: proof-first-hunts-are-bounded-and-replayable
    kind: property
    subject: null
    input_space: Passing, finding, inconclusive, invalid, unsupported, exhausted, guided, fuzz, coverage, mutation, duplicate, and multi-failure lane results.
    preconditions:
    - Every behavioral finding supplies a replay recipe.
    operation: Classify lane results, findings, and recorded exhaustion into the closed hunt outcome and proof-scope vocabularies.
    oracle:
    - behavioral failures become bugs only after replay
    - surviving mutants and inadequate coverage become proof gaps
    - open-ended success remains clean only under recorded bounds
    - finite proof scope names only explicitly exhaustive lanes that record exhaustion
    - guided exploration never enters finite proof scope
    - semantic duplicates share a stable ID and retain the shortest replay with an occurrence count
    evidence:
      kind: property
      path: verification/properties/hunt_orchestration.md
    counterexamples:
      path: verification/fuzz/counterexamples
    realizations:
    - profile: smoke
      strategy: deterministic-corpus
      command: properties
      runner: src/hunt.rs#hunt_outcomes_distinguish_bugs_gaps_and_bounds
    - profile: smoke
      strategy: deterministic-corpus
      command: properties
      runner: src/hunt.rs#v2_findings_have_stable_ids_and_deduplicate_to_the_shortest_replay
    - profile: smoke
      strategy: deterministic-corpus
      command: properties
      runner: src/probe/mod.rs#guided_exploration_is_seeded_and_keeps_distinct_replayable_findings
  remove: []
semantic_functions:
  add: []
  set:
  - id: probe-machine-command
    symbol: run_probe
    kind: adapter
    purity: effectful
    discharges:
      contracts:
      - contracts/probe-machine.v2.yaml
      invariants:
      - diagnostics-are-evidence-not-authority
      - machine-probes-are-pure-and-ephemeral
      - trace-records-conform-to-canonical-transitions
    assumptions:
      ensures:
      - probe runners exchange temporary request and output files through the declared protocol
      - probe traces are validated against canonical transition cases before expectations are reported
      - assembly routing is derived only from canonical protocol bindings and dependency probe bridges
      - v0.2 workloads derive only exact schema-valid public command examples and record normalized inputs for replay
      - bounded breadth-first exploration is deterministic and pass means the reachable bounded space was exhausted
      - failures are minimized without changing the exact failing check and retain replayable schedule and fault decisions
    evidence:
      contracts:
      - verification/contracts/probe_machine.md
  - id: hunt-rms-system-command
    symbol: src/hunt.rs#run
    kind: interpreter
    purity: effectful
    discharges:
      contracts:
      - contracts/hunt-rms-system.v1.yaml
      invariants:
      - proof-first-hunts-are-bounded-and-replayable
    assumptions:
      requires:
      - the source checkout is clean and committed
      ensures:
      - project lanes execute only in the isolated checkout
      - checkpoints bind source declarations tool identities and seed
      - behavioral findings are retained only after targeted replay and semantic duplicates retain the shortest replay
      - guided exploration continues after failures but never contributes finite proof scope
      - the v0.2 report distinguishes finite exhaustion from bounded empirical evidence while v0.1 remains readable
    evidence:
      contracts:
      - verification/contracts/hunt_rms_system.md
      laws:
      - verification/laws/proof_first_hunts_are_bounded_and_replayable.md
      properties:
      - verification/properties/hunt_orchestration.md
  remove: []
