spec: rms/semantic-change/v0.1
module: tooling/rust/rms/implementation.yaml
supersedes:
- verification/changes/remove-legacy-property-harness-terminology-and-make-generators-exact-runners-operations-and-oracles-independently-explicit-73ba443261d3.yaml
intent:
  summary: Bind executable proof and final-candidate laws to exact RMS authority functions while replacing harness terminology with generator and runner semantics.
laws:
  add: []
  set:
  - id: trace-evidence-is-execution-derived
    statement: Every production trace bundle is regenerated by a declared producer that calls the real transition-record path, and canonical comparison rejects hand-authored, stale, or reconstructed evidence.
    kind: evidence-integrity
    authority: effect-executor
    enforced_by: run-trace-producers-command
  - id: property-realizations-execute-exact-runners
    statement: Every property realization independently executes its declared runner, generator when required, semantic operation, and oracle under the requested proof profile.
    kind: evidence-integrity
    authority: effect-executor
    enforced_by: run-semantic-properties-command
  - id: strict-audit-regenerates-smoke-proofs
    statement: Strict production audit regenerates deterministic smoke trace, property, and reusable-package proofs from committed code and rejects proof commands that mutate production files.
    kind: evidence-integrity
    authority: effect-executor
    enforced_by: strict-audit-proof-executor
  - id: reusable-package-proof-is-current
    statement: Strict production audit rebuilds every reusable module package and rejects an existing package whose canonical payload differs from the regenerated package.
    kind: evidence-integrity
    authority: effect-executor
    enforced_by: strict-audit-proof-executor
  - id: active-evidence-references-current-semantics
    statement: Active production evidence may reference only semantic variants present in the current canonical model.
    kind: evidence-integrity
    authority: parser
    enforced_by: active-evidence-reference-validator
  - id: semantic-apply-validates-final-candidate
    statement: Semantic, machine, and surface apply validate one computed final canonical candidate before dry-run reporting or writes, including repairs of invalid current state.
    kind: consistency
    authority: parser
    enforced_by: semantic-change-final-candidate-validator
  remove: []
contracts:
  add: []
  set:
  - name: check-semantic-properties
    direction: provided
    version: v1
    command: CheckSemanticProperties
    meaning: Check language-neutral property declarations and prove that every executable realization can truthfully evaluate its claim.
    accepts:
    - module or implementation semantics with input spaces, operations, oracles, evidence, and realization metadata
    - deterministic corpus, exhaustive, generated, coverage-guided, model-checking, static-analysis, sanitizer, and benchmark strategies
    ensures:
    - every executable realization names an exact runner
    - generated and exhaustive realizations name an exact generator
    - inspectable runners call their generator when required, exercise the declared operation, and apply a binding-native oracle
    - fixed corpora, exhaustive spaces, generators, fuzzers, model checkers, analyzers, sanitizers, and benchmarks remain distinct
    rejects:
    - missing or unresolved generator or runner
    - runner that bypasses its generator, semantic operation, or oracle
    - realization strategy incapable of evaluating the declared claim
    protocol: null
  remove: []
properties: null
trace_producers: null
semantic_functions:
  add:
  - id: run-trace-producers-command
    symbol: execute_trace_producers
    kind: effect-executor
    purity: effectful
    discharges:
      contracts:
      - contracts/run-trace-producers.v1.yaml
      invariants:
      - trace-evidence-is-execution-derived
      assumptions: []
    evidence:
      contracts:
      - verification/contracts/run_trace_producers.md
      laws:
      - verification/laws/trace_evidence_is_execution_derived.md
  - id: run-semantic-properties-command
    symbol: execute_property_realizations
    kind: effect-executor
    purity: effectful
    discharges:
      contracts:
      - contracts/run-semantic-properties.v1.yaml
      invariants:
      - property-realizations-execute-exact-runners
      assumptions: []
    evidence:
      contracts:
      - verification/contracts/run_semantic_properties.md
      laws:
      - verification/laws/property_realizations_execute_exact_runners.md
  - id: strict-audit-proof-executor
    symbol: append_executable_proof_audit_checks
    kind: effect-executor
    purity: effectful
    discharges:
      contracts:
      - contracts/audit-rms-project.v1.yaml
      invariants:
      - strict-audit-regenerates-smoke-proofs
      - reusable-package-proof-is-current
      assumptions: []
    evidence:
      laws:
      - verification/laws/strict_audit_regenerates_smoke_proofs.md
      - verification/laws/reusable_package_proof_is_current.md
  - id: active-evidence-reference-validator
    symbol: validate_active_evidence_semantic_references
    kind: parser
    purity: pure
    discharges:
      contracts: []
      invariants:
      - active-evidence-references-current-semantics
      assumptions: []
    evidence:
      laws:
      - verification/laws/active_evidence_references_current_semantics.md
  - id: semantic-change-final-candidate-validator
    symbol: validate_semantic_change
    kind: parser
    purity: pure
    discharges:
      contracts: []
      invariants:
      - semantic-apply-validates-final-candidate
      assumptions: []
    evidence:
      laws:
      - verification/laws/semantic_apply_validates_final_candidate.md
  set:
  - id: semantic-property-check-command
    symbol: run_property_check
    kind: parser
    purity: effectful
    discharges:
      contracts:
      - contracts/check-semantic-properties.v1.yaml
      invariants:
      - semantic-properties-are-canonical-reliability-evidence
      - fuzz-realization-matches-semantic-claim
      - risk-bearing-laws-have-semantic-properties
      - generated-property-claims-use-generators
      assumptions: []
    assumptions:
      requires: []
      maintains: []
      ensures:
      - non-corpus generator and runner claims are inspected for truthful case generation, operation execution, and oracle evaluation
    evidence:
      contracts:
      - verification/contracts/check_semantic_properties.md
      properties:
      - verification/properties/generated_property_realization_truthfulness.md
  remove: []
machine: null
