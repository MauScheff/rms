    preconditions:
    - each conditional branch has a stable case name
    operation: compare canonical transition cases with trace state, input, destination, and source branch
    oracle:
    - every declared case has one matching replay record
    - missing or collapsed cases fail strict audit
    evidence:
      kind: property
      path: verification/properties/transition_case_replay.md
    counterexamples:
