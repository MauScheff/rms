    preconditions:
    - the surface entrypoint exists
    operation: resolve the delegation target and boundary effect declaration
    oracle:
    - declared roles or symbols pass
    - unknown role targets and effectless surfaces without justification fail
    evidence:
      kind: property
      path: verification/properties/runnable_delegation_owner.md
    counterexamples:
      path: verification/fuzz/counterexamples
    realizations:
    - profile: smoke
      strategy: deterministic-corpus
      command: verify
      harness: null
      exhaustive: false
  - id: gate-pass-requires-structural-preflight
    proves: gate-pass-has-no-known-production-blockers
    kind: property
    subject: null
    input_space: RMS roots with valid structure, strict-blocking diagnostics, absent Git repositories, unborn Git repositories, and ordinary dirty working changes
    preconditions:
    - the root contains at least one RMS module and implementation binding
    operation: run rms gate and compare its result with strict structural audit checks excluding final provenance cleanliness
    oracle:
    - strict structural blockers make gate fail
    - missing source revision makes gate fail after deterministic checks
    - ordinary dirty source in an established repository may pass pre-commit gate when semantics and structure are valid
    - only a clean committed candidate can pass final strict audit
    evidence:
      kind: property
      path: verification/properties/gate_completion_integrity.md
    counterexamples:
      path: verification/fuzz/counterexamples
    realizations:
    - profile: smoke
      strategy: deterministic-corpus
      command: verify
      harness: null
      exhaustive: false
