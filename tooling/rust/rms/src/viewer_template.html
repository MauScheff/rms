<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>RMS Lawbook</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171717;
      --ink-soft: #454545;
      --muted: #737373;
      --quiet: #a3a3a3;
      --paper: #ffffff;
      --wash: #f7f7f5;
      --line: #e4e4e1;
      --line-strong: #cececa;
      --accent: #1f5b45;
      --accent-soft: #edf5f0;
      --danger: #a33a32;
      --danger-soft: #fff1ef;
      --warning: #8a5b13;
      --warning-soft: #fff8e8;
      --info: #365f8d;
      --info-soft: #eef4fa;
      --max-width: 1180px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent);
      outline-offset: 2px;
    }

    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper) 94%, transparent);
      backdrop-filter: blur(12px);
    }
    .header-inner {
      width: min(var(--max-width), calc(100% - 40px));
      margin: 0 auto;
      padding: 18px 0 0;
    }
    .identity-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }
    .identity { min-width: 0; }
    .product-name {
      margin: 0 0 3px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    #system-name {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(20px, 2.2vw, 28px);
      font-weight: 650;
      line-height: 1.18;
      letter-spacing: -.025em;
    }
    #system-purpose {
      max-width: 760px;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .header-actions { display: flex; align-items: center; gap: 10px; padding-top: 4px; }
    .source-state {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .source-state::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--quiet);
      vertical-align: 1px;
    }
    .source-state.live::before { background: var(--accent); }
    .plain-button {
      min-height: 32px;
      padding: 5px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: var(--paper);
      font-size: 12px;
    }
    .plain-button:hover { border-color: var(--ink-soft); }

    .tabs {
      display: flex;
      gap: 22px;
      margin-top: 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      padding: 10px 0 11px;
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { border-bottom-color: var(--accent); color: var(--ink); font-weight: 650; }
    .tab-count { margin-left: 5px; color: var(--quiet); font-size: 11px; font-variant-numeric: tabular-nums; }

    .toolbar {
      border-bottom: 1px solid var(--line);
      background: var(--wash);
    }
    .toolbar-inner {
      width: min(var(--max-width), calc(100% - 40px));
      min-height: 50px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(160px, 260px) auto;
      align-items: center;
      gap: 12px;
      margin: 0 auto;
    }
    .search { position: relative; }
    #search {
      width: 100%;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      color: var(--ink);
      background: var(--paper);
    }
    #search::placeholder { color: var(--quiet); }
    .select {
      width: 100%;
      height: 34px;
      padding: 0 28px 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      color: var(--ink-soft);
      background: var(--paper);
    }
    .toolbar-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }

    .main {
      width: min(var(--max-width), calc(100% - 40px));
      flex: 1;
      margin: 0 auto;
      padding: 34px 0 64px;
    }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 42px; }
    .workspace.has-detail { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
    .content { min-width: 0; }
    .detail {
      position: sticky;
      top: 174px;
      min-width: 0;
      max-height: calc(100vh - 202px);
      overflow: auto;
      padding-left: 28px;
      border-left: 1px solid var(--line);
    }
    .detail:empty { display: none; }

    .view-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }
    .view-header h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -.02em;
    }
    .view-header p { max-width: 720px; margin: 6px 0 0; color: var(--muted); }
    .view-tools { min-width: 170px; }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      margin: -10px 0 32px;
      padding: 0 0 18px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .summary strong { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }

    .section { margin-top: 32px; }
    .section:first-child { margin-top: 0; }
    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 10px;
    }
    .section-heading h3 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .section-heading span { color: var(--muted); font-size: 12px; }

    .list { border-top: 1px solid var(--line); }
    .row {
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr) 160px;
      align-items: start;
      gap: 18px;
      padding: 13px 4px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
    }
    .row:hover { background: var(--wash); }
    .row.active { background: var(--accent-soft); }
    .row-kind { color: var(--muted); font-size: 11px; text-transform: capitalize; }
    .row-main { min-width: 0; }
    .row-main strong { display: block; overflow-wrap: anywhere; font-weight: 650; }
    .row-main p { margin: 3px 0 0; color: var(--ink-soft); font-size: 13px; overflow-wrap: anywhere; }
    .row-side { color: var(--muted); font-size: 11px; text-align: right; overflow-wrap: anywhere; }

    .law-row { grid-template-columns: 100px minmax(0, 1fr) 170px; }
    .law-row .row-main strong { font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif; font-size: 17px; line-height: 1.35; font-weight: 500; }
    .law-row .row-main p { margin-top: 5px; font-size: 11px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: currentColor;
    }
    .status.satisfied { color: var(--accent); }
    .status.required-gap, .status.unresolved-link { color: var(--danger); }
    .status.recommendation { color: var(--warning); }
    .status.not-applicable { color: var(--quiet); }
    .closure-absent { color: var(--quiet); font-size: 11px; }

    .relation-row { grid-template-columns: minmax(120px, 1fr) 120px minmax(120px, 1fr); }
    .transition-row { grid-template-columns: minmax(140px, 1fr) minmax(90px, .65fr) minmax(110px, .8fr) minmax(90px, .65fr); }
    .trace-row { grid-template-columns: 80px minmax(0, 1fr) 170px; }

    .states {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 8px 0 24px;
    }
    .state {
      padding: 5px 8px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: var(--paper);
      font-size: 12px;
    }
    .state.initial { border-color: var(--accent); color: var(--accent); }

    .empty {
      padding: 28px 0;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }

    .detail-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .detail h2 { margin: 0; font-size: 18px; line-height: 1.3; overflow-wrap: anywhere; }
    .detail h3 {
      margin: 26px 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .detail p { color: var(--ink-soft); overflow-wrap: anywhere; }
    .close-button {
      padding: 0;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      line-height: 1.4;
    }
    .detail-list { margin: 0; }
    .detail-list div { padding: 8px 0; border-bottom: 1px solid var(--line); }
    .detail-list dt { color: var(--muted); font-size: 11px; text-transform: capitalize; }
    .detail-list dd { margin: 2px 0 0; overflow-wrap: anywhere; }
    .closure-step { padding: 9px 0; border-bottom: 1px solid var(--line); }
    .closure-step > div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .closure-step > div > span:last-child { color: var(--muted); font-size: 11px; }
    .closure-step p { margin: 5px 0 0; }
    .connection, .source {
      width: 100%;
      display: block;
      padding: 9px 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: var(--ink-soft);
      background: transparent;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .connection:hover, .source:hover { color: var(--accent); }
    .connection strong { display: block; color: var(--ink); font-size: 12px; }
    .source { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }

    .footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: var(--wash);
      font-size: 11px;
    }
    .footer-inner {
      width: min(var(--max-width), calc(100% - 40px));
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 auto;
    }
    .diff { display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
    .diff .added { color: var(--accent); }
    .diff .changed { color: var(--warning); }
    .diff .removed { color: var(--danger); }
    #revision { max-width: 45vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 54px;
      z-index: 20;
      max-width: min(420px, calc(100vw - 40px));
      padding: 9px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: var(--ink);
      color: var(--paper);
      font-size: 12px;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity .12s ease, transform .12s ease;
    }
    .toast.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 920px) {
      .header-inner, .toolbar-inner, .main, .footer-inner { width: min(100% - 24px, var(--max-width)); }
      .identity-row { display: block; }
      .header-actions { margin-top: 10px; }
      .toolbar-inner { grid-template-columns: 1fr 180px; padding: 8px 0; }
      .toolbar-meta { grid-column: 1 / -1; }
      .workspace.has-detail { grid-template-columns: 1fr; }
      .workspace.has-detail .detail {
        order: -1;
        position: static;
        max-height: none;
        padding: 0 0 26px;
        border-top: 0;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        border-left: 0;
      }
    }

    @media (max-width: 620px) {
      .header { position: static; }
      .header-inner { padding-top: 14px; }
      #system-purpose { display: none; }
      .tabs { gap: 18px; margin-top: 12px; }
      .toolbar-inner { grid-template-columns: 1fr; }
      .toolbar-meta { grid-column: auto; }
      .main { padding-top: 24px; }
      .view-header { display: block; }
      .view-tools { margin-top: 12px; }
      .row, .law-row, .relation-row, .transition-row, .trace-row { grid-template-columns: 1fr; gap: 5px; }
      .row-side { text-align: left; }
      .footer-inner { align-items: flex-start; flex-direction: column; gap: 3px; padding: 8px 0; }
      #revision { max-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="header-inner">
        <div class="identity-row">
          <div class="identity">
            <p class="product-name">RMS Lawbook</p>
            <h1 id="system-name">Loading system</h1>
            <p id="system-purpose"></p>
          </div>
          <div class="header-actions">
            <span class="source-state" id="source-state">Loading</span>
            <button class="plain-button" id="refresh" type="button">Refresh</button>
          </div>
        </div>
        <nav class="tabs" id="tabs" aria-label="Lawbook sections"></nav>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar-inner">
        <label class="search" aria-label="Search canonical semantics">
          <input id="search" type="search" autocomplete="off" placeholder="Search laws, modules, behaviors, machines, proof, or source paths">
        </label>
        <label>
          <select class="select" id="module-filter" aria-label="Filter by module"></select>
        </label>
        <div class="toolbar-meta" id="toolbar-meta"></div>
      </div>
    </div>

    <main class="main">
      <div class="workspace" id="workspace">
        <section class="content" id="content">
          <div class="empty">Building the canonical semantic graph…</div>
        </section>
        <aside class="detail" id="detail" aria-label="Selected semantic detail"></aside>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <span id="status-message">Read-only canonical projection</span>
        <span class="diff" id="semantic-diff"></span>
        <span id="revision"></span>
      </div>
    </footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>RMS Lawbook requires JavaScript.</noscript>
  <script src="/app.js" defer></script>
</body>
</html>
