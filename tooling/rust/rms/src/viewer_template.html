<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>RMS Explorer</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --soft-ink: #41505d;
      --muted: #6f7a84;
      --quiet: #929aa2;
      --field: #f4f5f6;
      --surface: #ffffff;
      --surface-2: #f9fafb;
      --line: #dce1e5;
      --line-strong: #c5ccd2;
      --teal: #0f766e;
      --teal-soft: #e8f4f2;
      --blue: #315f91;
      --blue-soft: #edf3f9;
      --green: #24643c;
      --green-soft: #edf6f0;
      --coral: #a84d32;
      --coral-soft: #fff1ec;
      --amber: #8a641f;
      --amber-soft: #fff8e7;
      --shadow: 0 14px 34px rgba(24, 35, 44, .08);
      --header-height: 72px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      background: var(--field);
      font-size: 14px;
      line-height: 1.45;
      letter-spacing: 0;
    }
    button, input { font: inherit; letter-spacing: 0; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid rgba(15, 118, 110, .5);
      outline-offset: 2px;
    }
    .app {
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: var(--header-height) 46px minmax(0, 1fr) 34px;
    }
    .topbar {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(260px, 440px) auto;
      align-items: center;
      gap: 20px;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .identity { min-width: 0; display: flex; align-items: center; gap: 13px; }
    .mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid #a9c9c4;
      border-radius: 7px;
      color: var(--teal);
      background: var(--teal-soft);
      font-weight: 800;
      font-size: 13px;
    }
    .identity-copy { min-width: 0; }
    .product {
      margin: 0 0 2px;
      color: var(--teal);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      overflow: hidden;
      font-size: 19px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .purpose {
      margin: 2px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .search-wrap { position: relative; min-width: 0; }
    .search-wrap::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 13px;
      width: 9px;
      height: 9px;
      border: 1.5px solid var(--muted);
      border-radius: 50%;
      transform: translateY(-60%);
      pointer-events: none;
    }
    .search-wrap::after {
      content: "";
      position: absolute;
      top: 53%;
      left: 22px;
      width: 6px;
      height: 1.5px;
      background: var(--muted);
      transform: rotate(45deg);
      transform-origin: left center;
      pointer-events: none;
    }
    #search {
      width: 100%;
      height: 38px;
      padding: 0 38px 0 34px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface-2);
      color: var(--ink);
    }
    #search::placeholder { color: var(--quiet); }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .live-status {
      min-width: 88px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--quiet);
    }
    .live-status.active .live-dot { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .icon-button {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface);
      font-weight: 700;
    }
    .icon-button:hover { color: var(--teal); border-color: #8bb9b2; }
    .modebar {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .modes { min-width: 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; }
    .mode-button {
      height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--soft-ink);
      font-size: 13px;
      font-weight: 680;
      white-space: nowrap;
    }
    .mode-button:hover { background: var(--field); }
    .mode-button.active { color: var(--teal); background: var(--teal-soft); }
    .mode-context {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr) 330px;
    }
    .sidebar, .inspector {
      min-height: 0;
      overflow: hidden;
      background: var(--surface);
    }
    .sidebar { border-right: 1px solid var(--line); }
    .inspector { border-left: 1px solid var(--line); }
    .panel-head {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 15px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title { margin: 0; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .panel-count { color: var(--quiet); font-size: 11px; font-variant-numeric: tabular-nums; }
    .module-list, .inspector-body { height: calc(100% - 46px); overflow: auto; }
    .module-list { padding: 7px; }
    .module-button {
      width: 100%;
      min-height: 55px;
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      padding: 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      text-align: left;
    }
    .module-button:hover { background: var(--field); }
    .module-button.active { background: var(--blue-soft); }
    .kind-rail { width: 3px; height: 34px; margin: 1px auto 0; border-radius: 2px; background: var(--blue); }
    .kind-rail.composite { background: var(--teal); }
    .kind-rail.adapter, .kind-rail.boundary-adapter { background: var(--coral); }
    .module-name { display: block; overflow-wrap: anywhere; font-weight: 720; }
    .module-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .stage { min-width: 0; min-height: 0; overflow: auto; padding: 22px 24px 44px; }
    .stage-inner { width: min(1120px, 100%); margin: 0 auto; }
    .view-heading {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }
    .view-heading h2 { margin: 0; font-size: 23px; line-height: 1.15; }
    .view-heading p { max-width: 68ch; margin: 6px 0 0; color: var(--soft-ink); }
    .source-chip, .badge {
      display: inline-flex;
      align-items: center;
      min-height: 23px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: 11px;
      font-weight: 680;
      white-space: nowrap;
    }
    .badge.direct, .badge.pass { color: var(--green); border-color: #b8d3c0; background: var(--green-soft); }
    .badge.inferred, .badge.warning { color: var(--amber); border-color: #e4d2a7; background: var(--amber-soft); }
    .badge.gap, .badge.error { color: var(--coral); border-color: #e1baaF; background: var(--coral-soft); }
    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      margin: 0 0 22px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .stat { min-width: 0; padding: 14px 16px; border-right: 1px solid var(--line); }
    .stat:last-child { border-right: 0; }
    .stat strong { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .section-label { margin: 24px 0 9px; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .semantic-list { border-top: 1px solid var(--line); }
    .semantic-row {
      width: 100%;
      min-height: 62px;
      display: grid;
      grid-template-columns: minmax(140px, .7fr) minmax(220px, 1.5fr) auto;
      align-items: center;
      gap: 16px;
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
    }
    .semantic-row:hover, .semantic-row.active { background: var(--surface); }
    .semantic-title { min-width: 0; overflow-wrap: anywhere; font-weight: 720; }
    .semantic-summary { min-width: 0; color: var(--soft-ink); overflow-wrap: anywhere; }
    .semantic-meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .topology {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .topology-node {
      min-width: 0;
      min-height: 116px;
      padding: 13px;
      border: 1px solid var(--line-strong);
      border-top: 3px solid var(--blue);
      border-radius: 7px;
      background: var(--surface);
      text-align: left;
    }
    .topology-node:hover, .topology-node.active { border-color: #7fa1c1; box-shadow: var(--shadow); }
    .topology-node.composite { border-top-color: var(--teal); }
    .topology-node.adapter, .topology-node.boundary-adapter { border-top-color: var(--coral); }
    .topology-node h3 { margin: 6px 0 5px; font-size: 15px; overflow-wrap: anywhere; }
    .topology-node p { margin: 0; color: var(--soft-ink); font-size: 12px; }
    .topology-counts { display: flex; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 10px; }
    .relationship-list { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
    .relationship {
      display: grid;
      grid-template-columns: minmax(110px, 1fr) auto minmax(110px, 1fr) minmax(100px, .7fr);
      gap: 12px;
      align-items: center;
      min-height: 44px;
      padding: 7px 11px;
      background: var(--surface);
      font-size: 12px;
    }
    .arrow { color: var(--teal); font-weight: 800; }
    .trace-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; }
    .trace-list { min-width: 0; border-right: 1px solid var(--line); padding-right: 14px; }
    .trace-button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      text-align: left;
    }
    .trace-button:hover, .trace-button.active { background: var(--teal-soft); }
    .trace-button strong { display: block; overflow-wrap: anywhere; }
    .trace-button span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .trace-steps { min-width: 0; }
    .trace-step {
      position: relative;
      margin-left: 13px;
      padding: 0 0 22px 24px;
      border-left: 1px solid #b9cac7;
    }
    .trace-step:last-child { border-left-color: transparent; }
    .trace-step::before {
      content: "";
      position: absolute;
      top: 2px;
      left: -5px;
      width: 9px;
      height: 9px;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 1px var(--teal);
    }
    .trace-step h3 { margin: 0 0 5px; font-size: 15px; }
    .trace-step p { margin: 4px 0; color: var(--soft-ink); }
    .reading-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; margin-top: 10px; }
    .reading { min-width: 0; }
    .reading dt { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .reading dd { margin: 2px 0 0; overflow-wrap: anywhere; font-size: 12px; }
    .empty {
      padding: 42px 20px;
      border: 1px dashed var(--line-strong);
      border-radius: 7px;
      color: var(--muted);
      background: rgba(255,255,255,.45);
      text-align: center;
    }
    .inspector-body { padding: 16px; }
    .inspector-body h2 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
    .inspector-body h3 { margin: 20px 0 7px; color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .inspector-body p { margin: 7px 0; color: var(--soft-ink); overflow-wrap: anywhere; }
    .inspector-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .source-list, .clause-list, .neighbor-list { display: grid; gap: 6px; }
    .source-button, .neighbor-button {
      width: 100%;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-2);
      overflow-wrap: anywhere;
      text-align: left;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }
    .source-button:hover, .neighbor-button:hover { border-color: #8bb9b2; }
    .clause {
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }
    .clause:last-child { border-bottom: 0; }
    .clause strong { display: block; font-size: 12px; }
    .clause span { display: block; margin-top: 3px; color: var(--soft-ink); font-size: 12px; }
    .statusbar {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 18px;
      padding: 0 14px;
      color: var(--muted);
      background: var(--surface);
      border-top: 1px solid var(--line);
      font-size: 11px;
    }
    .status-message { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .diff { display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
    .diff .added { color: var(--green); }
    .diff .changed { color: var(--amber); }
    .diff .removed { color: var(--coral); }
    .revision { max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 48px;
      max-width: min(420px, calc(100vw - 36px));
      padding: 10px 13px;
      border: 1px solid #a9c9c4;
      border-radius: 7px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--teal);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }
    .toast.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 1060px) {
      .workspace { grid-template-columns: 220px minmax(0, 1fr); }
      .inspector { display: none; }
      .topology { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { grid-template-columns: minmax(220px, 1fr) minmax(220px, 360px) auto; }
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; grid-template-rows: auto auto auto auto; }
      .topbar { grid-template-columns: 1fr auto; padding: 12px; }
      .search-wrap { grid-column: 1 / -1; grid-row: 2; }
      .purpose { white-space: normal; }
      .modebar { align-items: start; padding: 7px 10px; }
      .mode-context { display: none; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar { border: 0; border-bottom: 1px solid var(--line); }
      .module-list { height: auto; max-height: 210px; }
      .stage { padding: 18px 12px 36px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat { border-bottom: 1px solid var(--line); }
      .topology { grid-template-columns: 1fr; }
      .trace-layout { grid-template-columns: 1fr; }
      .trace-list { border-right: 0; border-bottom: 1px solid var(--line); padding: 0 0 12px; }
      .semantic-row { grid-template-columns: 1fr; gap: 3px; }
      .relationship { grid-template-columns: 1fr auto 1fr; }
      .relationship span:last-child { grid-column: 1 / -1; }
      .reading-grid { grid-template-columns: 1fr; }
      .statusbar { grid-template-columns: 1fr; gap: 2px; padding: 7px 12px; }
      .revision { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="identity">
        <div class="mark" aria-hidden="true">RMS</div>
        <div class="identity-copy">
          <p class="product">Semantic Explorer</p>
          <h1 id="system-name">Loading system</h1>
          <p class="purpose" id="system-purpose"></p>
        </div>
      </div>
      <div class="search-wrap">
        <input id="search" type="search" autocomplete="off" placeholder="Find a module, command, state, effect, law, or proof">
      </div>
      <div class="top-actions">
        <div class="live-status" id="live-status"><span class="live-dot"></span><span id="live-label">Loading</span></div>
        <button class="icon-button" id="refresh" type="button" title="Refresh canonical projection" aria-label="Refresh canonical projection">&#8635;</button>
      </div>
    </header>

    <nav class="modebar" aria-label="Inspection mode">
      <div class="modes" id="modes"></div>
      <div class="mode-context" id="mode-context"></div>
    </nav>

    <div class="workspace">
      <aside class="sidebar">
        <div class="panel-head">
          <h2 class="panel-title">Modules</h2>
          <span class="panel-count" id="module-count">0</span>
        </div>
        <div class="module-list" id="module-list"></div>
      </aside>

      <main class="stage">
        <div class="stage-inner" id="stage">
          <div class="empty">Building the canonical semantic projection...</div>
        </div>
      </main>

      <aside class="inspector">
        <div class="panel-head">
          <h2 class="panel-title">Inspector</h2>
          <span class="panel-count" id="inspector-kind">System</span>
        </div>
        <div class="inspector-body" id="inspector"></div>
      </aside>
    </div>

    <footer class="statusbar">
      <div class="status-message" id="status-message">Read-only projection</div>
      <div class="diff" id="diff"></div>
      <div class="revision" id="revision"></div>
    </footer>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <noscript>RMS Explorer requires JavaScript to inspect the generated semantic projection.</noscript>
  <script src="/app.js" defer></script>
</body>
</html>
