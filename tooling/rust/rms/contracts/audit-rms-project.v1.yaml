spec: rms/contract/v0.1
name: "audit-rms-project"
version: 1
kind: command
meaning: "Audit a committed RMS project for production blockers across semantics, composition, implementation structure, evidence, traces, and provenance."
preconditions:
  - id: "accepts-1"
    statement: "a readable RMS project root and optional strict production mode"
postconditions:
  - id: "ensures-1"
    statement: "strict mode rejects active scaffold contracts and evidence that claims an uncommitted or missing source revision"
  - id: "ensures-2"
    statement: "the report remains provider-independent and identifies every deterministic blocker"
failure_categories:
  - id: "rejects-1"
    statement: "unknown source revision, dirty production artifacts, semantic or structural drift, invalid trace evidence, scaffold contracts, unpinned evidence, and missing verification commands"
compatibility:
  policy: backward-compatible-within-major
