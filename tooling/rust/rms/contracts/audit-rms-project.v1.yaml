spec: rms/contract/v0.1
name: "audit-rms-project"
version: 1
kind: command
meaning: "Audit a committed RMS project for production blockers across semantic revision integrity, composition, implementation structure, evidence, traces, and provenance."
preconditions:
  - id: "accepts-1"
    statement: "a readable committed RMS project root and optional strict production mode"
postconditions:
  - id: "ensures-1"
    statement: "strict mode verifies canonical semantics still match their RMS-applied revision"
  - id: "ensures-2"
    statement: "strict mode verifies every named transition case and effect-result branch has replay evidence"
  - id: "ensures-3"
    statement: "the report remains provider-independent and identifies every deterministic blocker"
failure_categories:
  - id: "rejects-1"
    statement: "unknown source revision, dirty production artifacts, direct canonical drift, incomplete transition cases, invalid or thin trace evidence, scaffold contracts, unpinned evidence, and missing verification commands"
compatibility:
  policy: backward-compatible-within-major
