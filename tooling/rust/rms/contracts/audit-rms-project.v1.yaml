spec: rms/contract/v0.1
name: "audit-rms-project"
version: 1
kind: command
meaning: "Audit a committed RMS project for production blockers across semantic revision integrity, protocol and artifact composition, resource closure, authority containment, properties, traces, implementation structure, evidence, and provenance."
preconditions:
  - id: "accepts-1"
    statement: "A canonical RMS project root with an optional strict production policy."
postconditions:
  - id: "ensures-1"
    statement: "The report distinguishes pass, failure, review-required, and not-applicable outcomes with source provenance."
  - id: "ensures-2"
    statement: "Strict mode rejects unresolved protocol routes, resource leaks, undeclared authority, artifact incompatibility, unrealized temporal claims, broken system traces, semantic drift, and placeholder evidence."
failure_categories:
  - id: "rejects-1"
    statement: "Invalid roots, unreadable artifacts, or production claims whose required evidence cannot be evaluated."
compatibility:
  policy: backward-compatible-within-major
