spec: rms/contract/v0.2
name: capture-intent-workbench
version: 1
kind: command
meaning: Render an advisory RMS intent-capture prompt that helps humans and agents
  understand, synthesize, and accept semantic context before implementation.
semantics:
  behavior:
    observations: []
    requires:
    - id: task-supplied
      statement: The human need, feature idea, semantic change, or uncertainty is
        supplied as task text.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: target-module-readable
      statement: The target module manifest is readable and parseable.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: prompt-elicits-intent-before-code
      statement: The prompt asks the reviewer or agent to normalize human intent into
        stories, actors, state, actions, success results, failure results, stale behavior,
        and conflicting-state behavior before proposing implementation.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: prompt-asks-only-semantic-questions
      statement: The prompt asks only questions needed to resolve product, domain,
        ownership, source-of-truth, lifecycle, compatibility, or operational ambiguity.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: prompt-synthesizes-rms-artifacts
      statement: The prompt asks for candidate contracts, laws, invariants, glossary
        terms, ownership, effects, compatibility impact, proof lanes, and canonical
        artifacts to update before implementation.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: prompt-keeps-rationale-advisory
      statement: The prompt separates raw conversation notes from accepted rationale
        and states that prompt output is evidence rather than semantic authority until
        encoded in canonical artifacts.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: prompt-produces-gate-result
      statement: The prompt asks for an implementation gate result of ready, blocked
        on questions, or drift detected.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: provider-execution-is-optional
      statement: Provider-backed intent capture is opt-in and must preserve the rendered
        prompt and provider response as a run record.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: missing-task
      statement: No intent-capture task was supplied.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: provider-unavailable
      statement: The requested provider command cannot be started or exits unsuccessfully.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
