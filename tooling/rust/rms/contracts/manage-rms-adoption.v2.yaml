spec: rms/contract/v0.2
name: manage-rms-adoption
version: 2
kind: command
meaning: Inspect or change RMS workspace coverage while reporting the exact certification
  scope, discovered closure count, and unowned production paths.
semantics:
  behavior:
    observations: []
    requires:
    - id: accepts-1
      statement: A readable RMS workspace and either status or an explicit progressive
        or complete coverage update.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: ensures-1
      statement: Status prominently reports coverage mode, certification statement,
        governed modules, unowned count, and bounded sample.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-2
      statement: Dry-run does not mutate configuration and complete coverage is accepted
        only when every production path is RMS-owned.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: rejects-1
      statement: Unknown coverage modes, unreadable configuration, unresolved module
        closures, and complete coverage with unowned production paths.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
