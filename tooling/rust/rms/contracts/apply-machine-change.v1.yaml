spec: rms/contract/v0.1
name: "apply-machine-change"
version: 1
kind: command
meaning: "Validate and apply a language-neutral machine change to canonical implementation structure, record the exact change, and seal the resulting semantic revision without treating generated declarations as replay evidence."
preconditions:
  - id: "accepts-1"
    statement: "One complete rms/machine-change/v0.1 object supplied as inline JSON, inline YAML, or a change file."
  - id: "accepts-2"
    statement: "Set, add, and remove operations over machine variants, effect protocols, transitions, and declared roles."
  - id: "accepts-3"
    statement: "A candidate that repairs invalid optional serialization or replaces noncanonical fields, provided the final candidate is valid."
postconditions:
  - id: "ensures-1"
    statement: "The complete post-change candidate is validated before any write."
  - id: "ensures-2"
    statement: "Successful apply updates canonical machine declarations and requested role placeholders, records the exact change, and reseals module and implementation semantics."
  - id: "ensures-3"
    statement: "Apply preserves declared trace roles but does not generate active replay evidence from its own transition declarations."
  - id: "ensures-4"
    statement: "Dry-run reports the complete final machine and planned writes without mutation."
failure_categories:
  - id: "rejects-1"
    statement: "Unsupported change specifications or invalid stable identifiers."
  - id: "rejects-2"
    statement: "Unknown or multiply classified transition inputs, stale removal targets, duplicate variants or cases, and invalid state or output references."
  - id: "rejects-3"
    statement: "Effects without typed result protocols or declared executors."
  - id: "rejects-4"
    statement: "Aggregate protocols without justification and independent evidence."
compatibility:
  policy: backward-compatible-within-major
