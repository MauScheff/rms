spec: rms/contract/v0.1
name: "check-rms-project"
version: 1
kind: command
meaning: "Run one deterministic RMS readiness mode for a complete workspace or explicit RMS module dependency closure and project the exact certified scope through the compact RMS surface envelope."
preconditions:
  - id: "accepts-1"
    statement: "A readable repository root, zero or one of environment, changes, or committed mode, optional machine-readable and detailed projection selections, and an optional module for changes or committed proof."
postconditions:
  - id: "ensures-1"
    statement: "Default mode runs validation and composition, environment runs diagnosis, changes runs the RMS gate, and committed runs strict production proof through shared implementations rather than recursive CLI invocation."
  - id: "ensures-2"
    statement: "Module-scoped proof includes the target, contained children, contracts, implementation, and transitive declared providers; unrelated out-of-scope dirt is reported but does not invalidate the closure."
  - id: "ensures-3"
    statement: "Progressive root checks explicitly certify discovered RMS module closures rather than the whole repository, while complete coverage rejects unowned production paths."
  - id: "ensures-4"
    statement: "Every report uses rms.surface/v2 with command, result, summary, reasons, warnings, next_action, done_when, details_available, mode, component summaries, and optional complete delegated evidence."
  - id: "ensures-5"
    statement: "Success is reported only when every selected in-scope component passes; the facade does not invoke providers, mutate canonical semantics, grant Git authority, or turn a dirty candidate into committed evidence."
failure_categories:
  - id: "rejects-1"
    statement: "Invalid mode combinations, unreadable roots or modules, unresolved module closures, delegated reports that cannot be constructed truthfully, and untruthful complete-coverage claims."
compatibility:
  policy: backward-compatible-within-major
