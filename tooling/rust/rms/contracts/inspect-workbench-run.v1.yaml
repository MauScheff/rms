spec: rms/contract/v0.2
name: inspect-workbench-run
version: 1
kind: query
meaning: Inspect one saved RMS workbench run record by id or path.
semantics:
  behavior:
    observations: []
    requires:
    - id: run-record-exists
      statement: The requested run id resolves to an existing run directory, or the
        requested path exists.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: inspection-derived-from-run-record
      statement: The inspection output is derived from request metadata, file presence,
        validation checks, provider logs, and response content when present.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: run-record-not-mutated
      statement: Inspecting a run record does not mutate run artifacts or project
        source files.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: missing-run-record
      statement: The requested run record does not exist.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: malformed-run-artifact
      statement: A run artifact exists but cannot be parsed in its expected format.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: invalid-config
      statement: The configured run-record directory cannot be resolved from optional
        workbench config.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
