spec: rms/contract/v0.1
name: inspect-implementation-structure
version: 1
kind: command
meaning: Print a focused inner-structure report for an RMS implementation binding.
preconditions:
  - id: readable-implementation-binding
    statement: The target path is a readable RMS implementation binding.
postconditions:
  - id: report-derived-from-binding
    statement: The report identifies the target implementation, module, binding, semantic shape, declared machine roles, declared role files, and focused structure or evidence diagnostics derived from the implementation binding.
  - id: advisory-findings-preserved
    statement: Missing or stale inner-structure declarations, placeholder evidence, and hidden-effect findings are reported as advisory diagnostics unless another validation error makes the implementation invalid.
failure_categories:
  - id: invalid-implementation-binding
    statement: The target path cannot be read, cannot be parsed, or is not an RMS implementation binding.
compatibility:
  policy: backward-compatible-within-major
