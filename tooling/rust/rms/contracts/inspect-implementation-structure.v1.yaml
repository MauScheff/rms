spec: rms/contract/v0.1
name: "inspect-implementation-structure"
version: 1
kind: command
meaning: "Print and validate the canonical inner structure realized by an RMS implementation binding."
preconditions:
  - id: "accepts-1"
    statement: "a readable RMS implementation binding with inspectable or explicitly opaque source"
postconditions:
  - id: "ensures-1"
    statement: "the report distinguishes binding container types from semantic variants and named transition cases"
  - id: "ensures-2"
    statement: "public domain values cannot silence validated-construction checks through a generic public-field allowlist"
  - id: "ensures-3"
    statement: "runnable delegation targets and role ownership are checked against canonical declarations"
failure_categories:
  - id: "rejects-1"
    statement: "missing declared symbols or roles, undeclared semantic source ownership, invalid public domain representation, undeclared effects, and malformed machine or surface structure"
compatibility:
  policy: backward-compatible-within-major
