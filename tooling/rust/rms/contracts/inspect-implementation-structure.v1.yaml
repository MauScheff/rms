spec: rms/contract/v0.1
name: inspect-implementation-structure
version: 1
kind: command
meaning: Print a focused inner-structure report for an RMS implementation binding.
preconditions:
  - id: readable-implementation-binding
    statement: The target path is a readable RMS implementation binding.
postconditions:
  - id: report-derived-from-binding
    statement: The report identifies the target implementation, module, binding, semantic shape, declared machine roles, message envelopes, transition output, trace roles, declared role files, and focused structure, source-symbol, or evidence diagnostics derived from the implementation binding.
  - id: advisory-findings-preserved
    statement: Missing or stale inner-structure declarations, placeholder evidence, hidden-effect findings, projection command emission, hidden choreography, and traceability gaps are reported as advisory diagnostics unless another validation error makes the implementation invalid.
  - id: declared-symbol-findings-preserved
    statement: If an implementation binding declares machine/state/command/event/effect/reply/rejection or transition-function symbols that cannot be found in inspectable source, the report marks the implementation invalid with source-symbol diagnostics.
failure_categories:
  - id: invalid-implementation-binding
    statement: The target path cannot be read, cannot be parsed, or is not an RMS implementation binding.
compatibility:
  policy: backward-compatible-within-major
