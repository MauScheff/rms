spec: rms/contract/v0.2
name: apply-semantic-change
version: 2
kind: command
meaning: Validate and atomically apply one language-neutral semantic revision only
  after a current route receipt authorizes the selected module and semantic action.
semantics:
  behavior:
    observations: []
    requires:
    - id: accepts-1
      statement: One complete rms/semantic-change/v0.1 object, readable target, and
        ready matching route receipt.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: ensures-1
      statement: Receipt validation precedes final-candidate computation in dry-run
        and write modes.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-2
      statement: Contracts, laws, properties, bindings, and sealed revision history
        update together and the result identifies the accepted receipt.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: rejects-1
      statement: Missing, stale, tampered, non-ready, wrong-owner, wrong-action, or
        wrong-target receipts and any invalid, unclosed, incompatible, or unsupported
        semantic candidate.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
