spec: rms/contract/v0.1
name: "apply-semantic-change"
version: 1
kind: command
meaning: "Validate and atomically apply language-neutral module, machine, protocol, resource, artifact, authority, temporal-property, and evidence revisions while sealing the resulting canonical state."
preconditions:
  - id: "accepts-1"
    statement: "One complete rms/semantic-change/v0.1 object targeting a readable module or implementation."
  - id: "accepts-2"
    statement: "Set, add, and remove operations whose protocol participants, resource operations, artifacts, transformations, authorities, machine cases, properties, and evidence references resolve in the final candidate."
postconditions:
  - id: "ensures-1"
    statement: "Canonical module and implementation semantics are updated together with an immutable applied change record and revision seal."
  - id: "ensures-2"
    statement: "Dry-run reports the complete final machine, protocols, resources, artifacts, transformations, authorities, semantic functions, and planned writes without mutation."
  - id: "ensures-3"
    statement: "Bindings realize canonical semantics but cannot invent protocol, resource, artifact, or authority meaning."
failure_categories:
  - id: "rejects-1"
    statement: "Unknown participants, messages, artifacts, authorities, effects, results, transitions, resources, or evidence references."
  - id: "rejects-2"
    statement: "Duplicate identifiers, invalid removals, unclosed resource lifecycles, and incompatible final semantic candidates."
compatibility:
  policy: backward-compatible-within-major
