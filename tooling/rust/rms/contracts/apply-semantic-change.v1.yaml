spec: rms/contract/v0.1
name: "apply-semantic-change"
version: 1
kind: command
meaning: "Validate and atomically apply language-neutral semantic additions, replacements, and removals, including implementation semantic-function bindings, while sealing the resulting canonical semantic revision."
preconditions:
  - id: "accepts-1"
    statement: "one complete rms/semantic-change/v0.1 object targeting a readable module or implementation"
  - id: "accepts-2"
    statement: "named transition cases when one state and input can produce different destinations or outputs"
  - id: "accepts-3"
    statement: "semantic_functions add, set, and remove operations whose ids, symbols, kinds, purity, discharged promises, assumptions, and evidence references are valid for the implementation binding"
postconditions:
  - id: "ensures-1"
    statement: "canonical module and implementation semantics are updated together with the exact committed change record"
  - id: "ensures-2"
    statement: "the resulting semantic projection carries a deterministic revision digest that changes after direct canonical edits"
  - id: "ensures-3"
    statement: "dry-run reports the complete final intended machine, semantic-function set, and planned writes without mutation"
  - id: "ensures-4"
    statement: "semantic-function operations preserve a unique final id set and update implementation.yaml without direct manifest editing"
  - id: "ensures-5"
    statement: "incremental semantic changes preserve existing runnable surfaces unless a non-empty replacement or explicit named removal requests a surface change"
failure_categories:
  - id: "rejects-1"
    statement: "empty or incomplete semantic changes, unknown references, duplicate ids or transition cases, invalid removal targets, ambiguous empty surface replacement, and incomplete law, contract, property, function, surface, or evidence declarations"
compatibility:
  policy: backward-compatible-within-major
