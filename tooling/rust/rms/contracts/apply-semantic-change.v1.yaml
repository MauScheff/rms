spec: rms/contract/v0.1
name: "apply-semantic-change"
version: 1
kind: command
meaning: "Validate and atomically apply language-neutral semantic additions, replacements, and removals to canonical RMS artifacts."
preconditions:
  - id: "accepts-1"
    statement: "one rms/semantic-change/v0.1 object targeting a readable module or implementation"
postconditions:
  - id: "ensures-1"
    statement: "contracts.set rewrites one existing public contract and preserves one matching public command"
  - id: "ensures-2"
    statement: "contracts.remove removes the matching public command and conventional contract file"
  - id: "ensures-3"
    statement: "dry-run reports the final intended writes without mutation"
failure_categories:
  - id: "rejects-1"
    statement: "missing contract replacement targets, duplicate operations, incomplete contract meaning or outcomes, unsafe paths, and invalid machine or surface references"
compatibility:
  policy: backward-compatible-within-major
