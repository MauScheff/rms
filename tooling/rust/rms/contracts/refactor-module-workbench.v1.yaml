spec: rms/contract/v0.2
name: refactor-module-workbench
version: 1
kind: command
meaning: Render an advisory RMS refactor prompt for behavior-preserving internal module
  changes.
semantics:
  behavior:
    observations: []
    requires:
    - id: task-supplied
      statement: The requested refactor is supplied as task text.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: target-module-readable
      statement: The target module manifest is readable and parseable.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: refactor-prompt-preserves-public-meaning
      statement: The prompt asks the reviewer or agent to preserve public contracts,
        invariants, declared effects, compatibility, and verification meaning.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: refactor-provider-execution-is-optional
      statement: Provider-backed refactor guidance is opt-in and must preserve the
        rendered prompt and provider response as a run record.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: missing-task
      statement: No refactor task was supplied.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
