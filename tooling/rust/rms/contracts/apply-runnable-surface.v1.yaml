spec: rms/contract/v0.1
name: apply-runnable-surface
version: 1
kind: command
meaning: Validate and apply a runnable surface declaration to an implementation binding's canonical architecture roles and evidence.
preconditions:
  - id: implementation-readable
    statement: "The target `implementation.yaml` is readable and parseable."
  - id: surface-declaration-supplied
    statement: The caller supplies kind, surface, entrypoint, delegated role or symbol, and public command.
postconditions:
  - id: canonical-surface-recorded
    statement: "Successful non-dry-run application records `architecture.surfaces` and `architecture.roles.runnable_surface`."
  - id: evidence-recorded
    statement: Runnable surface evidence is created or preserved and names the boundary delegation promise.
  - id: dry-run-does-not-write
    statement: "`--dry-run` reports planned writes and diagnostics without mutating artifacts."
failure_categories:
  - id: invalid-surface-kind
    statement: The declaration uses an unsupported surface kind or host surface.
  - id: unsafe-entrypoint
    statement: The entrypoint or evidence path is not a safe module-relative artifact path.
compatibility:
  policy: backward-compatible-within-major
