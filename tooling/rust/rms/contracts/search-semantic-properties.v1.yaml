spec: rms/contract/v0.1
name: search-semantic-properties
version: 1
kind: command
meaning: Explore a finite probe assembly deterministically for the shortest satisfying witness or a minimized replayable violation.
preconditions:
- id: accepts-1
  statement: One executable property and a valid rms/probe-assembly/v0.1.
- id: accepts-2
  statement: A satisfy or violate goal and finite probe bounds.
postconditions:
- id: ensures-1
  statement: Breadth-first search and stable tie-breaking choose the shortest matching trace.
- id: ensures-2
  statement: Exhaustive conclusions are emitted only when state, schedule, and step spaces are exhausted.
- id: ensures-3
  statement: Evidence retains source digests, bounds, coverage, assumptions, and a replay recipe.
failure_categories:
- id: rejects-1
  statement: Invalid properties or assemblies, unsupported domains, runner failures, timeouts, or non-exhausted bounds presented as proof.
compatibility:
  policy: backward-compatible-within-major
