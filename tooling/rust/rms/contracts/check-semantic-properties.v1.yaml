spec: rms/contract/v0.1
name: "check-semantic-properties"
version: 1
kind: command
meaning: "Check language-neutral property declarations and prove that every executable realization can truthfully evaluate its claim."
preconditions:
  - id: "accepts-1"
    statement: "module or implementation semantics with input spaces, operations, oracles, evidence, and realization metadata"
  - id: "accepts-2"
    statement: "deterministic corpus, exhaustive, generated, coverage-guided, model-checking, static-analysis, sanitizer, and benchmark strategies"
postconditions:
  - id: "ensures-1"
    statement: "every executable realization names an exact runner"
  - id: "ensures-2"
    statement: "generated and exhaustive realizations name an exact generator"
  - id: "ensures-3"
    statement: "inspectable runners call their generator when required, exercise the declared operation, and apply a binding-native oracle"
  - id: "ensures-4"
    statement: "fixed corpora, exhaustive spaces, generators, fuzzers, model checkers, analyzers, sanitizers, and benchmarks remain distinct"
failure_categories:
  - id: "rejects-1"
    statement: "missing or unresolved generator or runner"
  - id: "rejects-2"
    statement: "runner that bypasses its generator, semantic operation, or oracle"
  - id: "rejects-3"
    statement: "realization strategy incapable of evaluating the declared claim"
compatibility:
  policy: backward-compatible-within-major
