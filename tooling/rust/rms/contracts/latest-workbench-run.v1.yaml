spec: rms/contract/v0.2
name: latest-workbench-run
version: 1
kind: query
meaning: Inspect the newest saved RMS workbench run record from the configured run
  directory.
semantics:
  behavior:
    observations: []
    requires:
    - id: run-root-readable
      statement: The run root is readable when present.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: latest-run-derived-from-run-records
      statement: The inspected run is selected from saved run directories by newest
        run id ordering.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: inspection-derived-from-run-record
      statement: The inspection output is derived from request metadata, file presence,
        validation checks, provider logs, and response content when present.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: run-record-not-mutated
      statement: Inspecting the latest run record does not mutate run artifacts or
        project source files.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: no-run-records
      statement: No saved run records exist in the resolved run directory.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: unreadable-run-root
      statement: The run root exists but cannot be read.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: invalid-config
      statement: The configured run-record directory cannot be resolved from optional
        workbench config.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
