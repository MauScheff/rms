spec: rms/contract/v0.2
name: list-workbench-runs
version: 1
kind: query
meaning: List saved RMS workbench run records from the configured run directory.
semantics:
  behavior:
    observations: []
    requires:
    - id: run-root-readable-or-missing
      statement: The run root is either readable or absent.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: run-records-not-mutated
      statement: Listing run records does not mutate run artifacts or project source
        files.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: summary-derived-from-request
      statement: Each listed run is summarized from its directory name and request
        metadata when present.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: unreadable-run-root
      statement: The run root exists but cannot be read.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: invalid-config
      statement: The configured run-record directory cannot be resolved from optional
        workbench config.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
