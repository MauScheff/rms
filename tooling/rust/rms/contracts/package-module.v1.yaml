spec: rms/contract/v0.1
name: "package-module"
version: 1
kind: command
meaning: "Assemble and verify a portable RMS module package and record concrete reusable-package proof when the module declares reusable intent."
preconditions:
  - id: "accepts-1"
    statement: "a valid RMS module manifest with readable referenced artifacts"
  - id: "accepts-2"
    statement: "an absent output directory or an existing output explicitly allowed for replacement"
postconditions:
  - id: "ensures-1"
    statement: "package metadata identifies payload files sizes checksums validator identity and source revision"
  - id: "ensures-2"
    statement: "the assembled package passes deterministic package verification before success is reported"
  - id: "ensures-3"
    statement: "reusable package evidence records the successful result and the final rebuilt artifact includes that proof"
failure_categories:
  - id: "rejects-1"
    statement: "invalid or missing source artifacts"
  - id: "rejects-2"
    statement: "unsafe output overwrite without force"
  - id: "rejects-3"
    statement: "package verification failure"
  - id: "rejects-4"
    statement: "reusable evidence recording or final rebuild failure"
compatibility:
  policy: backward-compatible-within-major
