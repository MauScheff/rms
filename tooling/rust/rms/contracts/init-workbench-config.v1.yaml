spec: rms/contract/v0.2
name: init-workbench-config
version: 1
kind: command
meaning: Create an optional RMS workbench config file with provider and run-record
  defaults plus provider-timeout guidance.
semantics:
  behavior:
    observations: []
    requires:
    - id: root-writable
      statement: The requested root can contain `.rms/config.yaml`.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: config-is-operational
      statement: The created config supplies provider, model, sandbox, optional write-scope,
        optional provider-timeout, and run-record defaults only; it does not define
        module semantics.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: existing-config-preserved-by-default
      statement: Existing config is not overwritten unless force is requested.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: generated-config-is-parseable
      statement: The generated YAML can be parsed by RMS workbench config loading.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: config-exists
      statement: A workbench config already exists and overwrite was not requested.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: unwritable-config
      statement: The config directory or file cannot be created.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
