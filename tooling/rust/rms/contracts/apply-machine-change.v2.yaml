spec: rms/contract/v0.2
name: apply-machine-change
version: 2
kind: command
meaning: Validate and atomically apply one focused machine-structure revision only
  after a current route receipt authorizes the target implementation and machine action.
semantics:
  behavior:
    observations: []
    requires:
    - id: accepts-1
      statement: One machine-change object, readable implementation binding, and ready
        matching route receipt.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: ensures-1
      statement: Receipt validation precedes final-candidate computation in dry-run
        and write modes.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-2
      statement: The complete final machine remains canonical, validated, atomically
        written, and linked to the accepted receipt in the result.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: rejects-1
      statement: Missing or invalid receipts and malformed, incomplete, inconsistent,
        or unsupported machine changes.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
