spec: rms/contract/v0.1
name: "describe-rms-command-surface"
version: 1
kind: command
meaning: "Describe the deterministic RMS command doorway as five primary commands with an explicitly requested grouped catalog of directly callable specialist commands."
preconditions:
  - id: "accepts-1"
    statement: "the default help request or an explicit all-command help request"
  - id: "accepts-2"
    statement: "the compiled RMS command metadata"
postconditions:
  - id: "ensures-1"
    statement: "default help exposes init, next, explain, check, and view as the five primary commands plus the help meta-command"
  - id: "ensures-2"
    statement: "specialist commands remain directly callable but are absent from default help"
  - id: "ensures-3"
    statement: "explicit all-command help lists every specialist command once in stable functional groups"
  - id: "ensures-4"
    statement: "help text is derived from the same command definitions used for parsing and exits successfully without reading or mutating project files or invoking providers"
failure_categories:
  - id: "rejects-1"
    statement: "an unsupported help selector or malformed help request"
  - id: "rejects-2"
    statement: "command metadata cannot describe a registered route consistently"
compatibility:
  policy: backward-compatible-within-major
