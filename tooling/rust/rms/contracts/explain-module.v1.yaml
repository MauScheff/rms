spec: rms/contract/v0.2
name: explain-module
version: 1
kind: command
meaning: Render an intelligible explanation of a target RMS module from canonical
  artifacts, with optional question focus and optional provider-backed response.
semantics:
  behavior:
    observations: []
    requires:
    - id: target-module-readable-or-inferable
      statement: The target module manifest is readable and parseable, either from
        an explicit path or an unambiguous module under the requested root.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: explanation-derived-from-artifacts
      statement: The explanation uses canonical module fields and does not introduce
        new architectural truth.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: provider-explanation-is-recorded
      statement: When provider execution is requested, the rendered prompt and provider
        response are recorded as a workbench run.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: missing-module
      statement: The target module manifest cannot be read or inferred.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ambiguous-module
      statement: More than one module was found and no explicit module was supplied.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: invalid-module-yaml
      statement: The target module manifest cannot be parsed as YAML.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: provider-unavailable
      statement: The requested provider command cannot be started or exits unsuccessfully.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
