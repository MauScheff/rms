spec: rms/contract/v0.2
name: add-rms-capability-tree
version: 1
kind: command
meaning: Scaffold an explicitly requested recursive capability topology with a composite
  parent and semantic child modules, without publishing capabilities on existing standalone
  modules.
semantics:
  behavior:
    observations: []
    requires:
    - id: accepts-1
      statement: A fresh target, stable names, semantic purpose, explicit optional
        child bindings, and an optional explicit runnable surface kind.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: ensures-1
      statement: The complete recursive topology is generated from explicit structured
        design output with canonical composition and no purpose-text inference.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-2
      statement: No existing standalone module is changed and no runnable surface
        is inferred from natural-language words.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-3
      statement: The domain child publishes a command contract and a distinct capability-kind
        contract with stable non-colliding identities; the boundary child requires
        and binds that exact provider capability contract.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: rejects-1
      statement: Existing generated targets, unsupported bindings or surface kinds,
        and incomplete recursive topology inputs.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
