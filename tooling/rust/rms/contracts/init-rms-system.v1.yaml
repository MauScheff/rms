spec: rms/contract/v0.1
name: "init-rms-system"
version: 1
kind: command
meaning: "Initialize a new RMS workspace or safely adopt an existing repository by preserving project-owned content, maintaining explicit RMS-owned guidance sections, and creating only missing bootstrap artifacts."
preconditions:
  - id: "accepts-1"
    statement: "a writable empty target for strict initialization"
  - id: "accepts-2"
    statement: "a writable existing repository when adopt mode is explicit"
  - id: "accepts-3"
    statement: "valid system name, purpose, version, and optional context names"
postconditions:
  - id: "ensures-1"
    statement: "strict initialization refuses every existing managed path before writing"
  - id: "ensures-2"
    statement: "adoption validates existing canonical RMS manifests before writing"
  - id: "ensures-3"
    statement: "adoption preserves an existing glossary byte-for-byte"
  - id: "ensures-4"
    statement: "adoption preserves all project-owned content outside explicit RMS-managed sections"
  - id: "ensures-5"
    statement: "adoption installs or refreshes an idempotent RMS-managed section in existing agent guidance and ignore files"
  - id: "ensures-6"
    statement: "later RMS agent synchronization refreshes only the RMS-managed section in adopted agent guidance"
  - id: "ensures-7"
    statement: "adoption creates only missing RMS bootstrap artifacts"
  - id: "ensures-8"
    statement: "collision preflight completes before any RMS artifact is written"
  - id: "ensures-9"
    statement: "each managed path is reported as created, adopted, or updated and conflicts abort the operation"
  - id: "ensures-10"
    statement: "a target outside an existing Git worktree is initialized as a Git worktree without nesting repositories"
  - id: "ensures-11"
    statement: "completion guidance requires a candidate commit and successful strict audit"
failure_categories:
  - id: "rejects-1"
    statement: "adopt mode encounters an invalid or incompatible existing canonical RMS manifest"
  - id: "rejects-2"
    statement: "an existing RMS-managed skill conflicts with the embedded canonical skill"
  - id: "rejects-3"
    statement: "an existing RMS-managed document section has malformed or duplicate boundary markers"
  - id: "rejects-4"
    statement: "target input is invalid or unwritable"
  - id: "rejects-5"
    statement: "required provenance setup cannot be established"
compatibility:
  policy: backward-compatible-within-major
