spec: rms/contract/v0.1
name: "init-rms-system"
version: 1
kind: command
meaning: "Initialize a fresh RMS workspace or explicitly adopt an existing repository while preserving project-owned content and preparing a provenance baseline that remains pending until an authorized commit."
preconditions:
  - id: "accepts-1"
    statement: "a writable fresh target for strict initialization"
  - id: "accepts-2"
    statement: "a writable existing repository when adopt mode is explicit"
  - id: "accepts-3"
    statement: "valid system name, purpose, version, and optional context names"
postconditions:
  - id: "ensures-1"
    statement: "strict initialization refuses every existing managed path before writing"
  - id: "ensures-2"
    statement: "adoption validates existing canonical RMS manifests and managed sections before writing"
  - id: "ensures-3"
    statement: "adoption preserves project-owned content outside RMS-managed sections and refreshes only managed content"
  - id: "ensures-4"
    statement: "collision preflight completes before any artifact is written and each managed path is reported deterministically"
  - id: "ensures-5"
    statement: "a standalone target becomes a Git worktree while a nested target continues to use its existing parent worktree"
  - id: "ensures-6"
    statement: "successful initialization reports bootstrap prepared; provenance baseline pending authorized commit"
  - id: "ensures-7"
    statement: "generated onboarding orders initialization, authorized bootstrap commit, design, and the recommended scaffold"
  - id: "ensures-8"
    statement: "this command does not itself grant commit authority or claim production readiness"
failure_categories:
  - id: "rejects-1"
    statement: "an existing canonical artifact is invalid or incompatible with safe adoption"
  - id: "rejects-2"
    statement: "an RMS-managed skill or document section conflicts or is malformed"
  - id: "rejects-3"
    statement: "target input is invalid or unwritable"
  - id: "rejects-4"
    statement: "required provenance worktree setup cannot be established"
compatibility:
  policy: backward-compatible-within-major
