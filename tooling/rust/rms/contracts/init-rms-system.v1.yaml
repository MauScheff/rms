spec: rms/contract/v0.1
name: "init-rms-system"
version: 1
kind: command
meaning: "Scaffold a self-contained RMS system directory with canonical manifests, local agent guidance, workbench configuration, and provenance-ready Git setup."
preconditions:
  - id: "accepts-1"
    statement: "a writable target whose generated RMS files do not already exist"
  - id: "accepts-2"
    statement: "valid system name, purpose, version, and optional context names"
postconditions:
  - id: "ensures-1"
    statement: "system, context map, glossary, AGENTS.md, .gitignore, workbench config, and project-local skills are created"
  - id: "ensures-2"
    statement: "a target outside an existing Git worktree is initialized as a Git worktree"
  - id: "ensures-3"
    statement: "a target already inside a Git worktree is not given a nested repository"
  - id: "ensures-4"
    statement: "completion guidance requires committing the candidate and passing strict audit"
failure_categories:
  - id: "rejects-1"
    statement: "existing generated files, invalid input, unwritable targets, and failure to establish required provenance setup"
compatibility:
  policy: backward-compatible-within-major
