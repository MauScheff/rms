spec: rms/contract/v0.2
name: init-rms-system
version: 1
kind: command
meaning: Initialize a complete fresh RMS workspace or progressively adopt an existing
  repository while preserving project-owned content and preparing an authorized provenance
  baseline.
semantics:
  behavior:
    observations: []
    requires:
    - id: accepts-1
      statement: A writable fresh target for strict initialization or a writable existing
        repository when adopt mode is explicit.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: accepts-2
      statement: Valid system name, purpose, version, and optional context names.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: ensures-1
      statement: Collision and compatibility preflight completes before writing; strict
        initialization refuses existing managed paths.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-2
      statement: Adoption validates existing canonical artifacts, preserves project-owned
        content outside managed sections, and creates only missing or safely upgradable
        managed content.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-3
      statement: Fresh initialization records complete workspace coverage and adoption
        records progressive coverage.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-4
      statement: A standalone target becomes a Git worktree while a nested target
        continues to use its existing parent worktree.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-5
      statement: Successful initialization reports bootstrap prepared and provenance
        baseline pending authorized commit; the command does not grant commit authority
        or claim production readiness.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-6
      statement: Generated onboarding orders initialization, authorized bootstrap
        commit, typed design, and exactly the recommended standalone or recursive
        scaffold.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: rejects-1
      statement: Invalid or incompatible canonical artifacts, conflicting or malformed
        managed sections, invalid or unwritable targets, and unavailable provenance
        setup.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
