spec: rms/contract/v0.1
name: "init-rms-system"
version: 1
kind: command
meaning: "Initialize a complete fresh RMS workspace or progressively adopt an existing repository while preserving project-owned content and preparing an authorized provenance baseline."
preconditions:
  - id: "accepts-1"
    statement: "A writable fresh target for strict initialization or a writable existing repository when adopt mode is explicit."
  - id: "accepts-2"
    statement: "Valid system name, purpose, version, and optional context names."
postconditions:
  - id: "ensures-1"
    statement: "Collision and compatibility preflight completes before writing; strict initialization refuses existing managed paths."
  - id: "ensures-2"
    statement: "Adoption validates existing canonical artifacts, preserves project-owned content outside managed sections, and creates only missing or safely upgradable managed content."
  - id: "ensures-3"
    statement: "Fresh initialization records complete workspace coverage and adoption records progressive coverage."
  - id: "ensures-4"
    statement: "A standalone target becomes a Git worktree while a nested target continues to use its existing parent worktree."
  - id: "ensures-5"
    statement: "Successful initialization reports bootstrap prepared and provenance baseline pending authorized commit; the command does not grant commit authority or claim production readiness."
  - id: "ensures-6"
    statement: "Generated onboarding orders initialization, authorized bootstrap commit, typed design, and exactly the recommended standalone or recursive scaffold."
failure_categories:
  - id: "rejects-1"
    statement: "Invalid or incompatible canonical artifacts, conflicting or malformed managed sections, invalid or unwritable targets, and unavailable provenance setup."
compatibility:
  policy: backward-compatible-within-major
