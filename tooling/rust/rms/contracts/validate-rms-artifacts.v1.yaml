spec: rms/contract/v0.1
name: "validate-rms-artifacts"
version: 1
kind: command
meaning: "Validate RMS manifests, public contracts, referenced evidence, and implementation bindings against canonical schemas and semantic production rules."
preconditions:
  - id: "accepts-1"
    statement: "readable RMS roots or explicit manifest paths"
postconditions:
  - id: "ensures-1"
    statement: "diagnostics identify scaffold-generic public contracts and evidence that disclaims committed provenance"
  - id: "ensures-2"
    statement: "all reported findings remain derived from canonical artifacts and deterministic checks"
failure_categories:
  - id: "rejects-1"
    statement: "unparseable artifacts, invalid references, semantic contract scaffolds, unpinned evidence, and binding conformance failures"
compatibility:
  policy: backward-compatible-within-major
