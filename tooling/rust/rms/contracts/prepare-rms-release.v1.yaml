spec: rms/contract/v0.2
name: prepare-rms-release
version: 1
kind: command
meaning: Validate and atomically prepare one RMS release version across canonical
  module, Cargo package, lockfile, plugin, CI template, reference, and changelog metadata
  after validating a current route receipt.
semantics:
  behavior:
    observations: []
    requires:
    - id: accepts-1
      statement: A valid semantic version, repository root, and ready current route
        receipt selecting rms-cli and authorizing semantic mutation.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: accepts-2
      statement: An optional dry-run request.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: ensures-1
      statement: Receipt validation precedes candidate computation in dry-run and
        write modes.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-2
      statement: Every known RMS release metadata location is changed to the same
        version or no files are written.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-3
      statement: The result names the accepted receipt and exact changed paths without
        granting Git authority.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: rejects-1
      statement: Missing, stale, tampered, non-ready, wrong-owner, wrong-action, or
        wrong-target receipts.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: rejects-2
      statement: Invalid versions, unexpected current metadata, partial candidate
        construction, validation failure, and filesystem failure.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
