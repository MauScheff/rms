spec: rms/contract/v0.2
name: plan-machine-change
version: 1
kind: command
meaning: Render or run an advisory RMS prompt that proposes a language-neutral machine-change
  object for an implementation binding.
semantics:
  behavior:
    observations: []
    requires:
    - id: implementation-readable
      statement: The target `implementation.yaml` is readable and parseable.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: task-supplied
      statement: A product or maintenance intent is supplied.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: plan-is-advisory
      statement: The command does not mutate canonical artifacts; provider output
        becomes architecture only after `rms machine apply` validates and writes it.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: output-is-machine-shaped
      statement: The prompt asks for `rms/machine-change/v0.1` with separate binding
        types and semantic cases, classified input categories, canonical transition
        signature, effect protocols, transitions, and roles.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: orchestration-remains-in-transition
      statement: The prompt asks whether an effect outcome changes later decisions
        and requires one request, one typed result, and a follow-up transition when
        it does.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: role-boundary-is-stated
      statement: The prompt states that agents edit declared role bodies and do not
        hand-create semantic architecture by direct file edits.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: provider-run-is-recorded
      statement: When provider execution is requested, the run record contains prompt,
        request metadata, validation snapshot, provider logs, and response.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: invalid-implementation
      statement: The target file is not an RMS implementation binding.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: provider-unavailable
      statement: The requested provider cannot be started or exits unsuccessfully.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
