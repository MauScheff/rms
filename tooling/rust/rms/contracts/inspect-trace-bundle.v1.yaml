spec: rms/contract/v0.1
name: "inspect-trace-bundle"
version: 1
kind: command
meaning: "Check replay and diagnose local RMS transition records including conformance to canonical machine cases when an owning implementation is discoverable."
preconditions:
  - id: "accepts-1"
    statement: "a readable RMS JSON or YAML trace bundle"
  - id: "accepts-2"
    statement: "optional discoverable owning implementation with canonical transition declarations"
postconditions:
  - id: "ensures-1"
    statement: "local replay reconstructs state input outputs and source provenance without requiring an RMS runtime"
  - id: "ensures-2"
    statement: "records match canonical case input state movement events effects reply and rejection when canonical semantics are available"
  - id: "ensures-3"
    statement: "diagnosis identifies the first structurally or semantically bad transition"
failure_categories:
  - id: "rejects-1"
    statement: "unreadable or invalid trace syntax"
  - id: "rejects-2"
    statement: "state discontinuity or output-state mismatch"
  - id: "rejects-3"
    statement: "trace output that contradicts its named canonical transition case"
compatibility:
  policy: backward-compatible-within-major
