spec: rms/contract/v0.2
name: diagnose-rms-environment
version: 1
kind: command
meaning: Report deterministic RMS readiness from observable repository shape, canonical
  validation, workbench configuration, run records, native tools, providers, guidance
  state, and detected skill sources without claiming runtime activation.
semantics:
  behavior:
    observations: []
    requires:
    - id: accepts-1
      statement: a readable repository or workspace root
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: accepts-2
      statement: optional machine-readable output selection
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: ensures-1
      statement: repository shape uses the same classification model as recommend-next-rms-work
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-2
      statement: root-level system and context artifacts are reported as not-applicable
        for shapes that do not own them while partial canonical roots remain missing
        or invalid
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-3
      statement: skill reporting distinguishes detected sources from runtime-active
        skills
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-4
      statement: detected skill summaries use deterministic ordering and host-defined
        precedence with unknown runtime activation
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-5
      statement: machine-readable and text output derive from the same observations
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-6
      statement: diagnostic evidence does not mutate or redefine canonical RMS semantics
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: rejects-1
      statement: the requested root cannot be traversed for repository evidence
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: rejects-2
      statement: report construction cannot represent an unreadable canonical artifact
        truthfully
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
