spec: rms/contract/v0.1
name: "diagnose-rms-environment"
version: 1
kind: command
meaning: "Report deterministic RMS readiness from observable repository shape, canonical validation, workbench configuration, run records, native tools, providers, guidance state, and detected skill sources without claiming runtime activation."
preconditions:
  - id: "accepts-1"
    statement: "a readable repository or workspace root"
  - id: "accepts-2"
    statement: "optional machine-readable output selection"
postconditions:
  - id: "ensures-1"
    statement: "repository shape uses the same classification model as recommend-next-rms-work"
  - id: "ensures-2"
    statement: "root-level system and context artifacts are reported as not-applicable for shapes that do not own them while partial canonical roots remain missing or invalid"
  - id: "ensures-3"
    statement: "skill reporting distinguishes detected sources from runtime-active skills"
  - id: "ensures-4"
    statement: "detected skill summaries use deterministic ordering and host-defined precedence with unknown runtime activation"
  - id: "ensures-5"
    statement: "machine-readable and text output derive from the same observations"
  - id: "ensures-6"
    statement: "diagnostic evidence does not mutate or redefine canonical RMS semantics"
failure_categories:
  - id: "rejects-1"
    statement: "the requested root cannot be traversed for repository evidence"
  - id: "rejects-2"
    statement: "report construction cannot represent an unreadable canonical artifact truthfully"
compatibility:
  policy: backward-compatible-within-major
