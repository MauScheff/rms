spec: rms/contract/v0.1
name: "compose-rms-system"
version: 1
kind: command
meaning: "Resolve RMS dependencies, contracts, recursive exports, and explicit composite proof delegations."
preconditions:
  - id: "accepts-1"
    statement: "a root containing canonical RMS module and composition artifacts"
postconditions:
  - id: "ensures-1"
    statement: "dependencies and contracts resolve to compatible providers"
  - id: "ensures-2"
    statement: "recursive exports are backed by contained modules"
  - id: "ensures-3"
    statement: "each proof delegation resolves its parent law, child law and property, export, and concrete evidence"
failure_categories:
  - id: "rejects-1"
    statement: "unresolved providers or incompatible contracts"
  - id: "rejects-2"
    statement: "broken containment or export ownership"
  - id: "rejects-3"
    statement: "incomplete or false composite proof delegation"
compatibility:
  policy: backward-compatible-within-major
