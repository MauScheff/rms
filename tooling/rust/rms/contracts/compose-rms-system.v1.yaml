spec: rms/contract/v0.1
name: "compose-rms-system"
version: 1
kind: command
meaning: "Resolve RMS dependencies, contracts, recursive exports, protocol participants, routed messages, artifact transformations, and explicit composite proof delegations."
preconditions:
  - id: "accepts-1"
    statement: "A root containing canonical RMS modules, contracts, implementations, protocol bindings, artifacts, and composition artifacts."
postconditions:
  - id: "ensures-1"
    statement: "Required capabilities and contracts resolve to compatible providers."
  - id: "ensures-2"
    statement: "Every cross-module message route has compatible participants, direction, cases, and protocol ordering."
  - id: "ensures-3"
    statement: "Transformation outputs satisfy the next stage artifact contract."
  - id: "ensures-4"
    statement: "Recursive exports and proof delegations resolve to their declared owners and evidence."
failure_categories:
  - id: "rejects-1"
    statement: "Unresolved providers, incompatible contracts or artifacts, unmatched messages, ambiguous routes, illegal protocol order, or broken proof delegation."
compatibility:
  policy: backward-compatible-within-major
