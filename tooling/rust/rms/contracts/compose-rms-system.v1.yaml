spec: rms/contract/v0.2
name: compose-rms-system
version: 1
kind: command
meaning: Resolve RMS dependencies, contracts, recursive exports, protocol participants,
  routed messages, artifact transformations, and explicit composite proof delegations.
semantics:
  behavior:
    observations: []
    requires:
    - id: accepts-1
      statement: A root containing canonical RMS modules, contracts, implementations,
        protocol bindings, artifacts, and composition artifacts.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: ensures-1
      statement: Required capabilities and contracts resolve to compatible providers.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-2
      statement: Every cross-module message route has compatible participants, direction,
        cases, and protocol ordering.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-3
      statement: Transformation outputs satisfy the next stage artifact contract.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: ensures-4
      statement: Recursive exports and proof delegations resolve to their declared
        owners and evidence.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: rejects-1
      statement: Unresolved providers, incompatible contracts or artifacts, unmatched
        messages, ambiguous routes, illegal protocol order, or broken proof delegation.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
