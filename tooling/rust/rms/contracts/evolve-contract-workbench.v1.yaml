spec: rms/contract/v0.2
name: evolve-contract-workbench
version: 1
kind: command
meaning: Render an advisory RMS contract-evolution prompt for a requested public contract
  or operational semantics change.
semantics:
  behavior:
    observations: []
    requires:
    - id: task-supplied
      statement: The requested contract evolution is supplied as task text.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: target-module-readable
      statement: The target module manifest is readable and parseable.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    guarantees:
    - id: compatibility-is-classified
      statement: The prompt asks the reviewer or agent to classify compatibility across
        shape, meaning, failures, authorization, idempotency, ordering, consistency,
        timeout, retry, stored state, and operations.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: versioning-decision-is-explicit
      statement: The prompt asks whether the existing contract version can be preserved
        or a new version is required.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: migration-is-addressed
      statement: The prompt asks for migration, coexistence, translation, deprecation,
        and provider or consumer evidence updates.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: evolution-is-advisory
      statement: The command renders or executes guidance and does not itself edit
        source files.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    failures:
    - id: missing-task
      statement: No contract evolution task was supplied.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    - id: provider-unavailable
      statement: The requested provider command cannot be started or exits unsuccessfully.
      evaluation:
        kind: external
        property: rms-behavioral-contract-conformance-corpus
    cases: []
    invariants: []
    case_policy:
      coverage: exhaustive
      overlap: forbidden
compatibility:
  policy: backward-compatible-within-major
