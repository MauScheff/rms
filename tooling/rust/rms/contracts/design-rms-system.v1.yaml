spec: rms/contract/v0.1
name: "design-rms-system"
version: 1
kind: command
meaning: "Render an advisory RMS system design prompt that proposes module boundaries, semantic scaffold shapes, implementation binding choices, representation obligations, effects, dependencies, and verification evidence before implementation scope is fixed."
preconditions:
  - id: "accepts-1"
    statement: "a supplied system or repository design task"
  - id: "accepts-2"
    statement: "a readable project root for existing RMS context"
postconditions:
  - id: "ensures-1"
    statement: "the prompt recommends the smallest honest module set and deterministic add-module or add-capability command shape"
  - id: "ensures-2"
    statement: "when implementation is intended, the prompt requires explicit supported binding choices on add-capability or a later rms add-binding step"
  - id: "ensures-3"
    statement: "semantic-only scaffolding is presented as intentional rather than an accidental default for a runnable product"
  - id: "ensures-4"
    statement: "the prompt asks for language-agnostic semantic shapes, explicit representations, edge cases, effects, recovery, and evidence before code"
  - id: "ensures-5"
    statement: "provider-backed design remains opt-in and recorded as advisory evidence"
failure_categories:
  - id: "rejects-1"
    statement: "the design task is missing"
  - id: "rejects-2"
    statement: "the project root cannot be inspected"
  - id: "rejects-3"
    statement: "an explicitly requested provider cannot run successfully"
compatibility:
  policy: backward-compatible-within-major
