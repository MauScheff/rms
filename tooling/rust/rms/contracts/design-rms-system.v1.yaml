spec: rms/contract/v0.1
name: "design-rms-system"
version: 1
kind: command
meaning: "Render an advisory RMS system design prompt that proposes modules, machines, artifacts, protocols, resources, authority boundaries, effects, temporal laws, and evidence before implementation scope is fixed."
preconditions:
  - id: "accepts-1"
    statement: "Product intent and a readable RMS project root."
postconditions:
  - id: "ensures-1"
    statement: "The prompt asks what values and artifacts are valid, what messages cross boundaries, what resources are owned, what authority is elevated, and what must always or eventually hold."
  - id: "ensures-2"
    statement: "Recommendations remain language-neutral and become authoritative only through RMS apply commands."
failure_categories:
  - id: "rejects-1"
    statement: "Missing task intent or unreadable project context."
compatibility:
  policy: backward-compatible-within-major
