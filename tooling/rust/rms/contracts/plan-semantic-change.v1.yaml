spec: rms/contract/v0.1
name: "plan-semantic-change"
version: 1
kind: command
meaning: "Render or run a self-contained advisory prompt for a language-neutral RMS semantic-change object, including ownership-aware provided and required contract operations."
preconditions:
  - id: "accepts-1"
    statement: "A readable module.yaml or implementation.yaml target."
  - id: "accepts-2"
    statement: "Product or maintenance intent describing the requested semantic change."
postconditions:
  - id: "ensures-1"
    statement: "The prompt enumerates allowed invariant authorities and exact scalar, list, mapping, and operation cardinalities."
  - id: "ensures-2"
    statement: "Contract add, set, and remove entries explain direction provided versus required and unambiguous inference."
  - id: "ensures-3"
    statement: "The prompt tells agents to revise consumer capability contracts without publishing provider commands."
  - id: "ensures-4"
    statement: "The prompt requires distinct evidence obligations and keeps provider output advisory until apply succeeds."
failure_categories:
  - id: "rejects-1"
    statement: "The target is unreadable or unsupported."
  - id: "rejects-2"
    statement: "Task intent is missing."
compatibility:
  policy: backward-compatible-within-major
