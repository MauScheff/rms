spec: rms/contract/v0.1
name: "plan-semantic-change"
version: 1
kind: command
meaning: "Render or run a self-contained advisory prompt for a language-neutral RMS semantic-change object."
preconditions:
  - id: "accepts-1"
    statement: "a readable module.yaml or implementation.yaml target"
  - id: "accepts-2"
    statement: "product or maintenance intent describing the requested semantic change"
postconditions:
  - id: "ensures-1"
    statement: "the prompt enumerates allowed invariant authorities and explains how enforced_by binds to semantic functions"
  - id: "ensures-2"
    statement: "the prompt shows exact scalar, list, mapping, and operation cardinalities for contracts, properties, semantic functions, evidence, effect protocols, transitions, roles, and surfaces"
  - id: "ensures-3"
    statement: "the prompt requires a distinct evidence obligation for every changed law and contract"
  - id: "ensures-4"
    statement: "the prompt shows set, add, and remove for every supported semantic category, including semantic-function bindings, and exact structured removal shapes"
  - id: "ensures-5"
    statement: "semantic-function items name exact binding symbols, allowed kinds and purity, discharged promises, assumptions, and categorized evidence"
  - id: "ensures-6"
    statement: "incremental surface templates use a null replacement so unrelated semantic changes preserve existing runnable surfaces"
  - id: "ensures-7"
    statement: "targets without implementation bindings render semantic-function, machine, role, and surface sections as null and direct agents to attach a binding before requesting those changes"
  - id: "ensures-8"
    statement: "the prompt tells agents to rely only on the current project, prompt, and RMS diagnostics"
failure_categories:
  - id: "rejects-1"
    statement: "the target is unreadable or unsupported"
  - id: "rejects-2"
    statement: "task intent is missing"
compatibility:
  policy: backward-compatible-within-major
