    contract: contracts/inspect-module.v1.yaml
  events: []
  capabilities: []
requires:
  modules: []
  capabilities:
  - name: filesystem
  - name: process-runner
  - name: git-revision-provider
invariants:
- id: canonical-artifacts-remain-authoritative
  statement: The CLI may inspect, explain, package, and validate RMS artifacts, but it must not create module semantics outside canonical manifests and contracts.
  authority: parser
  enforced_by: validate-rms-artifacts-command
  verified_by: verification/laws/canonical_artifacts_remain_authoritative.md
- id: diagnostics-are-evidence-not-authority
  statement: Diagnostic, context, package, and conformance outputs must identify their source artifacts and remain derived evidence rather than hidden architectural truth.
  authority: parser
  enforced_by: diagnose-rms-environment-command
  verified_by: verification/laws/diagnostics_are_evidence_not_authority.md
- id: composite-evidence-lanes-are-concrete
  statement: Composite capability-tree scaffolds declare only concrete evidence lanes for production claims.
  kind: invariant
  authority: effect-executor
  enforced_by: add-rms-capability-tree-command
- id: effect-results-are-canonical-machine-inputs
  statement: Machine-shaped modules that represent effect-result types or envelopes declare semantic effect results and consume them through transitions.
  authority: parser
  enforced_by: inspect-implementation-structure-command
  verified_by: verification/laws/effect_results_are_canonical_machine_inputs.md
- id: boundary-lifecycle-is-trace-evidenced
  statement: Boundary-machine states used for parse, delegation, completion, and rejection are evidenced by replayable transition traces.
  authority: parser
  enforced_by: audit-rms-project-command
  verified_by: verification/laws/boundary_lifecycle_is_trace_evidenced.md
- id: source-drift-has-semantic-record
  statement: Source behavior changes require a committed semantic-change record before strict production audit can pass.
  authority: parser
  enforced_by: audit-rms-project-command
  verified_by: verification/laws/source_drift_has_semantic_record.md
- id: semantic-revisions-are-applied-canonically
  statement: Semantic and machine revisions that correct scaffold drift must use canonical set, remove, supersedes, launch entrypoint, and active-record rules instead of hand-edited manifest surgery.
  authority: effect-executor
  enforced_by: semantic-change-apply-command
  verified_by: verification/laws/semantic_revisions_are_applied_canonically.md
- id: runnable-surfaces-enter-through-boundaries
  statement: Runnable surfaces adapt outside input into declared RMS commands and must not reimplement domain decisions or call private module internals.
  authority: parser
  enforced_by: check-runnable-surface-command
  verified_by: verification/contracts/check_runnable_surface.md
- id: runnable-launch-assets-route-through-boundaries
  statement: Launch assets reachable from a runnable surface must route through the declared RMS entrypoint or adapter and must not duplicate parser or domain decision logic outside declared roles.
  authority: parser
  enforced_by: check-runnable-surface-command
  verified_by: verification/laws/runnable_launch_assets_route_through_boundaries.md
- id: bindings-realize-canonical-semantics
  statement: Binding adapters realize canonical module shape, machine roles, runnable surfaces, evidence obligations, public contracts, and dependency links; bindings must not invent semantic roles outside canonical declarations.
  authority: effect-executor
  enforced_by: add-rms-module-command
  verified_by: verification/laws/bindings_realize_canonical_semantics.md
- id: no-effect-scaffolds-have-no-effect-residue
  statement: Scaffolds and source roles for modules with no canonical effects or effect results must not expose effect, effect envelope, effect lifecycle, effect result, or effect-result envelope semantic types.
  authority: parser
  enforced_by: inspect-implementation-structure-command
  verified_by: verification/laws/no_effect_scaffolds_have_no_effect_residue.md
- id: bootstrap-provenance-is-visible
  statement: RMS init, diagnose, and gate surfaces must make the git source revision requirement visible before strict audit is treated as production evidence.
  authority: parser
  enforced_by: diagnose-rms-environment-command
  verified_by: verification/laws/bootstrap_provenance_is_visible.md
- id: reusable-module-consumers-use-public-facade
  statement: Reusable modules declare capabilities and consumers use the RMS public facade instead of private role files.
  kind: invariant
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: rms-package-carries-declared-implementation-surface
  statement: RMS packages include declared implementation facade and role artifacts needed to verify reuse.
  kind: invariant
  authority: effect-executor
  enforced_by: package-module-command
- id: semantic-properties-are-canonical-reliability-evidence
  statement: RMS properties define generated input spaces and oracles semantically; language bindings only realize those properties and counterexamples remain replayable evidence.
  kind: invariant
  authority: parser
  enforced_by: semantic-property-check-command
- id: semantic-variants-are-distinct-from-binding-types
  statement: Machine semantic lists contain domain alternatives while implementation type mappings contain binding-native container names.
  kind: invariant
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: stateful-machines-consume-state-and-classified-input
  statement: Every stateful machine transition consumes current state plus a command, observed event, or effect result through one canonical transition path.
  kind: invariant
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: effect-executors-do-not-own-orchestration
  statement: Effect executors perform declared effect requests and return declared results while transition functions own sequencing, retry, compensation, and progress policy.
  kind: invariant
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: strict-audit-observes-all-production-files
  statement: Strict production audit includes every tracked, modified, and untracked production artifact in provenance and semantic-drift checks.
  kind: invariant
  authority: parser
  enforced_by: audit-rms-project-command
- id: fuzz-realization-matches-semantic-claim
  statement: Open-ended fuzz claims use generated or coverage-guided realization while deterministic corpora are reported only as corpus evidence.
  kind: invariant
  authority: parser
  enforced_by: semantic-property-check-command
- id: production-contracts-are-semantically-specific
  statement: An implemented production module cannot satisfy validation with scaffold-generic contract meaning, assumptions, outcomes, or failure categories.
  kind: invariant
  authority: parser
  enforced_by: validate_contract
- id: release-evidence-does-not-disclaim-provenance
  statement: Evidence used by a production claim must not describe its source as an uncommitted workspace, current filesystem snapshot, or repository without a Git revision.
  kind: invariant
  authority: parser
  enforced_by: check_evidence_source_quality
- id: semantic-contract-revisions-are-cli-applied
  statement: Provided contracts and required capability contracts are revised or removed through RMS spec apply without transferring ownership, deleting still-referenced artifacts, or requiring direct manifest edits.
  kind: invariant
  authority: effect-executor
  enforced_by: semantic-change-apply-command
- id: canonical-semantics-match-cli-applied-revision
  statement: Production canonical semantics must match the latest RMS-applied semantic revision; direct manifest surgery cannot satisfy strict audit.
  kind: safety
  authority: effect-executor
  enforced_by: semantic-change-apply-command
- id: transition-cases-are-declared-and-replayed
  statement: Every state and input branch that changes destination or outputs is declared as a named transition case and covered by replay evidence.
  kind: traceability
  authority: parser
  enforced_by: audit-rms-project-command
- id: public-domain-values-preserve-validity
  statement: Public domain values with validity rules cannot bypass validated construction through exposed mutable fields or an unrestricted allowlist.
  kind: safety
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: risk-bearing-laws-have-semantic-properties
  statement: Ordering, safety, bounded, normalization, parser, and numeric laws are linked to semantic properties with input spaces and oracles.
  kind: reliability
  authority: parser
  enforced_by: semantic-property-check-command
- id: runnable-delegation-has-semantic-owner
  statement: Every runnable surface delegates to a declared role or symbol and declares its boundary effects or an explicit no-effect justification.
  kind: boundary
  authority: parser
  enforced_by: check-runnable-surface-command
- id: gate-pass-has-no-known-production-blockers
  statement: The RMS gate must not report pass while strict structural preflight has a blocker or the project has no source revision.
  kind: safety
  authority: effect-executor
  enforced_by: gate-rms-change-command
- id: binding-transition-signature-realizes-canonical-types
  statement: An inspectable binding's canonical transition accepts the declared State and Input types and returns the declared Transition or TransitionRecord type.
  kind: safety
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: bootstrap-creates-provenance-worktree
  statement: Initializing an RMS system outside an existing Git worktree creates a local Git worktree so provenance can be committed and audited without separate setup.
  kind: reliability
  authority: effect-executor
  enforced_by: init-rms-system-command
- id: semantic-plan-schema-is-self-contained
  statement: RMS semantic and machine planning prompts enumerate canonical values, exact field cardinalities, evidence linkage, effect-protocol fields, and set, add, and remove shapes needed to replace scaffold semantics without external examples.
  kind: reliability
  authority: parser
  enforced_by: semantic-change-plan-command
- id: semantic-only-modules-have-canonical-binding-attachment
  statement: A semantic-only RMS module can gain one supported implementation binding through a canonical RMS command without copying scaffold files or changing its declared semantics.
  kind: reliability
  authority: effect-executor
  enforced_by: add-rms-binding-command
- id: empty-semantic-change-sections-are-inert
  statement: Empty machine, role, and runnable-surface operation sections do not request architecture changes or require an implementation binding.
  kind: reliability
  authority: parser
  enforced_by: semantic-change-noop-classifier
- id: effect-protocols-bind-exact-executors
  statement: Every declared effect protocol names one exact executor symbol whose binding accepts the declared effect request and returns a declared effect result without owning orchestration.
  kind: reliability
  authority: composition
  enforced_by: effect-protocol-binding-check
- id: runnable-effects-are-transition-driven
  statement: An effectful runnable surface routes repeated transition, effect execution, effect-result feedback, progress policy, and complete transition-record capture through its exact machine driver even when public and machine command names differ.
  kind: invariant
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: binding-dependencies-are-adapter-realized
  statement: RMS binding adapters realize declared local implementation dependencies idiomatically and normalize equivalent binding-native package and import names.
  kind: invariant
  authority: effect-executor
  enforced_by: add-rms-capability-tree-command
- id: reusable-package-proof-is-cli-recorded
  statement: Successful RMS package construction and verification records a concrete reusable-package result in the owning module evidence.
  kind: invariant
  authority: effect-executor
  enforced_by: package-module-command
- id: effect-executors-are-semantic-functions
  statement: Declared effect protocol executor symbols are represented as effect-executor semantic functions with effectful purity.
  kind: invariant
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: reusable-intent-is-explicit
  statement: Reusable capability and package-proof obligations apply only when a module explicitly declares reusable intent; incidental prose and semantic-change history do not create reuse semantics.
  kind: invariant
  authority: parser
  enforced_by: validate-rms-artifacts-command
- id: transition-cases-are-code-backed
  statement: Every canonical transition case and replay source branch is represented by a declared transition role, and every lifecycle state is reachable from the machine initial state.
  kind: invariant
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: generated-package-output-is-derived
  statement: Generated package and build outputs remain derived artifacts and are excluded from live RMS project semantic discovery.
  kind: invariant
  authority: composition
  enforced_by: validate-rms-artifacts-command
- id: semantic-revision-history-is-sealed
  statement: Every RMS-applied semantic revision records the digest of its exact immutable change record, and later semantic revisions retain prior records through valid supersession references.
  kind: invariant
  authority: parser
  enforced_by: audit-rms-project-command
- id: declared-message-envelopes-are-binding-realized
  statement: Every declared command, event, effect, and effect-result envelope has a binding-native representation and traceable effect paths retain the declared envelope semantics.
  kind: invariant
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: transition-arithmetic-is-total
  statement: Arithmetic over represented machine inputs is checked or bounded so every input produces a transition or explicit rejection instead of a trap, panic, or overflow.
  kind: invariant
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: property-evidence-obligation-is-not-proof
  statement: Generated property evidence remains an obligation until it names the exact executed command and observed result; untouched instructional prose cannot satisfy production audit.
  kind: evidence-integrity
  authority: parser
  enforced_by: semantic-property-check-command
- id: non-corpus-property-realization-is-code-backed
  statement: Every property realization names an exact binding runner; generated and exhaustive realizations also name a generator, and the runner executes the operation and oracle.
  kind: binding-conformance
  authority: parser
  enforced_by: semantic-property-check-command
- id: semantic-function-bindings-are-cli-applied
  statement: Implementation semantic-function bindings are added, replaced, or removed only through validated RMS semantic changes so authority, symbol, and evidence ownership remain sealed with canonical semantics.
  kind: invariant
  authority: effect-executor
  enforced_by: semantic-change-apply-command
- id: effect-executor-analysis-respects-protocol-atomicity
  statement: Control-flow diagnostics apply to the exact executor of each one-request-one-result protocol and do not reject declared aggregate executors merely because another protocol is atomic.
  kind: safety
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: composite-laws-may-delegate-proof-through-exports
  statement: A composite may discharge an exported law through a named child law and property only when the provider, public export, and concrete evidence resolve.
  kind: invariant
  authority: composition
  enforced_by: compose-rms-system-command
- id: shared-effect-support-cannot-own-workflow
  statement: Shared effect-support roles may implement reusable IO mechanism policy but cannot own machine state progression, transition outputs, retries, compensation, or runnable public behavior.
  kind: ordering
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: runnable-surfaces-have-usage-and-smoke-proof
  statement: Every runnable surface names a concrete usage document and a declared smoke command that RMS verification executes.
  kind: invariant
  authority: parser
  enforced_by: check-runnable-surface-command
- id: trace-records-conform-to-canonical-transitions
  statement: Trace evidence matches the canonical transition case input, state movement, emitted events, effects, reply, and rejection rather than merely naming the case.
  kind: evidence-integrity
  authority: parser
  enforced_by: trace-bundle-check-command
- id: expected-rejections-remain-typed
  statement: A machine with declared rejection variants carries an explicit rejection channel in its transition output and does not encode rejection only in source-branch strings or unrelated replies.
  kind: invariant
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: effectful-boundaries-use-explicit-protocols
  statement: Inspectable boundary IO is represented by declared effects, typed effect results, atomic effect protocols, and effect executors instead of being hidden inside runnable adapters.
  kind: invariant
  authority: parser
  enforced_by: inspect-implementation-structure-command
- id: generated-property-claims-use-generators
  statement: A generated-property realization executes a case generator or property engine; a fixed literal collection is classified as a deterministic corpus.
  kind: evidence-integrity
  authority: parser
  enforced_by: semantic-property-check-command
- id: runnable-surfaces-execute-declared-machines
  statement: A runnable surface for a machine-shaped module reaches the declared transition or machine driver on its live execution path rather than leaving the declared machine as evidence-only code.
  kind: invariant
  authority: parser
  enforced_by: check-runnable-surface-command
- id: module-protocols-compose-by-contract
  statement: Cross-module commands, events, replies, and rejections are bound to explicit contract participants and compose only when every routed message has a compatible sender, receiver, direction, and legal protocol order.
  kind: composition-safety
  authority: composition
  enforced_by: compose-protocol-contracts
- id: resource-lifecycles-close-on-terminal-paths
  statement: Every acquired semantic resource is used only while held and reaches a declared released or transferred disposition on every terminal machine path.
  kind: lifecycle-safety
  authority: parser
  enforced_by: validate-resource-protocols
- id: artifact-transformations-preserve-declared-contracts
  statement: Stateless transformations consume and produce explicitly versioned artifacts whose invariants and compatibility contracts compose between stages.
  kind: composition-safety
  authority: composition
  enforced_by: compose-artifact-contracts
- id: privileged-authority-is-explicit-and-contained
  statement: Privileged, unsafe, foreign, or otherwise elevated operations occur only in declared authority roles behind a declared safe facade and concrete evidence.
  kind: safety
  authority: parser
  enforced_by: inspect-authority-containment
- id: temporal-properties-have-matching-realizations
  statement: Trace and bounded-resource claims use structured temporal patterns and a proof realization capable of evaluating the declared scope and bound.
  kind: evidence-integrity
  authority: parser
  enforced_by: validate-temporal-properties
- id: system-traces-preserve-message-causation
  statement: Cross-module trace stitching preserves correlation, causation, participant direction, protocol order, and each owning machine transition so diagnosis identifies the first invalid handoff or transition.
  kind: traceability
  authority: parser
  enforced_by: stitch-system-traces
- id: trace-evidence-is-execution-derived
  statement: Every production trace bundle is regenerated by a declared producer that calls the real transition-record path, and canonical comparison rejects hand-authored, stale, or reconstructed evidence.
  kind: evidence-integrity
  authority: effect-executor
  enforced_by: run-trace-producers-command
- id: property-realizations-execute-exact-runners
  statement: Every property realization independently executes its declared runner, generator when required, semantic operation, and oracle under the requested proof profile.
  kind: evidence-integrity
  authority: effect-executor
  enforced_by: run-semantic-properties-command
- id: strict-audit-regenerates-smoke-proofs
  statement: Strict production audit regenerates deterministic smoke trace, property, and reusable-package proofs from committed code and rejects proof commands that mutate production files.
  kind: evidence-integrity
  authority: effect-executor
  enforced_by: strict-audit-proof-executor
- id: reusable-package-proof-is-current
  statement: Strict production audit rebuilds every reusable module package and rejects an existing package whose canonical payload differs from the regenerated package.
  kind: evidence-integrity
  authority: effect-executor
  enforced_by: strict-audit-proof-executor
- id: active-evidence-references-current-semantics
  statement: Active production evidence may reference only semantic variants present in the current canonical model.
  kind: evidence-integrity
  authority: parser
  enforced_by: active-evidence-reference-validator
- id: semantic-apply-validates-final-candidate
  statement: Semantic, machine, and surface apply use the same language-neutral identifier grammar as schema validation and validate one computed final canonical candidate before dry-run reporting or writes, including repairs of invalid current state.
  kind: consistency
  authority: parser
  enforced_by: semantic-change-final-candidate-validator
- id: system-viewer-is-derived-and-read-only
  statement: The local semantic viewer derives every visible node, edge, trace, gap, status, and source reference from canonical RMS artifacts and exposes no route that mutates project files or semantic authority.
  kind: boundary-integrity
  authority: parser
  enforced_by: parse-rms-view-request
- id: semantic-system-graph-is-cross-layer-and-source-backed
  statement: Every semantic system graph includes applicable outer module declarations, inner implementation machines and roles, contracts, executable proof declarations, and exact source provenance without treating a derived projection as authority.
  kind: projection-integrity
  authority: parser
  enforced_by: view-rms-system-command
- id: semantic-gap-applicability-matches-module-shape
  statement: Semantic completeness findings are required only when the module shape, profiles, machine mode, or declared behavior creates the corresponding obligation; non-applicable boundary, lifecycle, effect, event, or proof stages are never reported as missing.
  kind: projection-integrity
  authority: parser
  enforced_by: view-rms-system-command
- id: public-behavior-bindings-close-contract-to-machine-path
  statement: Every implemented public command and required capability resolves through an exact implementation entrypoint or port to declared machine inputs and typed outcomes, with every reported edge carrying canonical source provenance.
  kind: semantic-closure
  authority: parser
  enforced_by: view-rms-system-command
- id: structured-intent-precedes-architecture
  statement: Architecture and ownership decisions consume a validated language-neutral intent model and never derive authority from raw natural-language token matching.
  kind: invariant
  authority: parser
  enforced_by: design-rms-system-command
- id: semantic-capability-publication-is-topology-independent
  statement: A module may publish or require a capability contract through semantic apply without creating, deleting, or changing module topology.
  kind: invariant
  authority: effect-executor
  enforced_by: semantic-change-apply-command
- id: progressive-adoption-proofs-are-scoped
  statement: Production checks state whether they certify a complete repository or a progressive RMS module closure and never imply broader coverage.
  kind: invariant
  authority: composition
  enforced_by: check-rms-project-command
