  - name: recommend-next-rms-work
    contract: contracts/recommend-next-rms-work.v2.yaml
  - name: release-check
    contract: contracts/release-check.v1.yaml
  - name: check-rms-project
    contract: contracts/check-rms-project.v1.yaml
  - name: describe-rms-command-surface
    contract: contracts/describe-rms-command-surface.v1.yaml
  - name: add-rms-capability-tree
    contract: contracts/add-rms-capability-tree.v1.yaml
  - name: manage-rms-adoption
    contract: contracts/manage-rms-adoption.v1.yaml
  queries:
