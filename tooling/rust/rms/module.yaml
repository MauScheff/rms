  - module-explanation-shape
  - diagnostic-readiness-result
  - prompt-template-selection
  - semantic-scaffold-shape-selection
  - capability-tree-scaffold-selection
  - design-boundary-recommendation
  - composition-result
  - recursive-work-route-recommendation
  - advisory-workflow-shape
  - intent-capture-gate-result
  - git-diff-impact-classification
  - gate-check-selection
  - provider-execution-request
  - workbench-config-resolution
  - workbench-config-initialization
  - release-readiness-result
  - production-readiness-audit-result
  - module-atlas-shape
  - implementation-inner-structure-result
  - local-trace-diagnostic-result
  - runnable-surface-declaration-result
  - runnable-surface-wiring-result
  - package-inclusion-set
  - conformance-outcome
