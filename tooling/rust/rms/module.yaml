  - verification/laws/no_effect_scaffolds_have_no_effect_residue.md
  - verification/laws/bootstrap_provenance_is_visible.md
  - verification/laws/reusable_module_facade.md
  - verification/laws/package_declared_surface.md
  contracts:
  - verification/contracts
  - verification/contracts/add_rms_capability.md
  - verification/contracts/apply_runnable_surface.md
  - verification/contracts/check_runnable_surface.md
  - verification/contracts/add_rms_module.md
  - verification/contracts/diagnose_rms_environment.md
  - verification/contracts/gate_rms_change.md
  - verification/contracts/inspect_implementation_structure.md
  - verification/contracts/audit_rms_project.md
  - verification/contracts/check_semantic_properties.md
  - verification/contracts/run_semantic_properties.md
  - verification/contracts/replay_property_counterexample.md
  scenarios:
  - verification/scenarios
  - verification/scenarios/reusable_module_package.md
  boundaries:
  - verification/boundaries
  properties:
  - verification/properties/semantic_properties.md
  fuzz:
  - verification/fuzz/malformed_artifacts.md
x-rms:
  last_semantic_intent: RMS command and artifact parsing has fuzz-style semantic evidence for malformed inputs.
properties:
- id: semantic-property-declarations-have-oracles
  proves: semantic-properties-are-canonical-reliability-evidence
  kind: invariant
  subject: semantic-property-model
  input_space:
    semantic_changes: rms/semantic-change/v0.1 objects with properties.add entries
    implementation_bindings: implementation.yaml files with architecture.reliability properties or fuzz_targets
  oracle:
  - every property names what it proves
  - every property declares an input space
  - every property declares at least one oracle
  - property and fuzz targets reference concrete evidence
  - counterexamples carry replay metadata
  evidence:
    path: verification/properties/semantic_properties.md
  counterexamples:
    path: verification/fuzz/counterexamples
fuzz_targets:
- id: rms-cli-malformed-artifacts-produce-diagnostics
  proves: canonical-artifacts-remain-authoritative
  kind: fuzz
  subject: rms-cli-command-and-artifact-boundary
  input_space:
    cli_args: generated malformed or incomplete command arguments
    manifests: generated malformed RMS YAML and schema-violating artifacts
  operation: parse-and-validate-rms-input
  oracle:
  - malformed input produces diagnostics or explicit command errors
  - rejected input does not create semantic authority outside RMS canonical apply paths
  - diagnostics remain derived evidence rather than hidden architecture
  evidence:
    path: verification/fuzz/malformed_artifacts.md
  counterexamples:
    path: verification/fuzz/counterexamples
