spec: rms/module/v0.1
module:
  name: rms-cli
  version: 0.1.0-rc.4
  kind: tool
  purpose: Provide the canonical command-line workbench for inspecting, validating, packaging, explaining, structuring, and verifying RMS modules.
profiles:
- core
- boundary
owns:
  concepts:
  - RMS command surface
  - RMS diagnostic report
  - RMS module explanation
  - RMS context packet
  - RMS conformance report
  - RMS module package
  - RMS workbench prompt
  - RMS advisory plan
  - RMS advisory system design
  - RMS composition report
  - RMS route report
  - RMS advisory review
  - RMS advisory intent capture
  - RMS git impact report
  - RMS gate report
  - RMS audit report
  - RMS advisory contract evolution
  - RMS advisory evidence plan
  - RMS workbench run record
  - RMS workbench configuration
  - RMS release readiness report
  - RMS module atlas
  - RMS capability tree scaffold
  - RMS implementation inner structure report
  - RMS local trace bundle report
  - RMS runnable surface declaration
  data:
  - embedded RMS schemas
  - embedded RMS prompt templates
  - generated package metadata
  - generated conformance reports
  - generated git impact reports
  - generated gate reports
  - generated audit reports
  - generated workbench run records
  - generated advisory scaffold plans
  - generated advisory intent-capture prompts
  - generated route reports
  - generated capability tree scaffold artifacts
  - generated module atlas artifacts
  - generated implementation structure reports
  - local trace bundle artifacts
  - generated runnable surface evidence
  - optional workbench configuration
  decisions:
  - manifest-validation-result
  - module-explanation-shape
  - diagnostic-readiness-result
  - prompt-template-selection
  - semantic-scaffold-shape-selection
  - capability-tree-scaffold-selection
  - design-boundary-recommendation
  - composition-result
  - recursive-work-route-recommendation
  - advisory-workflow-shape
  - intent-capture-gate-result
  - git-diff-impact-classification
  - gate-check-selection
  - provider-execution-request
  - workbench-config-resolution
  - workbench-config-initialization
  - release-readiness-result
  - production-readiness-audit-result
  - module-atlas-shape
  - implementation-inner-structure-result
  - local-trace-diagnostic-result
  - runnable-surface-declaration-result
  - runnable-surface-wiring-result
  - package-inclusion-set
  - conformance-outcome
provides:
  commands:
  - name: validate-rms-artifacts
    contract: contracts/validate-rms-artifacts.v1.yaml
  - name: explain-module
    contract: contracts/explain-module.v2.yaml
  - name: diagnose-rms-environment
    contract: contracts/diagnose-rms-environment.v1.yaml
  - name: render-workbench-prompt
    contract: contracts/render-workbench-prompt.v1.yaml
  - name: plan-module-change
    contract: contracts/plan-module-change.v1.yaml
  - name: design-rms-system
    contract: contracts/design-rms-system.v1.yaml
  - name: compose-rms-system
    contract: contracts/compose-rms-system.v1.yaml
  - name: route-rms-work
    contract: contracts/route-rms-work.v1.yaml
  - name: review-module-diff
    contract: contracts/review-module-diff.v1.yaml
  - name: analyze-git-impact
    contract: contracts/analyze-git-impact.v1.yaml
  - name: gate-rms-change
    contract: contracts/gate-rms-change.v1.yaml
  - name: audit-rms-project
    contract: contracts/audit-rms-project.v1.yaml
  - name: refactor-module-workbench
