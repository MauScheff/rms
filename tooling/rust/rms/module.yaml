invariants:
- id: canonical-artifacts-remain-authoritative
  statement: The CLI may inspect, explain, package, and validate RMS artifacts, but it must not create module semantics outside canonical manifests and contracts.
  enforced_by: manifest-first-command-handlers
  verified_by: verification/laws/canonical_artifacts_remain_authoritative.md
- id: diagnostics-are-evidence-not-authority
  statement: Diagnostic, context, package, and conformance outputs must identify their source artifacts and remain derived evidence rather than hidden architectural truth.
  enforced_by: derived-output-renderers
  verified_by: verification/laws/diagnostics_are_evidence_not_authority.md
- id: composite-evidence-lanes-are-concrete
  statement: Composite scaffolds must not declare empty evidence lanes for production claims.
  enforced_by: add-capability-evidence-scaffold
  verified_by: verification/laws/composite_evidence_lanes_are_concrete.md
- id: effect-results-are-canonical-machine-inputs
  statement: Machine-shaped modules that represent effect-result types or envelopes declare semantic effect results and consume them through transitions.
  enforced_by: effect-result-structure-diagnostics
  verified_by: verification/laws/effect_results_are_canonical_machine_inputs.md
- id: boundary-lifecycle-is-trace-evidenced
  statement: Boundary-machine states used for parse, delegation, completion, and rejection are evidenced by replayable transition traces.
  enforced_by: boundary-trace-coverage-audit
  verified_by: verification/laws/boundary_lifecycle_is_trace_evidenced.md
- id: source-drift-has-semantic-record
  statement: Source behavior changes require a committed semantic-change record before strict production audit can pass.
  enforced_by: strict-audit-semantic-drift-check
  verified_by: verification/laws/source_drift_has_semantic_record.md
- id: semantic-revisions-are-applied-canonically
  statement: Semantic and machine revisions that correct scaffold drift must use canonical set, remove, supersedes, launch entrypoint, and active-record rules instead of hand-edited manifest surgery.
  enforced_by: semantic-revision-apply-and-audit
  verified_by: verification/laws/semantic_revisions_are_applied_canonically.md
- id: runnable-surfaces-enter-through-boundaries
  statement: Runnable surfaces adapt outside input into declared RMS commands and must not reimplement domain decisions or call private module internals.
  enforced_by: runnable-surface-structure-diagnostics
  verified_by: verification/contracts/check_runnable_surface.md
- id: runnable-launch-assets-route-through-boundaries
  statement: Launch assets reachable from a runnable surface must route through the declared RMS entrypoint or adapter and must not duplicate parser or domain decision logic outside declared roles.
  enforced_by: runnable-surface-launch-asset-diagnostics
  verified_by: verification/laws/runnable_launch_assets_route_through_boundaries.md
- id: simple-runnable-boundaries-are-stateless-by-default
  statement: Simple runnable app, tool, browser, and CLI boundary scaffolds use stateless boundary machines unless product intent declares lifecycle, order, session, retry, status, recovery, or workflow semantics.
  enforced_by: add-capability-and-surface-scaffold-defaults
  verified_by: verification/laws/simple_runnable_boundaries_are_stateless_by_default.md
- id: bindings-realize-canonical-semantics
  statement: Binding adapters realize canonical module shape, machine roles, runnable surfaces, evidence obligations, public contracts, and dependency links; bindings must not invent semantic roles outside canonical declarations.
  enforced_by: binding-scaffold-model-and-adapters
  verified_by: verification/laws/bindings_realize_canonical_semantics.md
- id: no-effect-scaffolds-have-no-effect-residue
  statement: Scaffolds and source roles for modules with no canonical effects or effect results must not expose effect, effect envelope, effect lifecycle, effect result, or effect-result envelope semantic types.
  enforced_by: canonical-scaffold-flags-and-source-residue-diagnostics
  verified_by: verification/laws/no_effect_scaffolds_have_no_effect_residue.md
- id: bootstrap-provenance-is-visible
  statement: RMS init, diagnose, and gate surfaces must make the git source revision requirement visible before strict audit is treated as production evidence.
  enforced_by: init-diagnose-gate-provenance-guidance
  verified_by: verification/laws/bootstrap_provenance_is_visible.md
- id: reusable-module-consumers-use-public-facade
  statement: Reusable modules declare capabilities and consumers use the RMS public facade instead of private role files.
  kind: invariant
- id: rms-package-carries-declared-implementation-surface
  statement: RMS packages include declared implementation facade and role artifacts needed to verify reuse.
  kind: invariant
- id: semantic-properties-are-canonical-reliability-evidence
  statement: RMS properties define generated input spaces and oracles semantically; language bindings only realize those properties and counterexamples remain replayable evidence.
  kind: invariant
effects:
- name: read-repository-files
  kind: filesystem-read
  capability: filesystem
- name: write-generated-artifacts
  kind: filesystem-write
  capability: filesystem
- name: run-declared-verification
  kind: process-execution
  capability: process-runner
- name: run-optional-ai-provider
  kind: process-execution
  capability: process-runner
- name: read-source-revision
  kind: process-execution
  capability: git-revision-provider
boundary:
  inputs:
  - command-line arguments
  - git diff output
  - optional AI-provider command output
  - YAML manifests
  - JSON conformance reports
  - optional RMS workbench config
  - Codex plugin manifest and packaged skill files
  - TOML package manifests
  - Rust and Swift source files
  - JavaScript source files
  validation:
  - embedded JSON Schema validation for RMS manifests
  - path existence checks for referenced evidence
  - implementation binding checks for Rust and Swift source boundaries
  - advisory inner-structure checks for declared implementation shapes and roles
  trust:
  - Repository files are treated as untrusted input unless they are canonical RMS artifacts.
  - Generated reports are evidence and must not override manifests or contracts.
  - Workbench prompts guide humans and agents but do not perform edits or provider calls.
  - Provider-backed prompt execution is opt-in and records prompts, checks, provider logs, and responses under `.rms/runs`.
  - Workbench config supplies defaults for opt-in provider execution and run record discovery; it must not create RMS module semantics.
compatibility:
  policy: backward-compatible-within-major
verification:
  laws:
  - verification/laws
  - verification/laws/simple_runnable_boundaries_are_stateless_by_default.md
